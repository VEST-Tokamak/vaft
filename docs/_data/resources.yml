data_sources:
  sample-ods:
    title: Packaged offline sample ODS
    description: Deterministic sample data available without credentials.
  hsds-public:
    title: Public VEST HSDS namespace
    description: Read-only shot data accessed with h5pyd and local HSDS configuration.
  raw-daq:
    title: VEST raw DAQ and archived raw dumps
    description: Native diagnostic signals used by machine mapping.
  kinetic-48224:
    title: Paired kinetic sample, shot 48224 at 300 ms
    description: Repository GEQDSK, Thomson and ion Doppler inputs.
  raw-44740:
    title: Archived magnetics sample, shot 44740
    description: Repository raw-signal archive used by the fluctuation notebook.
  external-codes:
    title: EFIT, CHEASE, DCON/RDCON and GPEC installations
    description: Optional external executables resolved from their HOME variables.
