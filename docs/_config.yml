# Configurations
title:            VAFT
longtitle:        Versatile Analytical Framework for Tokamak
author:           VEST-team
description: >
  VAFT is an open-source Python framework for tokamak data analysis: an IMAS-compliant
  data interface built on OMAS, an HSDS remote database of VEST experimental shots,
  machine mapping into standard IDSs, equilibrium and stability code interfaces
  (EFIT, CHEASE, GPEC/DCON), profile fitting, and automated Snakemake pipelines.

version:          1.0
gitbook_version:  3.2.3

url:              'https://vest-tokamak.github.io'
baseurl:          '/vaft'
rss:              RSS

toc:
  enabled: true
  h_min:   2
  h_max:   3

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: monokai

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:title

# Disqus comments
# disqushandler:            sighingnow

# The site is built by docs/build.py and served as prebuilt HTML, so anything
# that is tooling rather than content must not be copied into _site.
exclude:
  - _drafts
  - _posts
  - _others
  - node_modules
  - vendor
  - .bundle
  - playwright-report
  - test-results
  - tests
  - scripts
  - build.py
  - generators.yml
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - playwright.config.js
  - README.md

collections:
  guide:
    output: true
    permalink: /:collection/:title/
  pages:
    output: true
    permalink: /:collection/:path/
  others:
    output: true
    permalink: /:collection/:path/
  redirects:
    output: true
    permalink: /:collection/:path/

ordered_collections:
  - guide
#  - posts
  - pages
  - others

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
