# What this branch's documentation is generated from.
#
# docs/build.py runs each of these against a source tree of this branch, and
# scripts/validate_docs.rb requires every declared output to exist before it
# will validate a build. The list differs between branches on purpose: a branch
# can only generate documentation for the library it actually contains.
#
# vaft.formula.catalog is not listed here because main does not ship it yet; it
# arrives with the next release, together with the reference pages that render
# its output.
generators:
  - module: vaft.machine_mapping.registry
    output: _data/vest_diagnostics.yml
