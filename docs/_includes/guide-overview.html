{% if page.guide %}
<aside class="guide-overview" aria-labelledby="guide-overview-title">
  <h2 id="guide-overview-title">At a glance</h2>
  <dl>
    <dt>Architecture position</dt><dd>{{ page.guide.architecture }}</dd>
    <dt>Prerequisites / inputs</dt><dd>{{ page.guide.prerequisites }}</dd>
    <dt>Expected result</dt><dd>{{ page.guide.expected }}</dd>
    <dt>Status</dt><dd>{{ page.guide.status | default: "Maintained against the pinned develop baseline." }}</dd>
  </dl>
</aside>
{% endif %}
