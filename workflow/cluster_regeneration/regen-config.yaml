# #2147 regeneration run overrides, deep-merged by Snakemake over the pinned
# workflow/automatic_pipeline_1_routine_data_processing/config.yaml (production defaults:
# statistical_891 EFIT preset, era Green tables, `vest: {}` era magnetics policy).
# run_lane.sh appends `cores:` and `shots:`.
base_dir: /srv/vest.filedb        # seen through srvns; the real root is <lane>/filedb
layout: filedb
conda: null
# Whole pipeline 1: raw -> static -> diagnostics [+IMPA] -> eddy -> constraints -> k-file -> EFIT
# -> CHEASE -> DCON/RDCON/STRIDE (mhd_linear) -> ideal GPEC (gpec_ideal). Stage keys keep the
# workflow defaults (chease.run true, gpec.run auto, modules dcon/rdcon/stride/gpec, modes 1,2).
stages: [raw, diagnostics, eddy, efit, chease, mhd_linear, gpec_ideal]
impa:
  enable: true
hsds:
  replicate: false
