# #2147 regeneration run overrides, deep-merged by Snakemake over the pinned
# workflow/automatic_pipeline_1_routine_data_processing/config.yaml (production defaults:
# statistical_891 EFIT preset, era Green tables, `vest: {}` era magnetics policy).
# run_lane.sh appends `cores:` and `shots:`.
base_dir: /srv/vest.filedb        # seen through srvns; the real root is <lane>/filedb
layout: filedb
conda: null
# Whole pipeline 1: raw -> static -> diagnostics [+IMPA] -> eddy -> constraints -> k-file -> EFIT
# -> CHEASE -> DCON/RDCON/STRIDE (mhd_linear) -> ideal GPEC (gpec_ideal). Stage keys keep the
# workflow defaults (chease.run true, gpec.run auto, modules dcon/rdcon/stride/gpec, modes 1,2).
stages: [raw, diagnostics, eddy, efit, chease, mhd_linear, gpec_ideal]
# IMPA: production config.yaml leaves it off. The #2147 pilot ran it on (170 shots selected):
# 168 products were "rejected" and 2 "partial" (acquisition rate 2 MHz vs the declared 25 kHz),
# at ~10 MB/shot. Set true only on the owner's decision.
impa:
  enable: false
# The packaged base-era Green table (vaft/data/efit at the pin, byte-identical), staged by
# run_lane.sh inside the FileDB so base-era k-files carry a /srv/vest.filedb TABLE_DIR/INPUT_DIR
# instead of the cluster worktree's path. Production points it at ${VAFT_DATA_DIR}/efit/ (a
# server worktree path in the stored k-files); remove this block to do the same.
efit:
  table_dir: /srv/vest.filedb/pipeline/efit_tables/packaged-vest-pre-43017-pf1906/
hsds:
  replicate: false
