# Pipeline 2 -- the Thomson lineage.
#
# Canonical layout only: these stages have no shot-first equivalent, because the
# legacy pipeline never produced them.
#
# Paths take `${VAR:-default}`: the environment variable when it is set, the
# vestserver default otherwise. Set VAFT_FILEDB_DIR / VAFT_DIAGNOSTIC_DIR on any
# other host instead of editing this file.
base_dir: ${VAFT_FILEDB_DIR:-/srv/vest.filedb}
layout: filedb

shots: [48226]

external:
  # Where the hand-uploaded .mat files are searched for. Empty lets each mapper
  # use its own default search, which covers the layouts VEST has used.
  data_root: ${VAFT_DIAGNOSTIC_DIR:-/srv/vest.diagnostic}
  # Which ion layout to read: `ces` for CES_{shot}.mat, `ids` for IDS_{shot}.mat.
  ces_options: ids

kinetic:
  # Pressure-point encoding EFIT receives: raw6 (5 Thomson points plus a
  # synthetic edge anchor), raw5, or a 129-point spline in psi.
  encoding: raw6
  # Empty resolves the binary from $EFIT / $EFITHOME.
  executable: ""
  # Named EFIT configuration (vaft.code.efit.PRESETS) for the base magnetic
  # kfile the pressure block is added to; empty is the default (statistical_891),
  # `routine` the legacy one. Use the preset the magnetic EFIT product was built
  # with (efit.preset there).
  efit_preset: ""
  # species: the ion part of the pressure uses the composition stage's n_i/n_e
  # (the C/O dilution); none: the legacy n_i = n_e. Without a composed slice the
  # stage falls back to n_i = n_e whatever this says, and records why.
  dilution: species

composition:
  # transient needs the plasma age (diagnostics onset); a slice without one is
  # skipped and named in the manifest. coronal overstates VEST's charge states.
  ionization: transient
  normalization: ne_weighted_mean
  # OPEN-ADAS ADF11 files are fetched on first use; point this at a warmed cache
  # on a server without network. Empty uses the user cache.
  adf11_cache_dir: ""

ti_inference:
  # Relative one-sigma model-form uncertainty of the magnetic EFIT pressure
  # (#874), and the window [s] of neighbouring slices whose spread can exceed it.
  floor: 0.17
  window_s: 0.001

resistive_zeff:
  # Lane Z's estimator (#1214) has no defaults for these: they are stated here and
  # recorded in the product. One Z_eff for the whole current-carrying window.
  model: redl              # redl | sauter | spitzer_nrl
  ln_lambda: sauter        # a number, or sauter (n_e, T_e dependent)
  bounds: [1.0, 8.0]
  i_ni_a: 0.0              # non-inductive current [A]; 0 asserts a purely Ohmic window
  smoothing:
    window_s: null         # null = none; else a local polynomial of this window [s]
    order: 2
  max_excluded_current: 0.05   # a state with more j_tor outside its profiles is dropped
  inductive_max: 1.0           # a state with |V_I|/|V_B| at or above this is dropped

hsds:
  replicate: false
  attempts: 3
  retry_delay: 5.0
  concurrency: 4

conda: null
