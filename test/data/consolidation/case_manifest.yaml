# Scientific regression portfolio for the VAFT consolidation (issue #2166, Scope A).
#
# One record per case.  A case is *requested evidence*, not a passed check:
# every `status` below is `not_tested` until the test that consumes it has run
# against the migrated code and its result is recorded here with the revision
# it ran on.  Nothing in this file may say `passed` on the strength of
# availability alone (#2166 A2: "a requested shot is not a passing validation
# case until its required inputs are available and its tests have been
# executed").  `test/test_consolidation_case_manifest.py` enforces that.
#
# Field meanings
#   purpose          the scientific question the case answers
#   evidence_types   historical_regression | analytic | experimental_physical
#                    (#2166 3.1 A/B/C; a case may carry more than one)
#   required_inputs  what the case needs; `path` is repository-relative when
#                    the input is packaged, and `sha256` is the frozen identity
#                    of that file (verified by the manifest test).  An input
#                    that is not packaged has `available_offline: false` and
#                    names where it lives.
#   requires_vestserver_raw
#                    true when at least one required input exists only on the
#                    VEST database / vestserver FileDB.  Those cases cannot be
#                    run from a checkout; they were NOT accessed to build this.
#   selection        why this case is in the portfolio (documented criterion,
#                    #2166 A1), so the list is not chosen for agreement.
#
# Baselines: `workflow/architecture_audit/capture_baseline.py` captures the
# pre-migration array-by-array identity of the offline cases (39915, 41524,
# 41672, 42962).  Pre-migration ODS baselines are deliberately NOT captured
# yet: they must reflect develop after PR #2135 (zero-phase probe low-pass)
# lands, or the baseline would pin a filter that is about to change.

