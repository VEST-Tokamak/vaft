name: Package CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# A second push to a PR should supersede the first run rather than race it:
# this workflow bills ~25 minutes, and every other workflow here already does
# this. Pushes to develop/main still run to completion, so the history of what
# passed on an integration branch stays intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Verify data policy and artifact size
        run: python test/verify_dist.py dist --max-wheel-mib 25

      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/vaft-wheel-test
          /tmp/vaft-wheel-test/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/vaft-wheel-test/bin/python -c "import vaft; print(vaft.__version__)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install vaft with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        # Deliberately serial. VAFT is a scientific validation suite, so the
        # required check runs in one process with one deterministic execution
        # environment. xdist was measured here (see #413) and rejected: it cut
        # the job from 19m55s to 15m51s, but xdist's loadfile scheduler assigns
        # files to workers dynamically by completion timing, so a test's view of
        # the process-local lru_caches in vaft/machine_mapping varies run to
        # run. A 20% wall-clock saving does not pay for non-reproducible fixture
        # state in the check that gates every merge.
        #
        # pytest-xdist stays in [dev] for local iteration; it is not the
        # canonical mode. See #413 for what a future optimization must show.
        run: python -m pytest -q

  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The freshness check diffs the change against its base.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tutorial validation and TeX dependencies
        run: |
          # nbformat validates the notebooks; PyYAML parses the Quarto deck's
          # front matter in test/verify_tutorial.py.
          python -m pip install nbformat pyyaml
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-pictures

      - name: Verify committed tutorial source and artifacts
        run: python test/verify_tutorial.py

      - name: Verify every changed deck input ships a rebuilt PDF
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python test/verify_tutorial_freshness.py pairing --base "$BASE_SHA" --head HEAD

      - name: Snapshot the committed decks before rebuilding
        run: |
          mkdir -p "${RUNNER_TEMP}/committed-decks"
          cp tutorial/[0-9][0-9]_*.pdf "${RUNNER_TEMP}/committed-decks/"

      - name: Rebuild tutorial slide decks independently
        run: make -B -C tutorial slides

      # The runner builds on a different TeX Live release than the one that
      # produced the committed PDFs, and pdfTeX stamps its own version into
      # every file, so the rebuild is compared on page structure rather than
      # byte-for-byte.
      - name: Verify the rebuild reproduces the committed decks
        run: |
          python test/verify_tutorial.py
          python test/verify_tutorial_freshness.py compare \
            --committed "${RUNNER_TEMP}/committed-decks" \
            --rebuilt tutorial

      # --- Quarto presentation pilot (issue #322) --------------------------
      # Session 01's slides are a .qmd rendered to both backends. Nothing is
      # committed, so CI is what proves the source still builds, and the
      # artifacts are how a reviewer compares the two forms side by side.
      # Pinned: under the end-state rule this job is the only producer of the
      # decks, so an upstream Quarto release must not be able to break the build
      # with no local signal.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.36"

      # librsvg2-bin supplies rsvg-convert. LaTeX cannot embed an SVG directly,
      # so Quarto shells out to convert figures for the Beamer output; without
      # it the render dies on the first SVG. It is present on most developer
      # machines by accident, which is exactly why CI has to install it.
      - name: Install the TeX packages and SVG converter Quarto's Beamer output needs
        run: sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended librsvg2-bin

      - name: Render the presentation pilot to both backends
        run: make -C tutorial presentations

      - name: Upload the rendered decks for review
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pilot
          if-no-files-found: error
          path: |
            tutorial/presentations/*.html
            tutorial/presentations/*.pdf
            tutorial/presentations/*_files/
