name: Package CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# A second push to a PR should supersede the first run rather than race it:
# this workflow bills ~25 minutes, and every other workflow here already does
# this. Pushes to develop/main still run to completion, so the history of what
# passed on an integration branch stays intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Verify data policy and artifact size
        run: python test/verify_dist.py dist --max-wheel-mib 25

      - name: Smoke-test the installed wheel
        run: |
          python -m venv /tmp/vaft-wheel-test
          /tmp/vaft-wheel-test/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/vaft-wheel-test/bin/python -c "import vaft; print(vaft.__version__)"

  # The two gates this workflow implements, stated once here (#515):
  #
  #   develop  development confidence -- is this change safe to integrate?
  #            required: `package` and `core-test`
  #   main     release confidence     -- is this state scientifically validated
  #            and supported on every platform VAFT declares?
  #            required: `package`, `test` and `tutorial`
  #
  # Full cross-platform validation is essential for VAFT, but it does not have
  # to be paid on every intermediate feature PR. Before this split a PR into
  # develop waited ~34 minutes to re-prove Windows support that nothing in the
  # change had touched.
  core-test:
    name: core-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install vaft with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the development-confidence selection
        # This job is NOT a Linux platform-support claim. Linux is simply the
        # canonical environment the development-confidence suite runs in; the
        # platform claim is made by `test-matrix` on the main gate.
        #
        # `core` is a curated selection -- import and namespace contracts,
        # public API and layer boundaries, registries and taxonomies,
        # serialization smoke, packaging policy -- declared in one place, in
        # test/core_selection.py, and applied by test/conftest.py. It is chosen
        # from measured per-module durations rather than from filenames, and
        # test/test_core_selection.py holds it to what it declares.
        #
        # `not perf` for the same reason the Windows leg drops it: a `perf`
        # test asserts a wall-clock ratio, and this job's whole purpose is to
        # be quick, so it is the last place a timing budget should be trusted.
        # They are release-confidence measurements and run on the main gate.
        #
        # Serial for the same reason test-matrix is: see the note there.
        run: python -m pytest -q -m "core and not perf"

  test-matrix:
    name: test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # The full suite is release qualification, so it runs for the main gate and
    # for the integration branches themselves -- but not for a PR into develop,
    # which is gated by `core-test` instead. Keeping it on the push to develop
    # costs no merge latency and is what stops a platform regression from
    # waiting until develop -> main to be found: it surfaces within one merge,
    # non-blocking, on the branch that caused it.
    #
    # `workflow_dispatch` falls through to true, so a full run is always one
    # click away.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    strategy:
      # A platform-specific failure should report on its own rather than hide
      # behind whichever leg happened to fail first.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          # install/README.md calls native Windows a first-class VAFT path.
          # Until 0.6.2 nothing enforced that: the suite had never run on
          # Windows, where 25 tests failed and two defects stopped collection
          # outright. This leg is what keeps the claim honest.
          - os: windows-latest
            label: Windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install vaft with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        # Deliberately serial. VAFT is a scientific validation suite, so the
        # required check runs in one process with one deterministic execution
        # environment. xdist was measured here (see #413) and rejected: it cut
        # the job from 19m55s to 15m51s, but xdist's loadfile scheduler assigns
        # files to workers dynamically by completion timing, so a test's view of
        # the process-local lru_caches in vaft/machine_mapping varies run to
        # run. A 20% wall-clock saving does not pay for non-reproducible fixture
        # state in the check that gates every merge.
        #
        # pytest-xdist stays in [dev] for local iteration; it is not the
        # canonical mode. See #413 for what a future optimization must show.
        #
        # Running serially is also what makes the `perf` budgets meaningful:
        # they assert wall-clock ratios, and it was four xdist workers on a
        # four-core runner that used to push them under budget. They no longer
        # need a job of their own.
        #
        # The selection is built here rather than in a `${{ }}` expression
        # because it now has two independent axes, and one shell script that
        # names each reason is easier to audit than a nested ternary.
        shell: bash
        # Passed as environment data, never interpolated into the script.
        # `${{ }}` is substituted before bash parses the line, so a ref name
        # carrying a shell metacharacter would be executed rather than
        # compared -- the standard Actions script-injection shape. These
        # particular refs are not attacker-controlled, but the safe form costs
        # nothing.
        env:
          BASE_REF: ${{ github.base_ref }}
          CURRENT_REF: ${{ github.ref }}
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          selection=()

          # main is the release gate and runs everything. Everything else
          # reaching this job -- the push to develop, a manual dispatch --
          # deselects `slow`: notebook-execution checks, which are
          # release-confidence rather than integration feedback. Nothing is
          # skipped anywhere; `slow` tests move to the main gate, they do not
          # stop running.
          #
          # Both halves of the condition are needed. `base_ref` is set only on
          # pull requests, so a push to main -- which is how a release lands --
          # would otherwise run the reduced develop selection.
          if [ "$BASE_REF" != "main" ] && [ "$CURRENT_REF" != "refs/heads/main" ]; then
            selection+=("not slow")
          fi

          # `perf` budgets are calibrated against the Linux runner class, and a
          # ratio measured on another OS is a different measurement rather than
          # a stricter one: test_substantially_faster_than_legacy scored 3.13x
          # against its 5x budget on Windows under load, and passed in
          # isolation. Gating a required check on that would make it
          # intermittently red without saying anything about VAFT.
          if [ "$RUNNER_PLATFORM" != "Linux" ]; then
            selection+=("not perf")
          fi

          expression=""
          for term in "${selection[@]}"; do
            if [ -z "$expression" ]; then
              expression="$term"
            else
              expression="$expression and $term"
            fi
          done

          if [ -z "$expression" ]; then
            echo "running the whole suite"
            python -m pytest -q
          else
            echo "running with -m \"$expression\""
            python -m pytest -q -m "$expression"
          fi

  # `test` is the required status check on main (.github/rulesets/main.json),
  # and a matrix renames its contexts to "test (Linux)" / "test (Windows)".
  # This job keeps the required name pointing at a single verdict that is green
  # only when every leg is, so adding a platform never silently drops the gate.
  #
  # It carries the same condition as test-matrix, not `always()` alone: on a PR
  # into develop the matrix is skipped, and `always()` by itself would run this
  # job, read `skipped`, and report red on every develop PR.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: test-matrix
    if: always() && (github.event_name != 'pull_request' || github.base_ref == 'main')
    steps:
      - name: Every test leg must have passed
        run: |
          echo "test-matrix result: ${{ needs.test-matrix.result }}"
          test "${{ needs.test-matrix.result }}" = "success"

  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The freshness check diffs the change against its base.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tutorial validation and TeX dependencies
        run: |
          # nbformat validates the notebooks; PyYAML parses the Quarto deck's
          # front matter in test/verify_tutorial.py.
          python -m pip install nbformat pyyaml
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-pictures

      - name: Verify committed tutorial source and artifacts
        run: python test/verify_tutorial.py

      - name: Verify every changed deck input ships a rebuilt PDF
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python test/verify_tutorial_freshness.py pairing --base "$BASE_SHA" --head HEAD

      - name: Snapshot the committed decks before rebuilding
        run: |
          mkdir -p "${RUNNER_TEMP}/committed-decks"
          cp tutorial/[0-9][0-9]_*.pdf "${RUNNER_TEMP}/committed-decks/"

      - name: Rebuild tutorial slide decks independently
        run: make -B -C tutorial slides

      # The runner builds on a different TeX Live release than the one that
      # produced the committed PDFs, and pdfTeX stamps its own version into
      # every file, so the rebuild is compared on page structure rather than
      # byte-for-byte.
      - name: Verify the rebuild reproduces the committed decks
        run: |
          python test/verify_tutorial.py
          python test/verify_tutorial_freshness.py compare \
            --committed "${RUNNER_TEMP}/committed-decks" \
            --rebuilt tutorial

      # --- Quarto presentation pilot (issue #322) --------------------------
      # Session 01's slides are a .qmd rendered to both backends. Nothing is
      # committed, so CI is what proves the source still builds, and the
      # artifacts are how a reviewer compares the two forms side by side.
      # Pinned: under the end-state rule this job is the only producer of the
      # decks, so an upstream Quarto release must not be able to break the build
      # with no local signal.
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.36"

      # librsvg2-bin supplies rsvg-convert. LaTeX cannot embed an SVG directly,
      # so Quarto shells out to convert figures for the Beamer output; without
      # it the render dies on the first SVG. It is present on most developer
      # machines by accident, which is exactly why CI has to install it.
      - name: Install the TeX packages and SVG converter Quarto's Beamer output needs
        run: sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended librsvg2-bin

      - name: Render the presentation pilot to both backends
        run: make -C tutorial presentations

      - name: Upload the rendered decks for review
        uses: actions/upload-artifact@v4
        with:
          name: presentation-pilot
          if-no-files-found: error
          path: |
            tutorial/presentations/*.html
            tutorial/presentations/*.pdf
            tutorial/presentations/*_files/
