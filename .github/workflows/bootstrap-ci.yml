name: Bootstrap CI

# Exercises the student-facing installation path from install/ on every
# supported platform. Kept separate from Package CI so the release gate is
# unaffected by changes to the course bootstrap.

on:
  pull_request:
    paths:
      - "install/**"
      - "environment.yml"
      - "pyproject.toml"
      - "test/test_install_bootstrap.py"
      - ".github/workflows/bootstrap-ci.yml"
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, credential-free contract tests: checker unit tests, the
  # non-destructive-Git guarantees, and the environment.yml/pyproject.toml
  # consistency rules.
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest pyyaml

      - name: Run the bootstrap contract tests
        run: python -m pytest test/test_install_bootstrap.py -q

      - name: Lint the shell entry points
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=warning install/*.sh

  # The real thing: create the environment from a clean runner, twice.
  bootstrap:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            script: bash install/linux.sh
            shell: bash -el {0}
          - os: macos-latest
            label: macOS
            script: bash install/macos.sh
            shell: bash -el {0}
          - os: windows-latest
            label: Windows (native)
            script: powershell -ExecutionPolicy Bypass -File install\windows_native.ps1
            shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: true
          activate-environment: ""

      # The bootstrap must be safe to repeat: the first run creates the
      # environment, the second must update it in place without duplicating the
      # Jupyter kernel or recreating a working environment.
      - name: Bootstrap (first run)
        run: ${{ matrix.script }}

      - name: Bootstrap (second run, idempotency)
        run: ${{ matrix.script }}

      # Offline only. CI never has HSDS credentials and must never need them.
      - name: Environment check (offline)
        run: conda run -n vaft python install/check_vaft_environment.py

      # Jupyter keys kernelspecs by name and the bootstrap always registers with
      # a fixed `--name vaft`, so two runs cannot leave two kernels behind. What
      # is worth asserting after the second run is that the kernel is still there.
      - name: The Python (vaft) kernel survives a repeated bootstrap
        run: conda run -n vaft python -c "import json, subprocess, sys; payload = subprocess.run([sys.executable, '-m', 'jupyter', 'kernelspec', 'list', '--json'], capture_output=True, text=True, check=True).stdout; specs = json.loads(payload)['kernelspecs']; print(sorted(specs)); sys.exit(0 if specs.get('vaft', {}).get('spec', {}).get('display_name') == 'Python (vaft)' else 1)"

      # The bootstrap must never dirty the student's checkout.
      - name: The checkout is left clean
        run: git diff --exit-code

      - name: No stray files were created in the checkout
        run: conda run -n vaft python -c "import subprocess, sys; dirty = subprocess.run(['git', 'status', '--porcelain', '--untracked-files=all'], capture_output=True, text=True, check=True).stdout; print(dirty or '(clean)'); sys.exit(1 if dirty.strip() else 0)"
