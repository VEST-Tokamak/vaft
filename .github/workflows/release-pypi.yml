name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  # Lets the build job be exercised on a branch without cutting a release.
  # The publish job stays tag-only, so a branch dispatch cannot reach PyPI.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          package_version=$(python -c "from vaft.version import __version__; print(__version__)")
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
          python test/verify_dist.py dist --max-wheel-mib 25

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  # download-artifact otherwise appears only in the tag-gated publish job, so a
  # branch dispatch would exercise the upload half of the artifact round trip
  # and nothing else. This job closes that gap: it is the same download the
  # release performs, with no PyPI environment and no id-token permission, so
  # it rehearses the handoff without being able to publish anything.
  verify-artifact:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Check the artifact carries the built distributions
        run: |
          ls -l dist/
          test -n "$(find dist -name '*.whl' -print -quit)"
          test -n "$(find dist -name '*.tar.gz' -print -quit)"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/vaft
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
