    type: float or np.ndarray
    unit: A/m^2
    description: Current density along the cut.
  sections:
  - title: Convention
    text: 'Sign follows the COCOS $\sigma_{B_p}$ of the supplied component: with the

      midplane $B_Z$ of a standard equilibrium the result has the sign of the

      plasma current.  The $\partial B_R/\partial Z$ contribution is neglected, so

      the answer is exact only on the midplane of an up-down symmetric equilibrium.'
  - title: Numerical notes
    text: '``numpy.gradient`` along the single supplied axis (second-order interior,

      first-order ends); pass a 1-D slice, not a 2-D map.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.1 (Ampere's law in the
      tokamak).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.current_density_from_psi
  name: current_density_from_psi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psi, R)
  summary: Radial-derivative current-density estimate from a poloidal flux cut.
  description: $$j = -\frac{1}{\mu_0 R}\,\frac{d\psi}{dR}$$
  parameters:
  - name: psi
    type: float or np.ndarray
    unit: Wb/rad
    description: Poloidal flux along a 1-D radial cut.
  - name: R
    type: float or np.ndarray
    unit: m
    description: Major radius of the samples, monotonic.
  returns:
  - name: null
    type: float or np.ndarray
    unit: A/m
    description: The quantity $-(\mu_0 R)^{-1}\,d\psi/dR$.
  sections:
  - title: Convention
    text: 'Hard-codes the historical $k=-1$ (weber-per-radian, COCOS 2/3/6/7) prefactor

      inline instead of going through ``poloidal_field_factor``, so unlike the

      $B_R$/$B_Z$ helpers it cannot be told the COCOS.  Tracked in #355.'
  - title: Limitations
    text: '$-(1/R)\,d\psi/dR$ is $B_Z$, so this expression is $B_Z/\mu_0$: a current per

      unit length [A/m], not the toroidal current density $j_\varphi = -\Delta^*\psi

      /(\mu_0 R)$ [A/m^2], which needs second derivatives.  Kept unchanged for

      compatibility; use ``profiles_2d.j_tor`` or ``current_density_from_B``

      with $B_Z$ for a density.  Tracked in #355.'
  - title: Numerical notes
    text: '``numpy.gradient`` along the single supplied axis; pass a 1-D slice.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.3 (Grad-Shafranov equation,
      $\mu_0 R j_\varphi = -\Delta^*\psi$).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.current_drive_efficiency
  name: current_drive_efficiency
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (n_e, T_e_keV, Z_eff=1.0)
  summary: Heuristic lower-hybrid current-drive efficiency $\eta_{CD}$.
  description: $$\eta_{CD} = 0.3\,\sqrt{\frac{n_e\,T_e}{Z_{\mathrm{eff}}}}$$
  parameters:
  - name: n_e
    type: float
    unit: any
    description: Electron density in the unit the coefficient was fitted for. The original source does
      not record which.
  - name: T_e_keV
    type: float
    unit: keV
    description: Electron temperature.
  - name: Z_eff
    type: float, optional
    unit: '-'
    description: Effective charge; default 1.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Efficiency figure in the coefficient's own normalisation.
  sections:
  - title: Physical interpretation
    text: 'Lower-hybrid current drive becomes more efficient at higher temperature and

      lower $Z_{\mathrm{eff}}$ because the wave-driven fast electrons slow down on

      a hotter, cleaner background; the density factor here is unusual (the

      standard figure of merit $\eta = n_e I_{CD} R / P$ *divides* by density).'
  - title: Validity
    text: 'Empirical fit.  Labelled "ITER scaling for lower hybrid current drive" in the

      original VAFT source; no publication, dataset or unit system for the

      coefficient 0.3 was recorded, so the number is a placeholder.  The theory of

      the efficiency and its $T_e/Z_{\mathrm{eff}}$ dependence is Fisch [1].'
  - title: Limitations
    text: 'Unsourced coefficient and unstated density unit; treat the result as

      qualitative.  Tracked in #361.'
  references:
  - label: '1'
    text: N. J. Fisch, Rev. Mod. Phys. 59 (1987) 175, Sec. VI (lower-hybrid current-drive efficiency).
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.current_limit_from_beta
  name: current_limit_from_beta
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (beta_N, a, B0)
  summary: Current figure obtained by substituting $\beta_N$ for $q$ in the cylindrical relation.
  description: $$I_p = \frac{2\pi a^2 B_0}{\mu_0\,\beta_N}$$
  parameters:
  - name: beta_N
    type: float
    unit: '-'
    description: Normalised beta in whatever convention the caller uses.
  - name: a
    type: float
    unit: m
    description: Minor radius.
  - name: B0
    type: float
    unit: T
    description: Toroidal field on axis.
  returns:
  - name: null
    type: float
    unit: A m
    description: The expression above.
  sections:
  - title: Limitations
    text: 'Dimensionally the cylindrical-$q$ formula with $\beta_N$ in the place of $q$;

      no derivation or source records what this is meant to bound, and the result

      depends on the units chosen for $\beta_N$.  Kept for compatibility; prefer

      ``vaft.formula.stability.beta_N_from_beta_a_B0_Ip`` and the Troyon limit.

      Tracked in #362.'
  references:
  - label: '1'
    text: F. Troyon et al., Plasma Phys. Control. Fusion 26 (1984) 209 (the $\beta_N$ limit this appears
      to invert).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.current_limit_from_q
  name: current_limit_from_q
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (q_95, a, B0)
  summary: Plasma current at a prescribed edge safety factor, cylindrical approximation.
  description: '$$I_p = \frac{2\pi a^2 B_0}{\mu_0\,q_{95}}$$


    the inversion of $q_{cyl} = 2\pi a^2 B_0/(\mu_0 R\,I_p)\times R/R$ for a

    circular cross-section written per unit major radius.'
  parameters:
  - name: q_95
    type: float
    unit: '-'
    description: Target safety factor at the 95% flux surface.
  - name: a
    type: float
    unit: m
    description: Minor radius.
  - name: B0
    type: float
    unit: T
    description: Toroidal field on axis.
  returns:
  - name: null
    type: float
    unit: A m
    description: Plasma current reaching ``q_95``.
  sections:
  - title: Assumptions
    text: 'Circular, large-aspect-ratio cylinder with $q_{95}$ standing in for the

      cylindrical $q_a$.'
  - title: Limitations
    text: 'As written the expression lacks the $1/R$ of the cylindrical safety factor

      $q = 2\pi a^2 B_0/(\mu_0 R I_p)$ and therefore returns $I_p R$ [A m], not a

      current; divide by $R$ for amperes.  Elongation is ignored.  Tracked in #362.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.4 (cylindrical safety
      factor).
