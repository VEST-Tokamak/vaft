- id: equilibrium.normalized_collisionality_from_a_n_q_epsilon_T
  name: normalized_collisionality_from_a_n_q_epsilon_T
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (a, n, q, epsilon, T_eV, C=1.0)
  summary: Collisionality scaling form $\nu_* \propto a\,n\,q/(\varepsilon^{5/2}T^2)$.
  description: '$$\nu_* = C\,\frac{a\,n\,q}{\varepsilon^{5/2}\,T^2}$$


    which is the Sauter form $\nu_* = 6.921\times10^{-18}\,qRn\ln\Lambda/

    (T^2\varepsilon^{3/2})$ with $R = a/\varepsilon$ and $C = 6.921\times10^{-18}

    \ln\Lambda$ (electrons; times $Z^4$ for ions).'
  parameters:
  - name: a
    type: float
    unit: m
    description: Minor radius.
  - name: n
    type: float
    unit: m^-3
    description: Density.
  - name: q
    type: float
    unit: '-'
    description: Safety factor.
  - name: epsilon
    type: float
    unit: '-'
    description: Inverse aspect ratio.
  - name: T_eV
    type: float
    unit: eV
    description: Temperature.
  - name: C
    type: float, optional
    unit: '-'
    description: Proportionality constant; default 1 gives only the scaling.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Collisionality, or with the default ``C`` only its scaling.
  sections:
  - title: Raises
    text: "ValueError\n    For non-positive ``epsilon`` or ``T_eV``."
  - title: Convention
    text: 'With ``C=1`` the number is not $\nu_*$ but proportional to it; supply

      $C = 6.921\times10^{-18}\ln\Lambda$ (with $n$ in m^-3 and $T$ in eV) for

      Sauter''s electron collisionality.  Tracked with the other two definitions in

      #353.'
  references:
  - label: '1'
    text: O. Sauter, C. Angioni and Y. R. Lin-Liu, Phys. Plasmas 6 (1999) 2834, Eq. (18b).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.normalized_collisionality_from_nu_ii_T_i_M_i_R_a_q
  name: normalized_collisionality_from_nu_ii_T_i_M_i_R_a_q
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (nu_ii, T_i_eV, M_i, R, a, q)
  summary: Ion collisionality $\nu_*$ from a collision frequency.
  description: "$$\\nu_* = \\nu_{ii}\\left(\\frac{M_i}{eT_i}\\right)^{1/2}\\left(\\frac{R}{a}\\right)^{3/2}\
    \ qR\n  = \\frac{\\nu_{ii}\\,qR}{\\varepsilon^{3/2}\\,v_{th,i}}$$\n\nthe ratio of the effective detrapping\
    \ frequency to the bounce frequency,\nwith $v_{th,i} = \\sqrt{eT_i/M_i}$."
  parameters:
  - name: nu_ii
    type: float
    unit: 1/s
    description: Ion-ion collision frequency.
  - name: T_i_eV
    type: float
    unit: eV
    description: Ion temperature.
  - name: M_i
    type: float
    unit: kg
    description: Ion mass.
  - name: R
    type: float
    unit: m
    description: Major radius.
  - name: a
    type: float
    unit: m
    description: Minor radius.
  - name: q
    type: float
    unit: '-'
    description: Safety factor.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Normalised collisionality.
  sections:
  - title: Convention
    text: 'Thermal speed $\sqrt{T/m}$ (no factor 2) and the collision frequency

      supplied by the caller; with Sauter''s $\nu_{ii}$ this is Sauter Eq. (18b)

      without its numeric prefactor.  Two other $\nu_*$ definitions live in this

      package (``normalized_collisionality_from_a_n_q_epsilon_T`` and

      ``nu_star_from_n_T_B_R_epsilon_kappa_I``); tracked in #353.'
  - title: Physical interpretation
    text: '$\nu_* \ll 1$ is the banana (collisionless) regime, $\nu_* \gg

      \varepsilon^{-3/2}$ the Pfirsch-Schluter regime.'
  references:
  - label: '1'
    text: O. Sauter, C. Angioni and Y. R. Lin-Liu, Phys. Plasmas 6 (1999) 2834, Eq. (18b).
  - label: '2'
    text: F. L. Hinton and R. D. Hazeltine, Rev. Mod. Phys. 48 (1976) 239, Sec. IV (collisionality regimes).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
