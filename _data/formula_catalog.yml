- id: equilibrium.triangularity_from_RZ_boundary
  name: triangularity_from_RZ_boundary
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (R, Z, R0)
  summary: Boundary triangularity $\delta$ from the midplane intersection.
  description: "$$\\delta = \\frac{R_0 - R_{\\mathrm{sep}}|_{Z=0}}{a}, \\qquad\n  a = \\frac{R_{\\max}\
    \ - R_{\\min}}{2}$$"
  parameters:
  - name: R
    type: np.ndarray
    unit: m
    description: Major radius of the boundary points.
  - name: Z
    type: np.ndarray
    unit: m
    description: Height of the boundary points.
  - name: R0
    type: float
    unit: m
    description: Reference major radius, normally the geometric centre.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Triangularity.
  sections:
  - title: Convention
    text: 'Uses the *single* boundary point closest to $Z=0$, so the result is a

      property of the midplane crossing chosen by ``argmin``, not the standard

      $\delta = (R_0 - R_{Z_{\max}})/a$ evaluated at the top and bottom

      extremities (IMAS ``triangularity_upper``/``lower``).  Positive means the

      crossing lies inboard of ``R0``.'
  - title: Limitations
    text: 'Whether the inboard or outboard midplane point is picked depends on which is

      nearer $Z=0$ in the sampling, so the sign is not stable; prefer the

      IMAS-style extremity definition for reported values.  Tracked in #365.'
  references:
  - label: '1'
    text: IMAS Data Dictionary, ``equilibrium.time_slice[:].boundary.triangularity``.
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.1.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.verify_kadomtsev_constraint
  name: verify_kadomtsev_constraint
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (mu_rho, mu_beta, mu_nu, a_P)
  summary: Reconstruct the Kadomtsev constraint value from dimensionless indices.
  description: '$$x = 5 + \mu_\rho(1 + \alpha_P) - \frac{3}{2}\left(\mu_\rho + 2\mu_\beta - 4\mu_\nu -
    2\right)$$


    which should return 5 when the dimensionless mapping of

    ``dimensionless_scaling_coeffs_from_engineering_scaling_coeffs``

    preserves the identity $\alpha_L + 2\alpha_n + \alpha_B^* - 3\alpha_P = 5$.'
  parameters:
  - name: mu_rho
    type: float
    unit: '-'
    description: Gyroradius index.
  - name: mu_beta
    type: float
    unit: '-'
    description: Beta index.
  - name: mu_nu
    type: float
    unit: '-'
    description: Collisionality index.
  - name: a_P
    type: float
    unit: '-'
    description: Engineering exponent of the heating power.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Reconstructed constraint value, 5 for a consistent mapping.
  sections:
  - title: Limitations
    text: 'Evaluates a different expression from

      ``check_kadomtsev_constraint`` (which uses the engineering exponents

      directly) and the two need not agree; tracked in #351.'
  references:
  - label: '1'
    text: B. B. Kadomtsev, Sov. J. Plasma Phys. 1 (1975) 295.
  - label: '2'
    text: T. C. Luce, C. C. Petty and J. G. Cordey, Plasma Phys. Control. Fusion 50 (2008) 043001.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.vertical_magnetic_field_from_psi
  name: vertical_magnetic_field_from_psi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psi, R, Z, cocos=None)
  summary: Vertical magnetic field $B_Z$ from the poloidal flux map.
  description: "$$B_Z = -\\frac{k}{R}\\,\\frac{\\partial\\psi}{\\partial R}, \\qquad\n  k = \\frac{\\\
    sigma_{R\\varphi Z}\\,\\sigma_{B_p}}{(2\\pi)^{e_{B_p}}}$$\n\nwith $k$ from ``poloidal_field_factor``\
    \ (Sauter Eq. 20)."
  parameters:
  - name: psi
    type: np.ndarray
    unit: Wb/rad or Wb
    description: Poloidal flux along the radial direction; a 1-D cut in $R$.
  - name: R
    type: np.ndarray
    unit: m
    description: Major radius of the samples, monotonic.
  - name: Z
    type: np.ndarray
    unit: m
    description: Vertical coordinate of the samples, unused by the derivative.
  - name: cocos
    type: int or None, optional
    unit: '-'
    description: COCOS index fixing sign and $2\pi$; ``None`` = per-radian, $k=-1$.
  returns:
  - name: null
    type: np.ndarray
    unit: T
    description: Vertical field on the samples.
  sections:
  - title: Convention
    text: '``cocos=None`` assumes ``psi`` in Wb/rad with $\sigma_{B_p}\sigma_{R\varphi Z}

      =-1$ (COCOS 2/3/6/7).  A full-weber map (IMAS Data Dictionary,

      ``vaft.formula.green.green_psi_exact``) passed without ``cocos``

      overestimates $|B_Z|$ by $2\pi$; convert with

      ``vaft.data.eqdsk.ods_psi_to_wb_per_radian_factor`` or pass the index.'
  - title: Assumptions
    text: 'Axisymmetry.  The derivative is taken along the *first* axis of ``psi``

      against ``R``, so the map must be indexed ``[R]`` or ``[R, Z]``.'
  - title: Numerical notes
    text: '``numpy.gradient`` (second-order interior, first-order one-sided ends).'
  references:
  - label: '1'
    text: O. Sauter and S. Yu. Medvedev, Comput. Phys. Commun. 184 (2013) 293, Eq. (20) and Table I.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.virial_D0_boundary_from_bp_li_eK
  name: virial_D0_boundary_from_bp_li_eK
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (beta_p, li_int, eK, b_minor, R_plasma)
  summary: Boundary Shafranov shift $D_0(b)$ from $\beta_p$, $l_i$ and elongation.
  description: "$$D_0(b) = -\\frac{b}{2R_{\\mathrm{plasma}}}\\;\n  \\frac{2\\beta_p + l_i + \\tfrac{1}{2}e_K}{1\
    \ + \\tfrac{1}{2}e_K}$$"
  parameters:
  - name: beta_p
    type: float
    unit: '-'
    description: Poloidal beta.
  - name: li_int
    type: float
    unit: '-'
    description: Internal inductance.
  - name: eK
    type: float
    unit: '-'
    description: Elongation parameter $(\kappa^2-1)/(\kappa^2+1)$.
  - name: b_minor
    type: float
    unit: m
    description: Minor radius at which the shift is evaluated.
  - name: R_plasma
    type: float
    unit: m
    description: Plasma major radius.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Normalised shift $D_0$ at radius ``b_minor``.
  sections:
  - title: Convention
    text: 'Negative sign convention of Martynov and Pustovitov: the magnetic axis moves

      outboard, so $D_0 < 0$ for positive $\beta_p + l_i/2$.'
  - title: Validity
    text: First order in $b/R$; elongation through $e_K$ only.
  references:
  - label: '1'
    text: A. A. Martynov and V. D. Pustovitov, Phys. Plasmas 31 (2024), "Virial relations for elongated
      plasmas in tokamaks", Eq. (37).
