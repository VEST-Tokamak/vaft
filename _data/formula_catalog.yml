    text: 'Identical to ``vaft.formula.utils.trapz_integral`` (``numpy.trapezoid``

      via ``vaft.compat.trapz_compat``) but defined here so the Green''s

      function module does not import the sklearn-heavy utilities; this copy is

      the one ``vaft.formula.trapz_integral`` resolves to.'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: atomic.fractional_abundances
  name: fractional_abundances
  category: atomic
  module: vaft.formula.atomic
  signature: (ne_m3, te_eV, acd, scd)
  summary: Ionisation-equilibrium (coronal) fractional abundances from ACD and SCD tables.
  description: "$$\\frac{f_{z+1}}{f_z} = \\frac{S_z(n_e, T_e)}{\\alpha_{z+1}(n_e, T_e)}, \\qquad\n  \\\
    tilde f_0 = 1, \\quad \\tilde f_z = \\prod_{j=0}^{z-1}\\frac{S_j}{\\alpha_{j+1}}, \\quad\n  f_z =\
    \ \\frac{\\tilde f_z}{\\sum_k\\tilde f_k}$$\n\nwith $S_z$ the SCD effective ionisation and $\\alpha_{z+1}$\
    \ the ACD effective\nrecombination coefficients."
  parameters:
  - name: ne_m3
    type: array-like
    unit: m^-3
    description: Electron density, finite and positive.
  - name: te_eV
    type: array-like
    unit: eV
    description: Electron temperature, finite and positive.
  - name: acd
    type: ADF11Data or path-like
    unit: n/a
    description: Effective recombination table.
  - name: scd
    type: ADF11Data or path-like
    unit: n/a
    description: Effective ionisation table.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Fractional abundances, summing to one over the last axis. That axis has ``n_rate_blocks
      + 1`` charge states, neutral to fully stripped.
  sections:
  - title: Raises
    text: "ValueError\n    Mismatched charge-state counts, wrong table class, or non-finite rates."
  - title: Convention
    text: 'Effective (collisional-radiative, density-dependent) coefficients in the

      ADAS sense, evaluated in cm^-3 internally; the density cancels in the

      ratio, so the result is dimensionless.'
  - title: Assumptions
    text: 'Steady state, no transport: the local balance of ionisation and

      recombination alone sets the charge-state distribution.'
  - title: Limitations
    text: 'Transport in a real edge or start-up plasma shifts the distribution toward

      lower charge states than coronal equilibrium predicts (the effect Aurora

      models with an impurity transport solve).'
  references:
  - label: '1'
    text: H. P. Summers, *The ADAS User Manual*, version 2.6 (2004), Sec. on ADF11 (ionisation balance).
  - label: '2'
    text: F. Sciortino et al., Plasma Phys. Control. Fusion 63 (2021) 112001, Sec. 2 (equilibrium construction;
      MIT-licensed, see the module docstring).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: atomic.interpolate_adf11
  name: interpolate_adf11
  category: atomic
  module: vaft.formula.atomic
  signature: (table, ne_m3, te_eV, *, multiply_density=False)
  summary: Interpolate every charge-state block of an ADF11 table at given $(n_e, T_e)$.
  description: '$$C_z(n_e, T_e) = 10^{\,\mathcal{I}_2[\log_{10}C_z]}$$


    where $\mathcal{I}_2$ is bilinear interpolation on the table''s rectangular

    grid of $\log_{10}n_e\,[\mathrm{cm^{-3}}]$ and $\log_{10}T_e\,[\mathrm{eV}]$.'
  parameters:
  - name: table
    type: ADF11Data
    unit: n/a
    description: Parsed ADF11 table (``acd``, ``scd``, ``plt``, ...).
  - name: ne_m3
    type: array-like
    unit: m^-3
    description: Electron density, finite and positive.
  - name: te_eV
    type: array-like
    unit: eV
    description: Electron temperature, finite and positive.
  - name: multiply_density
    type: bool, optional
    unit: bool
    description: Multiply by $n_e$ in cm^-3 to turn coefficients into rates; default ``False``.
  returns:
  - name: null
    type: np.ndarray
    unit: any
    description: Coefficients in the table's own unit, or rates with ``multiply_density``. Shape ``broadcast(ne_m3,
      te_eV).shape + (n_blocks,)``; cm^3/s for ACD/SCD and W cm^3 for PLT, s^-1 when multiplied by density.
  sections:
  - title: Raises
    text: "ValueError\n    Empty, non-finite or non-positive profiles."
  - title: Convention
    text: 'ADF11 stores densities in cm^-3 and rate coefficients in cm^3 s^-1; the SI

      input is converted to cm^-3 internally and the output is *not* converted

      back, so callers multiply by $10^{-6}$ for m^3 s^-1 (as

      ``line_cooling_coefficient`` does for W m^3).'
  - title: Validity
    text: 'Inside the tabulated grid (typically $10^{8}$-$10^{15}$ cm^-3 and

      1 eV-10 keV for iso-nuclear ADF11 files).'
  - title: Limitations
    text: 'Linear extrapolation in log space is retained outside the grid to match the

      established ADF11 calculation path; extrapolated coefficients are not

      physical and are not flagged.'
  - title: Numerical notes
    text: '``scipy.interpolate.RegularGridInterpolator`` with ``bounds_error=False``,

      ``fill_value=None``, one interpolator per charge-state block.'
  references:
  - label: '1'
    text: H. P. Summers, *The ADAS User Manual*, version 2.6 (2004), https://www.adas.ac.uk/manual.php,
      ADF11 format.
  - label: '2'
    text: F. Sciortino et al., Plasma Phys. Control. Fusion 63 (2021) 112001 (Aurora; the calculation
      path this follows).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: atomic.line_cooling_coefficient
  name: line_cooling_coefficient
  category: atomic
  module: vaft.formula.atomic
  signature: (species, ne_m3, te_eV, *, acd=None, scd=None, plt=None, cache_dir=None)
  summary: Equilibrium line-radiation cooling coefficient $L_{line}(n_e, T_e)$ of a species.
  description: "$$L_{\\mathrm{line}}(n_e, T_e) = 10^{-6}\\sum_{q=0}^{Z-1} f_q(n_e, T_e)\\,\n  P^{\\mathrm{PLT}}_q(n_e,\
    \ T_e)$$\n\nthe PLT coefficients weighted by the coronal abundances of\n``fractional_abundances``;\
    \ the fully stripped state has no line\nradiation and is omitted."
  parameters:
  - name: species
    type: str
    unit: str
    description: Atomic symbol with configured default ADF11 files, e.g. ``"C"``.
  - name: ne_m3
    type: array-like
    unit: m^-3
    description: Electron density, finite and positive.
  - name: te_eV
    type: array-like
    unit: eV
    description: Electron temperature, finite and positive.
  - name: acd
    type: ADF11Data or path-like or None, optional
    unit: n/a
    description: Recombination table; ``None`` resolves the configured file.
  - name: scd
    type: ADF11Data or path-like or None, optional
    unit: n/a
    description: Ionisation table; ``None`` resolves the configured file.
  - name: plt
    type: ADF11Data or path-like or None, optional
    unit: n/a
    description: Line-power table; ``None`` resolves the configured file.
  - name: cache_dir
    type: str or path-like or None, optional
    unit: n/a
    description: OPEN-ADAS cache directory; downloads on a miss.
  returns:
  - name: null
    type: np.ndarray
    unit: W m^3
    description: Cooling coefficient with the broadcast input shape. Multiply by $n_e n_Z$ for a power
      density.
  sections:
  - title: Raises
    text: "KeyError\n    Unconfigured species.\nADASDataError\n    Lookup, download or parsing failure.\n\
      ValueError\n    Invalid inputs or mismatched charge-state dimensions."
  - title: Convention
    text: 'ADF11 PLT is stored in W cm^3; the factor $10^{-6}$ converts to W m^3.

      Coronal equilibrium, no transport, no recombination/bremsstrahlung

      continuum (that is the separate PRB class).'
  references:
  - label: '1'
    text: H. P. Summers, *The ADAS User Manual*, version 2.6 (2004), ADF11 PLT class.
  - label: '2'
    text: D. E. Post et al., At. Data Nucl. Data Tables 20 (1977) 397 (coronal cooling curves).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.bias_standard_error
  name: bias_standard_error
  category: statistics
  module: vaft.formula.statistics
  signature: (count)
  summary: Standard error of the mean of $n$ unit-variance samples, $1/\sqrt{n}$.
  description: $$\sigma_{\bar x} = \frac{1}{\sqrt{n}}$$
  parameters:
  - name: count
    type: int
    unit: '-'
    description: Number of samples.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Standard error; ``nan`` for ``count <= 0``.
  sections:
  - title: Physical interpretation
    text: 'The standard deviation of the sample mean when each sample has unit

      variance, which is the case for correctly normalized residuals by

      construction.  It is the yardstick a measured ``residual_bias`` is held

      against.'
  - title: Assumptions
    text: 'Unit-variance, independent samples.  Do **not** use this for a raw residual

      in physical units -- there the sample standard deviation must be estimated

      from the data instead.  Correlation between channels makes the true

      standard error larger than this value.'
  - title: Notes
    text: 'A bias exceeding roughly twice this is unlikely to be a fluctuation, and so

      points at a systematic.  Because it shrinks only as ``1/sqrt(n)``, a family

      with few channels tolerates a visibly large bias before it becomes

      significant.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 4.2 (standard deviation of the mean).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.chi_squared
  name: chi_squared
  category: statistics
  module: vaft.formula.statistics
  signature: (residual, sigma)
  summary: Chi-square, $\sum_i (r_i/\sigma_i)^2$ over the finite terms.
  description: $$\chi^2 = \sum_i\left(\frac{r_i}{\sigma_i}\right)^2$$
  parameters:
  - name: residual
    type: array-like
    unit: any
    description: Residuals.
  - name: sigma
    type: array-like
    unit: any
    description: One-sigma uncertainty of each residual, same unit.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Chi-square; ``nan`` when no usable term remains.
  sections:
  - title: Physical interpretation
    text: 'The weighted sum of squared residuals -- the quantity a Gaussian

      maximum-likelihood fit minimizes.  Under the null hypothesis that the model

      is correct and the errors are independent, zero-mean and Gaussian with the

      stated ``sigma``, it follows a chi-square distribution.'
  - title: Assumptions
    text: 'Independent, unbiased, correctly scaled Gaussian errors.  Correlated

      channels -- a common situation for magnetic diagnostics sharing an

      integrator or a calibration -- inflate or deflate this sum without any

      model being wrong.'
  - title: Limitations
    text: Terms where ``sigma`` is zero or either input is non-finite are dropped.
  - title: Notes
    text: 'Rarely read raw, since its expected size grows with the number of channels;

      divide by the degrees of freedom with ``reduced_chi_squared``.  Its

      useful raw form is the *share* each diagnostic family contributes, which

      localizes a bad fit.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 4.3 and Ch. 11 (chi-square test of goodness of fit).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.dynamic_range
  name: dynamic_range
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Sample range, $\max - \min$ over the finite entries.
  description: $$D = \max_i x_i - \min_i x_i$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Signal samples; non-finite entries are ignored.
  returns:
  - name: null
    type: float
    unit: any
    description: Range in the unit of the signal; 0 for a constant signal, ``nan`` for an empty one.
  sections:
  - title: Physical interpretation
    text: 'The span the signal actually used, in its own physical units.  Unlike

      ``relative_spread`` it is not normalized, so it stays meaningful for a

      signal whose values straddle zero, where dividing by ``max|x|`` is

      dominated by whichever excursion happened to be larger.'
  - title: Assumptions
    text: 'None, but note that the range is the least robust of the scale estimators

      here: it is defined entirely by the two most extreme samples, so one spike

      sets it.  Screen for spikes (see ``robust_z_scores``) before reading it

      as the signal''s working span.'
  - title: Notes
    text: 'The denominator that turns an absolute residual into a fraction of what the

      channel was actually doing.  A 1 mT residual on a probe that swung 10 mT is

      a 10% model error; the same residual on a probe that swung 1 mT is a

      failure of the model.'
  references:
  - label: '1'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      1.3.5.6.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.fractional_rms_improvement
  name: fractional_rms_improvement
  category: statistics
  module: vaft.formula.statistics
  signature: (baseline_residual, residual)
  summary: Fractional RMS improvement, $1 - \mathrm{RMS}(r)/\mathrm{RMS}(r_0)$.
  description: $$\eta = 1 - \frac{\mathrm{RMS}(\mathrm{residual})}{\mathrm{RMS}(\mathrm{baseline})}$$
  parameters:
  - name: baseline_residual
    type: array-like
    unit: any
    description: Residual of the reference model.
  - name: residual
    type: array-like
    unit: any
    description: Residual of the model under test, same samples and unit.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Skill score; ``nan`` when the baseline RMS is zero or non-finite.
  sections:
  - title: Physical interpretation
    text: 'The fraction of the baseline residual amplitude removed by whatever

      distinguishes the two models.  It is a relative, dimensionless skill score,

      not a significance test.'
  - title: Assumptions
    text: 'The two residuals come from the same samples and the same measurement,

      differing only in the model subtracted.  The baseline must be non-zero and

      finite; otherwise the ratio is meaningless and ``nan`` is returned.'
  - title: Notes
    text: '``1.0`` is a perfect reconstruction, ``0.0`` means the extra model term

      contributed nothing, and a negative value means it made the agreement

      worse -- which is informative, since a physically motivated term that

      degrades the fit points at a sign error or a bad response matrix rather

      than at noise.'
  references:
  - label: '1'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      4.4.4 (model validation).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.lag1_autocorrelation
  name: lag1_autocorrelation
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Lag-1 autocorrelation of the finite entries, in the order given.
  description: $$r_1 = \frac{\sum_i (x_i - \bar x)(x_{i+1} - \bar x)}{\sum_i (x_i - \bar x)^2}$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Ordered sample; non-finite entries are dropped before pairing.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Lag-1 autocorrelation in roughly $[-1, 1]$; ``nan`` below three samples or for zero variance.
  sections:
  - title: Physical interpretation
    text: 'The normalized correlation between each sample and its neighbour in

      sequence.  Under independence its expectation is approximately ``-1/n``,

      i.e. zero for practical purposes.'
  - title: Assumptions
    text: 'That the ordering of the array carries meaning -- adjacency in time, in

      space, or in a physically ordered channel index.  Applied to an arbitrarily

      ordered array the statistic is meaningless.  The sample must have at least

      three finite entries and non-zero variance.'
  - title: Notes
    text: 'A strongly positive value means neighbouring residuals move together, which

      for a spatially ordered channel array is the signature of a smooth

      unmodelled field rather than of independent measurement noise.  A strongly

      negative value means alternation, which points at a wiring or sign

      convention error on alternate channels.'
  references:
  - label: '1'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      1.3.5.12 (autocorrelation).
  - label: '2'
    text: G. E. P. Box, G. M. Jenkins and G. C. Reinsel, *Time Series Analysis*, 4th ed., Wiley (2008),
      Sec. 2.1.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.linear_trend
  name: linear_trend
  category: statistics
  module: vaft.formula.statistics
  signature: (x, y)
  summary: Least-squares slope of $y$ against $x$, in units of $y$ per unit $x$.
  description: $$\hat b = \frac{\sum_i (x_i - \bar x)(y_i - \bar y)}{\sum_i (x_i - \bar x)^2}$$
  parameters:
  - name: x
    type: array-like
    unit: any
    description: Abscissae.
  - name: y
    type: array-like
    unit: any
    description: Ordinates, same length.
  returns:
  - name: null
    type: float
    unit: any
    description: Slope; ``nan`` below two paired finite samples or for constant ``x``.
  sections:
  - title: Raises
    text: "ValueError\n    Mismatched lengths."
  - title: Physical interpretation
    text: 'The first-order coefficient of an ordinary least-squares fit, over the

      samples where both series are finite.'
  - title: Assumptions
    text: 'That a straight line is a meaningful summary.  It is the right question for

      integrator drift or a slowly walking baseline, and the wrong one for a

      signal whose shape is genuinely curved -- the slope will report something

      in that case too, and it will not mean drift.'
  - title: Numerical notes
    text: '``numpy.polyfit`` of degree 1 (unweighted).'
  - title: Notes
    text: 'Signed, and in physical units, so it is compared against the signal''s own

      scale rather than against a universal number: a drift of 1e-4 T/s matters

      for a probe whose dynamic range is 1e-3 T and does not for one spanning

      1 T.  Unlike ``residual_bias`` it is insensitive to a constant offset,

      which is what separates "this channel is offset" from "this channel is

      walking".'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 6.3.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.log10_decay_rate
  name: log10_decay_rate
  category: statistics
  module: vaft.formula.statistics
  signature: (values, *, tail=5)
  summary: Least-squares slope of $\log_{10}x$ against iteration index over the tail.
  description: $$\hat b = \operatorname{slope}\big(\log_{10}x_{n-m+1..n}\ \text{vs}\ 0, 1, \dots, m-1\big)$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Iteration history; non-positive and non-finite entries are dropped.
  - name: tail
    type: int, optional
    unit: '-'
    description: Number of trailing samples fitted; default 5.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Decades per iteration; ``nan`` below three usable samples.
  sections:
  - title: Physical interpretation
    text: 'The exponential rate constant of the sequence, estimated in log space so

      that a geometric decay becomes a straight-line fit.  Ordinary least squares

      in log space weights relative rather than absolute errors, which is the

      right choice for a quantity spanning orders of magnitude.'
  - title: Assumptions
    text: 'At least three positive finite samples in the tail; non-positive entries

      cannot be logged and are dropped, which silently shortens the window.  The

      fit assumes a single exponential regime, so a history that changes

      behaviour mid-run gives a slope describing neither phase.  Only the tail is

      used, deliberately: the early transient of an iterative solve says nothing

      about whether it is converging now.'
  - title: Numerical notes
    text: '``numpy.polyfit`` of degree 1 on ``log10`` of the tail.'
  - title: Notes
    text: 'A slope of ``-1`` means the error falls by a decade per iteration.  A value

      near zero means the iteration has stagnated -- it is still running but no

      longer improving, which is a different and more troubling outcome than

      hitting an iteration limit while still descending.  What counts as "near

      zero" is a solver policy decision and belongs to the caller.'
  references:
  - label: '1'
    text: C. T. Kelley, *Iterative Methods for Linear and Nonlinear Equations*, SIAM (1995), Sec. 1.2
      (linear and q-linear convergence).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.median_absolute_deviation
  name: median_absolute_deviation
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Median absolute deviation, $\mathrm{median}(|x - \mathrm{median}(x)|)$.
  description: $$\mathrm{MAD} = \operatorname{median}_i\big|x_i - \operatorname{median}(x)\big|$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Sample; non-finite entries are ignored.
  returns:
  - name: null
    type: float
    unit: any
    description: Raw MAD in the unit of the sample, not rescaled to a Gaussian sigma; ``nan`` for an empty
      sample.
  sections:
  - title: Physical interpretation
    text: 'A scale estimator with a 50% breakdown point: half the samples may be

      arbitrarily corrupted before it moves.  The standard deviation, by

      contrast, has a breakdown point of zero -- one bad sample moves it without

      limit.'
  - title: Assumptions
    text: 'None beyond the samples sharing a scale.  In particular no distribution is

      assumed; the value returned is the raw median deviation, *not* rescaled to

      a Gaussian-equivalent sigma.  ``robust_z_scores`` applies the 1.4826

      consistency factor where that interpretation is wanted, so the two uses

      cannot drift apart.'
  - title: Notes
    text: 'For a signal being screened for spikes or dropouts, this is the width of

      the bulk of the samples -- the noise level the anomalies must be measured

      against, rather than a noise level the anomalies have already inflated.'
  references:
  - label: '1'
    text: P. J. Rousseeuw and C. Croux, J. Am. Stat. Assoc. 88 (1993) 1273, Sec. 1.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.monotonic_fraction
  name: monotonic_fraction
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Fraction of consecutive steps in which the sequence decreased.
  description: $$f = \frac{1}{n - 1}\,\operatorname{count}\big(x_{i+1} < x_i\big)$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Ordered iteration history.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Decreasing-step fraction; ``nan`` below two samples.
  sections:
  - title: Physical interpretation
    text: 'The empirical rate of the event "the next sample is smaller than this one"

      over the ``n - 1`` adjacent pairs.  Comparisons involving a non-finite entry

      count as non-decreases, so a broken history is penalized rather than

      silently shortened.'
  - title: Assumptions
    text: 'The sequence is an ordered iteration history in which decrease is the

      desired direction.  A short history makes the fraction coarse -- with four

      iterations it can only take five values.'
  - title: Notes
    text: 'For a solver error history, ``1.0`` is a cleanly contracting iteration.

      Values near ``0.5`` mean the error is bouncing, which indicates a step that

      is too aggressive or a solution oscillating between two branches -- a

      distinct failure from steady but slow progress, which

      ``log10_decay_rate`` detects instead.'
  references:
  - label: '1'
    text: C. T. Kelley, *Iterative Methods for Linear and Nonlinear Equations*, SIAM (1995), Sec. 1.2
      (convergence histories).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.noise_band
  name: noise_band
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Mean and population standard deviation of a reference (effect-free) sample.
  description: $$\mu = \frac{1}{n}\sum_i x_i, \qquad \sigma = \sqrt{\frac{1}{n}\sum_i (x_i - \mu)^2}$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Reference stretch of signal; non-finite entries are ignored.
  returns:
  - name: mean
    type: float
    unit: any
    description: Offset of the reference; ``nan`` for an empty sample.
  - name: std
    type: float
    unit: any
    description: Population (``ddof = 0``) standard deviation; ``nan`` for an empty sample.
  sections:
  - title: Physical interpretation
    text: 'The first two moments of a stretch of signal taken to contain no effect,

      estimating the offset and the amplitude of the measurement noise.'
  - title: Assumptions
    text: 'The sample is genuinely effect-free and stationary over its extent.  A

      drift, a switching transient, or a leaked part of the effect inside the

      reference window inflates the estimated noise and makes any threshold

      built on it too permissive.'
  - title: Notes
    text: 'Deriving the threshold from the channel''s own measured quiet stretch,

      rather than from a global constant, means a noisy channel is judged by its

      own noise -- essential when channels differ in gain, integrator drift and

      cabling.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 1.3.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.normalized_residual
  name: normalized_residual
  category: statistics
  module: vaft.formula.statistics
  signature: (residual, weight, k)
  summary: Residuals in units of the fitted uncertainty, $z = r\,w/k$.
  description: $$z_i = \frac{r_i\,w_i}{k}, \qquad \sigma_i = \frac{k}{w_i}$$
  parameters:
  - name: residual
    type: array-like
    unit: any
    description: Residuals of a weighted least-squares fit.
  - name: weight
    type: array-like
    unit: any
    description: Inverse-uncertainty weights of the same channels.
  - name: k
    type: float
    unit: any
    description: Common units-of-fit factor, see ``sigma_unit_factor``.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Normalized residuals, shape of ``residual``; all ``nan`` for ``k`` zero or non-finite.
  sections:
  - title: Physical interpretation
    text: 'A weighted least-squares fit assigns each channel an effective uncertainty

      ``sigma = k / weight``; dividing the residual by it puts every channel on

      the same dimensionless scale, so a flux loop and a B-probe residual become

      directly comparable.'
  - title: Assumptions
    text: 'That ``weight`` really is the inverse uncertainty up to the single common

      factor ``k`` -- recover ``k`` from the fit''s own chi-square with

      ``sigma_unit_factor`` rather than assuming it.  If ``k`` is not finite

      or is zero the normalization is undefined and an all-``nan`` array of the

      residual''s shape is returned.'
  - title: Notes
    text: '``|z| ~ 1`` means a channel is reproduced to within the uncertainty it was

      given.  Because the uncertainties are an input, a uniformly small ``|z|``

      can equally mean the uncertainties were overstated.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 4.1 (weighted means and standardized residuals).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.outlier_fraction
  name: outlier_fraction
  category: statistics
  module: vaft.formula.statistics
  signature: (values, level)
  summary: Fraction of finite entries with $|x_i| > \mathrm{level}$.
  description: $$f = \frac{1}{n}\,\operatorname{count}\big(|x_i| > \mathrm{level}\big)$$
  parameters:
  - name: values
    type: array-like
    unit: '-'
    description: Normalized sample; non-finite entries are ignored.
  - name: level
    type: float
    unit: '-'
    description: Threshold in the sample's own units.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Tail fraction; ``nan`` for an empty sample.
  sections:
  - title: Physical interpretation
    text: 'The empirical tail mass beyond a threshold.  For standard normal samples

      the expected fractions are about 4.6% beyond 2 and 0.27% beyond 3.'
  - title: Assumptions
    text: 'That ``values`` are normalized so ``level`` is a number of standard

      deviations -- for raw residuals the threshold has no such meaning.  With

      few channels the estimate is coarse: one outlier in ten channels is 10%,

      which is not by itself evidence of anything.'
  - title: Notes
    text: 'Distinguishes a fit that is uniformly mediocre from one that is good

      everywhere except a handful of channels.  The second, an excess tail with

      an acceptable RMS, usually means a specific broken diagnostic rather than a

      bad reconstruction.'
  references:
  - label: '1'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      1.3.5.17 (detection of outliers).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.pearson_correlation
  name: pearson_correlation
  category: statistics
  module: vaft.formula.statistics
  signature: (a, b)
  summary: Pearson correlation of two series over their pairwise-finite samples.
  description: "$$\\rho = \\frac{\\sum_i (a_i - \\bar a)(b_i - \\bar b)}\n  {\\sqrt{\\sum_i (a_i - \\\
    bar a)^2}\\sqrt{\\sum_i (b_i - \\bar b)^2}}$$"
  parameters:
  - name: a
    type: array-like
    unit: any
    description: First series.
  - name: b
    type: array-like
    unit: any
    description: Second series, same length.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Correlation in $[-1, 1]$; ``nan`` below two pairs or for zero variance.
  sections:
  - title: Raises
    text: "ValueError\n    Mismatched lengths."
  - title: Physical interpretation
    text: 'Covariance normalized by both standard deviations: the cosine of the angle

      between the two mean-centred series.'
  - title: Assumptions
    text: 'A linear relationship.  Two series related by a strong but curved mapping

      correlate poorly, and the low value says the relationship is not linear

      rather than that it is absent.'
  - title: Notes
    text: 'For a measured signal against a forward model it separates *shape*

      agreement from *amplitude* agreement, which an RMS residual conflates.  A

      correlation near 1 with a large residual says the model has the dynamics

      right and the gain wrong -- a calibration question.  A small correlation

      with a small residual says neither signal is doing much, and the comparison

      is uninformative rather than successful.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 11.2 (linear-correlation coefficient).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.reduced_chi_squared
  name: reduced_chi_squared
  category: statistics
  module: vaft.formula.statistics
  signature: (chi_squared_total, degrees_of_freedom)
  summary: Reduced chi-square, $\chi^2/\nu$ per degree of freedom.
  description: $$\chi^2_\nu = \frac{\chi^2}{\nu}$$
  parameters:
  - name: chi_squared_total
    type: float
    unit: '-'
    description: Total chi-square.
  - name: degrees_of_freedom
    type: float
    unit: '-'
    description: Effective degrees of freedom $\nu$, positive.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Chi-square per degree of freedom; ``nan`` unless $\nu$ is finite and positive.
  sections:
  - title: Physical interpretation
    text: 'The mean squared normalized residual per free parameter''s worth of freedom.

      Its expectation is 1 when the model is correct and the uncertainties are

      right, since each independent constraint contributes one unit of chi-square

      on average.'
  - title: Assumptions
    text: 'All three of these must be defensible before the value means anything: the

      supplied uncertainties are the true measurement uncertainties, the residuals

      are independent, and ``dof`` is the *effective* number of degrees of freedom

      rather than a nominal channel count.  Regularized or constrained fits

      routinely violate the last of these, and correlated magnetics violate the

      second.'
  - title: Notes
    text: 'Read it as a diagnostic indicator, never as a pass/fail gate.  A value well

      above 1 means the model does not explain the data *given the stated

      uncertainties* -- which may be a bad model, understated uncertainties, or a

      mis-counted ``dof``.  A value well below 1 usually means overstated

      uncertainties or over-fitting, not an unusually good reconstruction.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 11.1.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.relative_spread
  name: relative_spread
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Relative spread, $(\max - \min)/\max|x|$ over the finite entries.
  description: $$s = \frac{\max_i x_i - \min_i x_i}{\max_i |x_i|}$$
  parameters:
  - name: values
    type: iterable of float
    unit: any
    description: Independent estimates of one quantity.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Relative spread; 0 for all-zero values, ``nan`` below two finite values.
  sections:
  - title: Physical interpretation
    text: 'A dimensionless, non-parametric measure of disagreement within a small

      set: the full range normalized by the largest magnitude present.  It is

      deliberately range-based rather than variance-based, because it is meant

      for a handful of values where a standard deviation would be noise.'
  - title: Assumptions
    text: 'The values are independent estimates of the *same* quantity, so that any

      spread between them is inconsistency rather than physics.  Being

      range-based it is maximally sensitive to a single bad estimate, which is

      the intent when used as a consistency check.'
  - title: Notes
    text: 'A self-consistency metric: several routes to one quantity should agree, and

      the spread is how far they do not.  Returns ``0.0`` -- not ``nan`` -- when

      every value is exactly zero, since that is perfect agreement, and ``nan``

      when fewer than two finite values are available to compare.'
  references:
  - label: '1'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      1.3.5.6 (measures of scale).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.residual_bias
  name: residual_bias
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Mean of the finite entries, the systematic offset of a residual sample.
  description: $$\bar r = \frac{1}{n}\sum_{i=1}^{n} r_i$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Residual sample; non-finite entries are ignored.
  returns:
  - name: null
    type: float
    unit: any
    description: Sample mean in the unit of the residual; ``nan`` for an empty sample.
  sections:
  - title: Physical interpretation
    text: 'The first moment.  For normalized residuals its sampling distribution under

      the null hypothesis has mean 0 and standard deviation ``1/sqrt(n)`` (see

      ``bias_standard_error``), so the mean is directly comparable against

      that scale.'
  - title: Assumptions
    text: 'Independent samples drawn from one distribution.  Channels that share a

      systematic -- a common calibration, a common integrator drift -- are not

      independent, and the bias is then easier to trigger than the nominal

      standard error suggests.'
  - title: Notes
    text: 'Random measurement noise averages to zero; a bias that does not is evidence

      of something the model is not representing, such as an unmodelled field

      component or a geometry offset, rather than of noise.  Unlike ``rms``,

      it is signed, so cancelling positive and negative residuals give a small

      bias with a large RMS -- which is itself diagnostic of structure rather than

      offset.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 1.2.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.rms
  name: rms
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Root mean square, $\sqrt{\mathrm{mean}(x_i^2)}$, over the finite entries.
  description: $$\mathrm{RMS} = \sqrt{\frac{1}{n}\sum_{i=1}^{n} x_i^2}$$
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Sample; non-finite entries are ignored.
  returns:
  - name: null
    type: float
    unit: any
    description: Quadratic mean in the unit of the sample; ``nan`` for an empty one.
  sections:
  - title: Physical interpretation
    text: 'The quadratic mean: the scale of the sample about zero, not about its own

      mean.  For a zero-mean sample it coincides with the population standard

      deviation; for a biased one it exceeds it, because a systematic offset

      contributes on equal footing with scatter.'
  - title: Assumptions
    text: 'That zero is the meaningful reference.  Applied to a residual this holds by

      construction; applied to a signal it does not, and ``residual_bias``

      should be inspected alongside it.  Samples are weighted equally, so a

      channel array mixing units or uncertainties must be normalized first (see

      ``normalized_residual``).'
  - title: Limitations
    text: Returns ``nan`` when no finite sample remains.
  - title: Notes
    text: 'The single number for "how far off is this reconstruction", in the units of

      the residual.  It is dominated by the worst channels, so a small RMS with a

      large ``outlier_fraction`` is contradictory and means the residual

      distribution is not what the average suggests.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 1.3.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.robust_z_scores
  name: robust_z_scores
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Deviation from the median in robust sigma units, sample by sample.
  description: '$$z_i = \frac{x_i - \operatorname{median}(x)}{1.4826\,\mathrm{MAD}}$$


    where 1.4826 makes the denominator a consistent estimator of the standard

    deviation for Gaussian samples, so a threshold in these units carries its

    usual meaning.'
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Sample.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Robust z-scores with the input's shape, ``nan`` where the input was non-finite, signed
      ``inf`` off a zero-MAD bulk.
  sections:
  - title: Physical interpretation
    text: 'A z-score built on estimators that the anomalies being looked for cannot

      themselves corrupt.  A single large spike inflates the mean and the

      standard deviation enough to hide itself from a conventional z-score; it

      moves neither the median nor the MAD.'
  - title: Assumptions
    text: 'A unimodal bulk.  These scores are meaningless for a genuinely bimodal

      sample, where the median falls between the modes and every sample scores

      as an outlier.'
  - title: Limitations
    text: 'A zero MAD means the bulk of the samples are identical -- a perfectly

      linear ramp differenced, or a flatlined channel.  Any departure from that

      constant is then infinitely many sigmas out, and is reported as signed

      ``inf`` rather than as ``nan``, because such a sample is the clearest

      possible anomaly and not an undefined one.  Returns an all-``nan`` array

      when no finite sample remains.'
  - title: Notes
    text: 'Unlike the scalar reductions elsewhere in this module, the result is

      positional: it has the shape of the input, so a caller can locate *which*

      samples deviate and not merely how many.'
  references:
  - label: '1'
    text: P. J. Rousseeuw and C. Croux, J. Am. Stat. Assoc. 88 (1993) 1273.
  - label: '2'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      1.3.5.17.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.runs_test_z
  name: runs_test_z
  category: statistics
  module: vaft.formula.statistics
  signature: (values)
  summary: Wald-Wolfowitz runs-test z-score for the sign sequence of a sample.
  description: "With $n_+$ positive and $n_-$ negative entries out of $n$, and $R$ the\nnumber of maximal\
    \ same-sign runs,\n\n$$E[R] = \\frac{2n_+n_-}{n} + 1, \\qquad\n  \\mathrm{Var}[R] = \\frac{2n_+n_-(2n_+n_-\
    \ - n)}{n^2(n - 1)}, \\qquad\n  z = \\frac{R - E[R]}{\\sqrt{\\mathrm{Var}[R]}}$$"
  parameters:
  - name: values
    type: array-like
    unit: any
    description: Ordered sample; zeros and non-finite entries carry no sign and are dropped.
  returns:
  - name: null
    type: float
    unit: '-'
    description: z-score; ``nan`` below three signed samples or when one sign is absent.
  sections:
  - title: Physical interpretation
    text: 'A distribution-free test of whether a binary sequence is randomly ordered.

      It uses only the signs, so it is insensitive to outlier magnitude -- which

      makes it complementary to ``rms`` and ``lag1_autocorrelation``

      rather than redundant with them.'
  - title: Assumptions
    text: 'Exchangeable samples under the null, a meaningful ordering, and enough of

      both signs for the normal approximation: this returns ``nan`` below three

      non-zero samples or when one sign is absent entirely.'
  - title: Notes
    text: '``|z| > 2`` means the sign pattern is unlikely under independence.  Too few

      runs (negative ``z``) is clustering -- contiguous stretches of one-signed

      residual, the fingerprint of an unmodelled coherent field component.  Too

      many (positive ``z``) is alternation, which points at an indexing or

      polarity error rather than at physics.'
  references:
  - label: '1'
    text: A. Wald and J. Wolfowitz, Ann. Math. Statist. 11 (1940) 147.
  - label: '2'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      1.3.5.13 (runs test).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.sigma_threshold_crossing
  name: sigma_threshold_crossing
  category: statistics
  module: vaft.formula.statistics
  signature: (time, values, reference_mask, *, sigma)
  summary: First time outside the reference window where the signal leaves its noise band.
  description: '$$t^* = \min\big(t_i : i \notin \mathrm{ref},\ |x_i - \mu| > \sigma_{\mathrm{thr}}\,\sigma\big)$$


    with $(\mu, \sigma)$ from ``noise_band`` over the reference samples.'
  parameters:
  - name: time
    type: array-like
    unit: any
    description: Sample times.
  - name: values
    type: array-like
    unit: any
    description: Signal samples.
  - name: reference_mask
    type: array-like of bool
    unit: bool
    description: '``True`` on the effect-free reference samples.'
  - name: sigma
    type: float
    unit: '-'
    description: Threshold in units of the reference noise.
  returns:
  - name: null
    type: float
    unit: any
    description: Crossing time in the unit of ``time``; ``nan`` when the reference is too short, its noise
      zero or non-finite, or the signal never emerges.
  sections:
  - title: Physical interpretation
    text: 'A fixed-threshold first-passage detector with the threshold expressed in

      units of the sample''s own noise, so the nominal false-alarm probability per

      sample is set by ``sigma`` alone rather than by the channel''s gain.'
  - title: Assumptions
    text: 'A well-defined quiet reference stretch of at least two finite samples,

      stationary noise across the whole record, and independent samples --

      oversampled or filtered data has fewer independent samples than points, so

      the effective false-alarm rate is lower than a naive count suggests.  With

      ``n`` samples searched, the expected number of noise-only crossings is

      roughly ``n`` times the per-sample tail probability, which is why a large

      ``sigma`` is used in practice.'
  - title: Notes
    text: 'Onset detection: the first moment a channel sees something its own

      pre-event noise cannot explain.  Comparing onsets across channels is the

      real test -- a physical event appears everywhere at once, while a

      forward-model or response-matrix artifact does not.'
  references:
  - label: '1'
    text: NIST/SEMATECH *e-Handbook of Statistical Methods* (2012), https://doi.org/10.18434/M32189, Sec.
      6.3.2 (Shewhart control limits).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: statistics.sigma_unit_factor
  name: sigma_unit_factor
  category: statistics
  module: vaft.formula.statistics
  signature: (residual, weight, chi_squared_per_channel)
  summary: Recover the units-of-fit factor $k$ from a fit's own per-channel chi-square.
  description: "$$k = \\operatorname{median}_i\\frac{|r_i\\,w_i|}{\\sqrt{\\chi^2_i}}, \\qquad\n  \\mathrm{spread}\
    \ = \\frac{\\max_i - \\min_i}{k}$$\n\nfrom the identity $\\chi^2_i = (r_i w_i/k)^2$."
  parameters:
  - name: residual
    type: array-like
    unit: any
    description: Stored residual of each channel.
  - name: weight
    type: array-like
    unit: any
    description: Stored inverse-uncertainty weight of each channel.
  - name: chi_squared_per_channel
    type: array-like
    unit: '-'
    description: Stored per-channel chi-square.
  returns:
  - name: k
    type: float
    unit: any
    description: Median units-of-fit factor; ``nan`` when no channel qualifies.
  - name: spread
    type: float
    unit: '-'
    description: Peak-to-peak scatter of the per-channel ratios over ``k``.
  sections:
  - title: Physical interpretation
    text: 'A robust (median) estimate of a single multiplicative constant that

      reconciles the units three stored arrays were written in.  The median

      rather than the mean, so one corrupted channel cannot move the estimate.'
  - title: Assumptions
    text: 'That *one* constant explains all channels.  ``spread`` is the test of that

      assumption, and it is what makes the estimate self-validating: it must be

      small.  A large spread means the stored chi-square and the stored residual

      no longer describe the same fit, and every normalized residual built on

      ``k`` is then suspect.'
  - title: Limitations
    text: 'Channels are used only where the weight is positive and both the chi-square

      and the residual are finite with a positive chi-square; ``(nan, nan)`` comes

      back when none qualify.'
  - title: Notes
    text: 'Recovering ``k`` rather than hard-coding a unit convention means a future

      convention change surfaces as a spread warning instead of as silently wrong

      normalized residuals.  Note that ``spread`` here is a peak-to-peak-over-median

      ratio and is deliberately *not* the same statistic as ``relative_spread``.'
  references:
  - label: '1'
    text: P. R. Bevington and D. K. Robinson, *Data Reduction and Error Analysis for the Physical Sciences*,
      3rd ed., McGraw-Hill (2003), Sec. 4.1.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
