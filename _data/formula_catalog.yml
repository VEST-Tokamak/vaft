- id: equilibrium.bootstrap_current_fraction
  name: bootstrap_current_fraction
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (n_e, T_e_keV, R0, a, q_95)
  summary: Heuristic bootstrap-current fraction $f_{BS}$.
  description: "$$f_{BS} = 0.3\\sqrt{\\beta_p}, \\qquad\n  \\beta_p = \\frac{0.4\\,n_e\\,T_e\\,a}{R_0\\\
    ,q_{95}^2}$$"
  parameters:
  - name: n_e
    type: float
    unit: any
    description: Electron density in the unit the coefficient was fitted for. The original source does
      not record which.
  - name: T_e_keV
    type: float
    unit: keV
    description: Electron temperature.
  - name: R0
    type: float
    unit: m
    description: Major radius.
  - name: a
    type: float
    unit: m
    description: Minor radius.
  - name: q_95
    type: float
    unit: '-'
    description: Safety factor at the 95% flux surface.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Bootstrap fraction of the plasma current.
  sections:
  - title: Physical interpretation
    text: 'Neoclassical bootstrap current scales as $\epsilon^{1/2}\beta_p$; the inner

      expression is a crude $\beta_p$ estimate from an $n T$ pressure and the

      cylindrical $q$-$I_p$ relation, and the outer square root is a fit.'
  - title: Validity
    text: 'Empirical fit.  Labelled "ITER scaling for bootstrap current" in the original

      VAFT source without a publication or unit system for the coefficients 0.3

      and 0.4.  The physics it approximates is the $\sqrt{\epsilon}\,\beta_p$

      scaling of Peeters [1] and Wesson [2].'
  - title: Limitations
    text: 'Unsourced coefficients and unstated density unit; the $\beta_p$ estimate

      ignores profile shape and the ion pressure.  Tracked in #361.'
  references:
  - label: '1'
    text: A. G. Peeters, Plasma Phys. Control. Fusion 42 (2000) B231, Sec. 2.
  - label: '2'
