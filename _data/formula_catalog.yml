- id: stability.c_s_from_Te_Ti_mi
  name: c_s_from_Te_Ti_mi
  category: stability
  module: vaft.formula.stability
  signature: (T_e_keV, T_i_keV, m_i=1.67262192e-27)
  summary: Isothermal ion sound speed $c_s = \sqrt{(T_e + T_i)/m_i}$.
  description: $$c_s = \sqrt{\frac{\gamma_eT_e + \gamma_iT_i}{m_i}}, \qquad \gamma_e = \gamma_i = 1$$
  parameters:
  - name: T_e_keV
    type: float
    unit: keV
    description: Electron temperature.
  - name: T_i_keV
    type: float
    unit: keV
    description: Ion temperature.
  - name: m_i
    type: float, optional
    unit: kg
    description: Ion mass; default the proton mass.
  returns:
  - name: null
    type: float
    unit: m/s
    description: Ion sound speed.
  sections:
  - title: Convention
    text: 'Isothermal closure ($\gamma = 1$ for both species); the adiabatic

      $\gamma_i = 3$ used for ion acoustic waves gives a speed larger by up to

      $\sqrt{(T_e + 3T_i)/(T_e + T_i)}$.'
  references:
  - label: '1'
    text: J. P. Freidberg, *Plasma Physics and Fusion Energy*, Cambridge University Press (2007), Sec.
      10.4 (sound waves).
  - label: '2'
    text: NRL Plasma Formulary (2019), p. 29.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.collisionality_from_n_T_B_R
  name: collisionality_from_n_T_B_R
  category: stability
  module: vaft.formula.stability
  signature: (n_e, T_e_keV, B_t, R0)
  summary: Electron collisionality figure $6.921\times10^{-18}\,n_e R_0/(T_e^2 B_t)$.
  description: $$\nu_* = 6.921\times10^{-18}\,\frac{n_e\,R_0}{T_e^2\,B_t}$$
  parameters:
  - name: n_e
    type: float
    unit: 1e19 m^-3
    description: Electron density.
  - name: T_e_keV
    type: float
    unit: keV
    description: Electron temperature.
  - name: B_t
    type: float
    unit: T
    description: Toroidal field.
  - name: R0
    type: float
    unit: m
    description: Major radius.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Collisionality figure in this function's own normalisation.
  sections:
  - title: Convention
    text: 'The prefactor is Sauter''s $\nu_{e*} = 6.921\times10^{-18}\,qR\,n_e

      Z_{\mathrm{eff}}\ln\Lambda/(T_e^2\varepsilon^{3/2})$ with $n_e$ in m^-3 and

      $T_e$ in eV [1].  This routine drops $q$, $\varepsilon^{-3/2}$,

      $Z_{\mathrm{eff}}$ and $\ln\Lambda$, divides by $B_t$ instead, and takes

      $n_e$ in $10^{19}$ m^-3 and $T_e$ in keV, so it is not Sauter''s $\nu_*$ nor

      the IPB98 database $\nu_*$ it was labelled with, and it is not comparable

      to ``vaft.formula.equilibrium.nu_star_from_n_T_B_R_epsilon_kappa_I``.

      Tracked in #353.'
  - title: Limitations
    text: Use only for relative trends within one dataset.
  references:
  - label: '1'
    text: O. Sauter, C. Angioni and Y. R. Lin-Liu, Phys. Plasmas 6 (1999) 2834, Eq. (18b).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.empirical_li_qa
  name: empirical_li_qa
  category: stability
  module: vaft.formula.stability
  signature: ()
  summary: Surveyed $(q_a, l_i)$ operating points from the JET disruption study.
  description: 'Eighteen $(q_a, l_i)$ pairs read from the JET operational diagram: at each

    integer $q_a$ from 2 to 10, the upper and lower $l_i$ of the observed

    operating band.'
  parameters: []
  returns:
  - name: qa
    type: np.ndarray
    unit: '-'
    description: Edge safety factor of each point.
  - name: li
    type: np.ndarray
    unit: '-'
    description: Internal inductance of each point.
  sections:
  - title: Physical interpretation
    text: 'Low $q_a$ goes with high $l_i$ (a peaked current profile); above

      $q_a \approx 6$ the lower branch saturates near $l_i \approx 0.3$ (flat

      profile).  The band bounds the region where JET discharges avoided

      disruptions in the $q_a$-$l_i$ plane.'
  - title: Validity
    text: 'Empirical fit.  Digitised from the JET survey of Wesson et al. [1]

      (ohmic and early NBI discharges, circular-to-D-shaped, 1985-1988); the

      values are approximate readings of a published figure, not tabulated data.'
  - title: Limitations
    text: 'JET-specific operating experience; a spherical tokamak reaches lower $q_a$

      and different $l_i$ ranges, so use only as a qualitative boundary.'
  references:
  - label: '1'
    text: J. A. Wesson et al., "Disruptions in JET", Nucl. Fusion 29 (1989) 641, Fig. 5 ($l_i$-$q_a$ diagram).
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.greenwald_density
  name: greenwald_density
  category: stability
  module: vaft.formula.stability
  signature: (I_p, a)
  summary: Greenwald density limit $n_G$.
  description: '$$n_G\,[10^{20}\,\mathrm{m^{-3}}] = \frac{I_p\,[\mathrm{MA}]}{\pi a^2\,[\mathrm{m^2}]}$$


    returned as $10\,I_p/(\pi a^2)$ in units of $10^{19}\,\mathrm{m^{-3}}$.'
  parameters:
  - name: I_p
    type: float
    unit: MA
    description: Plasma current.
  - name: a
    type: float
    unit: m
    description: Minor radius.
  returns:
  - name: null
    type: float
    unit: 1e19 m^-3
    description: Greenwald density limit.
  sections:
  - title: Convention
    text: 'Engineering units (MA, m) with the result in $10^{19}\,\mathrm{m^{-3}}$; the

      literature quotes $n_G$ in $10^{20}\,\mathrm{m^{-3}}$.  Pair with the

      line-averaged electron density when forming $f_G$

      (``greenwald_fraction``).'
  - title: Physical interpretation
    text: 'Operational density limit above which discharges typically disrupt through

      edge cooling and MARFE formation; not a hard MHD boundary.'
  - title: Validity
    text: 'Empirical fit.  Multi-machine ohmic and auxiliary-heated database,

      Greenwald et al. 1988 [1]; reviewed with H-mode data in [2].  Peaked

      profiles can exceed $f_G = 1$.'
  - title: Limitations
    text: 'No dependence on shaping, heating power or fuelling; spherical tokamaks

      routinely exceed it.'
  references:
  - label: '1'
    text: M. Greenwald et al., Nucl. Fusion 28 (1988) 2199, Eq. (1).
  - label: '2'
    text: M. Greenwald, Plasma Phys. Control. Fusion 44 (2002) R27, Sec. 2.
  empirical: true
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.greenwald_fraction
  name: greenwald_fraction
  category: stability
  module: vaft.formula.stability
  signature: (n_e, n_G)
  summary: Greenwald fraction $f_G = n_e/n_G$.
  description: $$f_G = \frac{\bar n_e}{n_G}$$
  parameters:
