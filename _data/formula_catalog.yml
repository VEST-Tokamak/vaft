- id: equilibrium.q_from_phi
  name: q_from_phi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psi, phi)
  summary: Safety factor $q$ as the flux derivative $d\Phi/d\psi$.
  description: $$q = \frac{d\Phi}{d\psi}$$
  parameters:
  - name: psi
    type: np.ndarray
    unit: Wb/rad
    description: Poloidal flux profile, monotonic.
  - name: phi
    type: np.ndarray
    unit: Wb
    description: Toroidal flux enclosed by the same surfaces.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Safety factor on the input surfaces.
  sections:
  - title: Convention
    text: 'Sauter and Medvedev define $q = \sigma_{\rho\theta\varphi}\sigma_{B_p}

      (2\pi)^{-e_{B_p}}\,d\Phi/d\psi$.  This routine applies neither sign nor

      $2\pi$: it is exact for ``psi`` in Wb/rad (COCOS 1-8, $e_{B_p}=0$) up to the

      orientation sign, and returns $2\pi q$ when ``psi`` is the IMAS full-weber

      flux.  Convert with ``vaft.data.eqdsk.ods_psi_to_wb_per_radian_factor``

      first, or take ``profiles_1d.q`` from the equilibrium directly.  Tracked in

      #354.'
  - title: Numerical notes
    text: '``numpy.gradient``: second-order central differences in the interior,

      first-order one-sided at the two ends, noise-amplifying; needs at least two

      samples and a strictly monotonic ``psi``.'
  references:
  - label: '1'
    text: O. Sauter and S. Yu. Medvedev, Comput. Phys. Commun. 184 (2013) 293, Eq. (17) and Table I.
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.4.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.q_from_rhoN
  name: q_from_rhoN
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psiN, rhoN, C=1.0)
  summary: Safety factor from the toroidal-flux label $\rho_N(\psi_N)$.
  description: "$$q = C\\,\\rho_N\\,\\frac{d\\rho_N}{d\\psi_N}, \\qquad\n  C = \\frac{2\\,\\Phi_b}{\\\
    psi_b - \\psi_a}$$\n\nfollows from $\\Phi = \\Phi_b\\rho_N^2$ and $q = d\\Phi/d\\psi$."
  parameters:
  - name: psiN
    type: np.ndarray
    unit: '-'
    description: Normalised poloidal flux, monotonic.
  - name: rhoN
    type: np.ndarray
    unit: '-'
    description: Normalised toroidal-flux radius on the same surfaces.
  - name: C
    type: float, optional
    unit: '-'
    description: Prefactor $2\Phi_b/(\psi_b-\psi_a)$ with $\psi$ in Wb/rad; default 1.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Safety factor, or with the default ``C`` only its shape.
  sections:
  - title: Convention
    text: 'With ``C=1`` the result is $q$ up to the constant $2\Phi_b/(\psi_b-\psi_a)$

      and is only proportional to the true profile.  Supply ``C`` from the

      equilibrium (with $\psi$ per radian, or $2\pi$ smaller with full-weber

      $\psi$) for absolute values; the orientation sign is not applied.'
  - title: Numerical notes
    text: '``numpy.gradient`` of ``rhoN`` against ``psiN`` (second-order interior,

      first-order ends); the on-axis value is dominated by the one-sided difference

      and by $\rho_N\to0$.'
  references:
  - label: '1'
    text: O. Sauter and S. Yu. Medvedev, Comput. Phys. Commun. 184 (2013) 293, Eq. (17).
  - label: '2'
    text: F. L. Hinton and R. D. Hazeltine, Rev. Mod. Phys. 48 (1976) 239, Sec. II.B.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.radial_magnetic_field_from_psi
  name: radial_magnetic_field_from_psi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psi, R, Z, cocos=None)
  summary: Radial magnetic field $B_R$ from the poloidal flux map.
  description: "$$B_R = \\frac{k}{R}\\,\\frac{\\partial\\psi}{\\partial Z}, \\qquad\n  k = \\frac{\\sigma_{R\\\
    varphi Z}\\,\\sigma_{B_p}}{(2\\pi)^{e_{B_p}}}$$\n\nwith $k$ from ``poloidal_field_factor`` (Sauter\
    \ Eq. 20)."
  parameters:
  - name: psi
    type: np.ndarray
    unit: Wb/rad or Wb
    description: Poloidal flux along the vertical direction; a 1-D cut in $Z$.
  - name: R
    type: np.ndarray or float
    unit: m
    description: Major radius of the samples.
  - name: Z
    type: np.ndarray
    unit: m
    description: Vertical coordinate of the samples, monotonic.
  - name: cocos
    type: int or None, optional
    unit: '-'
    description: COCOS index fixing sign and $2\pi$; ``None`` = per-radian, $k=-1$.
  returns:
  - name: null
    type: np.ndarray
    unit: T
    description: Radial field on the samples.
  sections:
  - title: Convention
    text: '``cocos=None`` assumes ``psi`` in Wb/rad with $\sigma_{B_p}\sigma_{R\varphi Z}

      =-1$ (COCOS 2/3/6/7).  A full-weber map (IMAS Data Dictionary,

      ``vaft.formula.green.green_psi_exact``) passed without ``cocos``

      overestimates $|B_R|$ by $2\pi$; convert with

      ``vaft.data.eqdsk.ods_psi_to_wb_per_radian_factor`` or pass the index.'
  - title: Assumptions
    text: 'Axisymmetry.  The derivative is taken along the *first* axis of ``psi``

      against ``Z``, so the map must be indexed ``[Z]`` or ``[Z, R]``; a

      ``[R, Z]``-ordered 2-D array differentiates along the wrong axis.'
  - title: Numerical notes
    text: '``numpy.gradient`` (second-order interior, first-order one-sided ends).'
  references:
  - label: '1'
    text: O. Sauter and S. Yu. Medvedev, Comput. Phys. Commun. 184 (2013) 293, Eq. (20) and Table I.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.rhoN_from_phi
  name: rhoN_from_phi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (phi, phi_boundary)
  summary: Normalised toroidal-flux radius $\rho_N$.
  description: $$\rho_N = \sqrt{\frac{\Phi}{\Phi_b}}$$
  parameters:
  - name: phi
    type: float or np.ndarray
    unit: Wb
    description: Toroidal flux enclosed by the surface.
  - name: phi_boundary
    type: float
    unit: Wb
    description: Toroidal flux enclosed by the plasma boundary.
  returns:
  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Toroidal-flux label, 0 on axis and 1 at the boundary.
  sections:
  - title: Convention
    text: 'This is the IMAS ``rho_tor_norm`` label (the square root of normalised

      *toroidal* flux), not the poloidal-flux label $\sqrt{\psi_N}$ nor a geometric

      minor radius.  ``phi`` and ``phi_boundary`` must carry the same sign; a

      COCOS-sign mismatch between them produces ``nan`` from the square root.'
  - title: Physical interpretation
    text: '$\rho_N$ is the minor radius of the circular cylinder that would enclose the

      same toroidal flux at the same $B_0$, scaled to the boundary value.'
  references:
  - label: '1'
    text: F. L. Hinton and R. D. Hazeltine, Rev. Mod. Phys. 48 (1976) 239, Sec. II.B (flux-surface coordinates).
  - label: '2'
    text: IMAS Data Dictionary, ``equilibrium.time_slice[:].profiles_1d.rho_tor_norm``.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.rhoN_from_qpsiN
  name: rhoN_from_qpsiN
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psiN, qpsiN)
  summary: Normalised toroidal-flux radius from the $q$ profile.
  description: '$$\rho_N = \sqrt{\frac{\int_0^{\psi_N} q\,d\psi_N''}{\int_0^{1} q\,d\psi_N''}}$$


    which is $\sqrt{\Phi/\Phi_b}$ since $d\Phi = q\,d\psi$ and the constants

    cancel in the ratio.'
  parameters:
  - name: psiN
    type: np.ndarray
    unit: '-'
    description: Normalised poloidal flux, increasing from 0.
  - name: qpsiN
    type: np.ndarray
    unit: '-'
    description: Safety factor on the same surfaces.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Normalised toroidal-flux radius on the input surfaces.
  sections:
  - title: Convention
    text: 'Independent of the $\psi$ unit and of the COCOS sign as long as ``qpsiN``

      does not change sign; a signed $q$ (COCOS with $\sigma_{\rho\theta\varphi}=-1$)

      must be passed as $|q|$ or the square root returns ``nan``.'
  - title: Assumptions
    text: '``psiN`` starts at the magnetic axis; the integral is taken from the first

      sample, so a profile that starts inside the plasma is mis-normalised.'
  - title: Numerical notes
    text: 'Cumulative trapezoidal integral rebuilt from scratch at every sample

      ($O(N^2)$; tracked in #357); the denominator is not guarded against zero.'
  references:
  - label: '1'
    text: F. L. Hinton and R. D. Hazeltine, Rev. Mod. Phys. 48 (1976) 239, Sec. II.B.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.rho_star_from_M_T_B_R_epsilon
  name: rho_star_from_M_T_B_R_epsilon
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (M_eff_amu, T_eV, B_t_T, R_geo_m, epsilon)
  summary: Normalised ion gyroradius $\rho_*$ in the Verdoolaege engineering form.
  description: "$$\\rho_* = 1.44\\times10^{-4}\\,\\frac{\\sqrt{M_{eff}\\,[\\mathrm{amu}]\\;T\\,[\\mathrm{eV}]}}\n\
    \  {B_t\\,[\\mathrm{T}]\\,R_{geo}\\,[\\mathrm{m}]\\,\\varepsilon}$$"
  parameters:
  - name: M_eff_amu
    type: float or np.ndarray
    unit: amu
    description: Effective ion mass, strictly positive.
  - name: T_eV
    type: float or np.ndarray
    unit: eV
    description: Temperature, strictly positive.
  - name: B_t_T
    type: float or np.ndarray
    unit: T
    description: Toroidal field, strictly positive.
  - name: R_geo_m
    type: float or np.ndarray
    unit: m
    description: Geometric major radius, strictly positive.
  - name: epsilon
    type: float or np.ndarray
    unit: '-'
    description: Inverse aspect ratio, strictly positive.
  returns:
  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Normalised gyroradius.
  sections:
  - title: Raises
    text: "ValueError\n    For non-finite or non-positive input."
  - title: Convention
    text: '$1.44\times10^{-4} = \sqrt{2m_p/e}$, i.e. $\rho_i = \sqrt{2m_iT}/(eB)$

      normalised by $a = R_{geo}\varepsilon$: the same physics as

      ``normalized_larmor_radius_from_M_T_a_Bt`` in database units.  Tracked

      with the other $\rho_*$ definitions in #353.'
  references:
  - label: '1'
    text: G. Verdoolaege et al., Nucl. Fusion 61 (2021) 076006, Sec. 2.
  empirical: false
  convention_sensitive: true
  deprecated: false
