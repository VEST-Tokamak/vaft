- name: statistics
  module: vaft.formula.statistics
  title: 'Pure statistical kernels for residual and convergence diagnostics (issue #186).'
  overview: 'This module is the single source of truth for the mathematics used to judge how

    well a reconstruction reproduces its own inputs: residual magnitude, residual

    bias, residual structure, goodness of fit against declared uncertainties, and

    the rate at which an iterative solver approaches its answer.


    Every function here takes plain arrays or scalars and returns plain floats.

    Nothing in this module knows what an ODS, an EFIT run, a diagnostic channel or a

    validation policy is -- deciding *which* physical arrays enter a formula belongs

    to the OMAS layer, and deciding what value is acceptable belongs to the

    validation layer.  Keeping the mathematics separate means a definition can be

    tested against an analytic reference without constructing a tokamak.'
  notation: []
  conventions: "* Non-finite samples are ignored rather than propagated, so a single dead\n  channel does\
    \ not erase a whole family's statistic.\n* A statistic that is undefined for the input given -- too\
    \ few samples, zero\n  variance, a zero denominator -- returns ``nan`` rather than raising, because\n\
    \  these arise routinely from real diagnostics and every caller aggregates over\n  many channels or\
    \ slices.\n* No numpy warning is emitted for an empty or all-non-finite input; the\n  degenerate case\
    \ is guarded explicitly.\n\nNone of these statistics is a pass/fail rule on its own.  Each is a diagnostic\n\
    indicator whose interpretation depends on assumptions -- stated per function --\nthat the caller is\
    \ responsible for defending."
  count: 21
formulas:
- id: utils.calculate_peaking_factor
  name: calculate_peaking_factor
  category: utils
  module: vaft.formula.utils
  signature: (central, volume_avg)
  summary: Peaking factor, central value over volume average.
  description: $$\mathrm{PF} = \frac{X(0)}{\langle X\rangle}$$
  parameters:
  - name: central
    type: float
    unit: any
    description: Value on the magnetic axis.
  - name: volume_avg
    type: float
    unit: any
    description: Volume average of the same quantity, same unit.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Peaking factor.
  sections:
  - title: Limitations
    text: 'No guard against a zero volume average.  Tracked in #357.'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.calculate_poloidal_flux
  name: calculate_poloidal_flux
  category: utils
  module: vaft.formula.utils
  signature: (R, B_theta, l, psi_axis=0.0)
  summary: Poloidal flux per radian from a line integral of $RB_\theta$.
  description: $$\psi(l) = \int_0^{l} R\,B_\theta\,dl' + \psi_a$$
  parameters:
  - name: R
    type: np.ndarray
    unit: m
    description: Major radius along the path.
  - name: B_theta
    type: np.ndarray
    unit: T
    description: Poloidal field normal to the path.
  - name: l
    type: np.ndarray
    unit: m
    description: Path coordinate, monotonic.
  - name: psi_axis
    type: float, optional
    unit: Wb/rad
    description: Offset added to the integral; default 0.
  returns:
  - name: null
    type: float
    unit: Wb/rad
    description: Flux at the end of the path.
  sections:
  - title: Convention
    text: 'Flux per radian (COCOS 1-8 storage); multiply by $2\pi$ for the IMAS

      full-weber flux.  Sign follows ``B_theta`` and the direction of ``l``.

      The physics wrapper is ``vaft.formula.equilibrium.psi_from_RBtheta``.'
  - title: Numerical notes
    text: Trapezoidal rule over the whole path; returns the end value only.
  references: []
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.calculate_toroidal_flux
  name: calculate_toroidal_flux
  category: utils
  module: vaft.formula.utils
  signature: (B_phi, dA)
  summary: Toroidal flux as a sum of $B_\varphi$ over area elements.
  description: $$\Phi = \sum_i B_{\varphi,i}\,\Delta A_i$$
  parameters:
  - name: B_phi
    type: np.ndarray
    unit: T
    description: Toroidal field on the area elements.
  - name: dA
    type: np.ndarray
    unit: m^2
    description: Area of each element, same shape.
  returns:
  - name: null
    type: float
    unit: Wb
    description: Toroidal flux.
  sections:
  - title: Convention
    text: 'Full weber (toroidal flux has no per-radian form); sign of $B_\varphi$.

      The physics wrapper is ``vaft.formula.equilibrium.phi_from_Bphi``.'
  - title: Numerical notes
    text: 'A Riemann sum with caller-supplied areas, not a quadrature rule; first

      order in the cell size.  Tracked in #358.'
  references: []
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.calculate_volume_weighted_average
  name: calculate_volume_weighted_average
  category: utils
  module: vaft.formula.utils
  signature: (x, V)
  summary: Volume-weighted average of a sampled profile.
  description: $$\langle X\rangle = \frac{\sum_i X_i\,V_i}{\sum_i V_i}$$
  parameters:
  - name: x
    type: np.ndarray
    unit: any
    description: Profile values at each cell.
  - name: V
    type: np.ndarray
    unit: m^3
    description: Volume of each cell, same shape.
  returns:
  - name: null
    type: float
    unit: any
    description: Volume-weighted average in the unit of ``x``.
  sections:
  - title: Limitations
    text: 'No guard against a zero total volume.  Tracked in #357.'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.fit_profile
  name: fit_profile
  category: utils
  module: vaft.formula.utils
  signature: (x, y, y_std, x_eval, order=3, uncertainty_option=1, fitting_function='polynomial', gp_kernel=None,
    gp_anchor=None, n_restarts_optimizer=5)
  summary: Fit a 1-D profile with a selectable model and evaluate it on a grid.
  description: 'Least-squares (``scipy.optimize.curve_fit``) for the parametric modes,

    Gaussian-process regression (``sklearn``) for ``''gp''``, linear

    interpolation for ``''linear''``, a core-polynomial/edge-exponential blend

    with a $\tanh$ transition for ``''core_poly_edge_exp''``, and square-root

    modes that fit $y^2$ and return $\sqrt{f}$.'
  parameters:
  - name: x
    type: array-like
    unit: any
    description: Data abscissae, 1-D.
  - name: y
    type: array-like
    unit: any
    description: Data values.
  - name: y_std
    type: array-like or None
    unit: any
    description: Per-point uncertainty, same unit as ``y``; ``None`` for unweighted.
  - name: x_eval
    type: array-like
    unit: any
    description: Evaluation grid.
  - name: order
    type: int, optional
    unit: '-'
    description: Number of polynomial coefficients (degree ``order - 1``); default 3.
  - name: uncertainty_option
    type: int, optional
    unit: '-'
    description: 1 (default) weights by ``y_std`` when given; 0 ignores it.
  - name: fitting_function
    type: str, optional
    unit: str
    description: Model name, default ``'polynomial'``. One of ``'gp'``, ``'polynomial'``, ``'free_polynomial'``,
      ``'exponential'``, ``'free_exponential'``, ``'linear'``, ``'core_poly_edge_exp'``, ``'sqrt'``, ``'sqrt_exponential'``.
  - name: gp_kernel
    type: sklearn kernel or None, optional
    unit: n/a
    description: Kernel for the GP mode; default constant times RBF.
  - name: gp_anchor
    type: tuple or None, optional
    unit: n/a
    description: '``(x_anchor, y_anchor, y_std_anchor)`` extra points for the GP.'
  - name: n_restarts_optimizer
    type: int, optional
    unit: '-'
    description: GP hyperparameter restarts; default 5.
  returns:
  - name: y_eval
    type: np.ndarray
    unit: any
    description: Fitted values on ``x_eval``.
  - name: y_std_eval
    type: np.ndarray
    unit: any
    description: Fitted uncertainty; non-zero for the GP mode only.
  - name: fit_function
    type: callable
    unit: n/a
    description: '``f(x)`` evaluating the fit at arbitrary ``x``.'
  - name: coeffs
    type: np.ndarray or None
    unit: any
    description: Fitted coefficients; ``None`` for the GP and linear modes.
  sections:
  - title: Raises
    text: "ValueError\n    Fewer than two valid points after masking, or an unknown mode.\nRuntimeError\n\
      \    When ``curve_fit`` does not converge."
  - title: Assumptions
    text: '``x`` is a normalised radius on $[0, 1]$ for the constrained modes (they

      force zero at $x = 1$); uncertainties are one-sigma and independent.'
  - title: Limitations
    text: 'Non-finite points and non-positive ``y_std`` are dropped with a warning.

      The ``''linear''`` mode uses ``numpy.interp``, which holds the end values

      constant outside the data range (silent constant extrapolation; tracked in

      #359).  The square-root modes clip negative data to zero before squaring,

      biasing the fit where the data cross zero, and report zero uncertainty.

      A fit that returns its initial guess unchanged is reported by a warning,

      not an exception.'
  - title: Numerical notes
    text: 'The initial guess is scaled to ``max|y|`` so raw densities in m^-3 do not

      stall the optimiser; ``maxfev=20000``.'
  - title: Examples
    text: '>>> fit_profile(x, y, y_std, x_eval, fitting_function=''gp'')

      >>> fit_profile(x, y, y_std, x_eval, order=3, fitting_function=''polynomial'')

      >>> fit_profile(x, y, y_std, x_eval, fitting_function=''linear'')

      >>> fit_profile(x, y, y_std, x_eval, order=3, fitting_function=''core_poly_edge_exp'')'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.gradient
  name: gradient
  category: utils
  module: vaft.formula.utils
  signature: (x, y)
  summary: Derivative $dy/dx$ on a sampled 1-D profile.
  description: '$$\frac{dy}{dx}\Big|_i \approx \frac{y_{i+1} - y_{i-1}}{x_{i+1} - x_{i-1}}$$


    (second-order central difference on a possibly non-uniform grid).'
  parameters:
  - name: x
    type: np.ndarray
    unit: any
    description: Independent variable, monotonic.
  - name: y
    type: np.ndarray
    unit: any
    description: Dependent variable, same length as ``x``.
  returns:
  - name: null
    type: np.ndarray
    unit: any
    description: $dy/dx$ at every sample, in units of ``y`` per unit ``x``.
  sections:
  - title: Numerical notes
    text: 'Wraps ``numpy.gradient(y, x)``: second-order accurate in the interior,

      first-order one-sided at the two end points, and noise-amplifying (a

      relative noise $\delta$ on ``y`` becomes $\delta/\Delta x$ on the

      derivative).  Needs at least two samples; only the first axis of a 2-D

      ``y`` is differentiated.'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.make_fit_function
  name: make_fit_function
  category: utils
  module: vaft.formula.utils
  signature: (mode)
  summary: Build a 1-D parametric model $f(x; c_0, c_1, \dots)$ for profile fitting.
  description: "$$\\begin{aligned}\n  \\text{polynomial:}\\ & (1-x)\\,\\textstyle\\sum_k c_kx^k &\n  \\\
    text{free\\_polynomial:}\\ & \\textstyle\\sum_k c_kx^k \\\\\n  \\text{exponential:}\\ & (1-x)\\exp\\\
    big(\\textstyle\\sum_k c_kx^k\\big) &\n  \\text{free\\_exponential:}\\ & \\exp\\big(\\textstyle\\\
    sum_k c_kx^k\\big)\n\\end{aligned}$$"
  parameters:
  - name: mode
    type: str
    unit: str
    description: Model name, case-insensitive. One of ``'polynomial'``, ``'free_polynomial'``, ``'exponential'``,
      ``'free_exponential'`` (a few aliases are accepted).
  returns:
  - name: null
    type: callable
    unit: any
    description: '``f(x, *coeffs)`` evaluating the model, in the unit of the data.'
  sections:
  - title: Raises
    text: "ValueError\n    For an unknown mode."
  - title: Assumptions
    text: '``x`` is a normalised radius on $[0, 1]$: the $(1 - x)$ factor forces the

      constrained modes to zero at $x = 1$; the exponential modes are strictly

      positive and decay monotonically when the polynomial is decreasing.'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.normalize_profile
  name: normalize_profile
  category: utils
  module: vaft.formula.utils
  signature: (x, x_axis, x_boundary)
  summary: Linear normalisation of a profile between its axis and boundary values.
  description: $$x_N = \frac{x - x_{\mathrm{axis}}}{x_{\mathrm{boundary}} - x_{\mathrm{axis}}}$$
  parameters:
  - name: x
    type: float or np.ndarray
    unit: any
    description: Values to normalise.
  - name: x_axis
    type: float
    unit: any
    description: Value mapped to 0.
  - name: x_boundary
    type: float
    unit: any
    description: Value mapped to 1.
  returns:
  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Normalised values, 0 at the axis value and 1 at the boundary value.
  sections:
  - title: Limitations
    text: 'No guard against ``x_boundary == x_axis``: a degenerate equilibrium with

      equal axis and boundary flux, which packaged VEST samples do contain,

      returns ``inf``/``nan``.  Tracked in #357.'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: utils.trapz_integral
  name: trapz_integral
  category: utils
  module: vaft.formula.utils
  signature: (x, y)
  summary: Definite integral $\int y\,dx$ by the trapezoidal rule.
  description: $$\int y\,dx \approx \sum_i \frac{y_i + y_{i+1}}{2}\,(x_{i+1} - x_i)$$
  parameters:
  - name: x
    type: np.ndarray
    unit: any
    description: Sample abscissae, monotonic.
  - name: y
    type: np.ndarray
    unit: any
    description: Integrand at the samples.
  returns:
  - name: null
    type: float
    unit: any
    description: Integral over the sampled range, in units of ``y`` times ``x``.
  sections:
  - title: Numerical notes
    text: '``numpy.trapezoid`` through ``vaft.compat.trapz_compat``; second-order

      accurate in the spacing, exact for piecewise-linear integrands, and

      sign-reversed for a decreasing ``x``.  A same-named helper in

      ``vaft.formula.green`` shadows this one on the package namespace

      (``vaft.formula.trapz_integral`` is the Green''s-function copy).'
  references: []
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: green
- id: equilibrium.alpha_heating_power_from_n_D_n_T_T_keV_V
  name: alpha_heating_power_from_n_D_n_T_T_keV_V
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (n_D_1e19, n_T_1e19, T_keV, V_m3)
  summary: D-T alpha heating power with the rough $\langle\sigma v\rangle \propto T^2$ fit.
  description: "$$P_\\alpha = n_D\\,n_T\\,\\langle\\sigma v\\rangle\\,E_\\alpha\\,V, \\qquad\n  \\langle\\\
    sigma v\\rangle \\approx 1.1\\times10^{-24}\\,T_{\\mathrm{keV}}^2\\ \\mathrm{m^3/s}$$"
  parameters:
  - name: n_D_1e19
    type: float
    unit: 1e19 m^-3
    description: Deuterium density.
  - name: n_T_1e19
    type: float
    unit: 1e19 m^-3
    description: Tritium density.
  - name: T_keV
    type: float
    unit: keV
    description: Ion temperature.
  - name: V_m3
    type: float
    unit: m^3
    description: Plasma volume.
  returns:
  - name: null
    type: float
    unit: W
    description: Alpha heating power.
  sections:
  - title: Assumptions
    text: 'Flat profiles (the product of densities is taken at one temperature over

      the whole volume); all alpha energy deposited in the plasma.'
  - title: Validity
    text: 'Empirical fit.  The quadratic $\langle\sigma v\rangle$ is Wesson''s

      interpolation of the D-T reactivity, accurate to ~10 % for $10 < T <

      20$ keV [1]; outside that window use the Bosch-Hale parametrisation [2].'
  - title: Limitations
    text: 'Irrelevant for a deuterium-only device such as VEST; kept for power-balance

      completeness.  Tracked in #360 (Bosch-Hale replacement).'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 1.3.
  - label: '2'
    text: H.-S. Bosch and G. M. Hale, Nucl. Fusion 32 (1992) 611, Table VII.
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases:
  - alpha_heating_power
  shadowed_by: null
- id: equilibrium.approximated_diamagnetism_from_B_pa_B_tv_R0_delta_phi
  name: approximated_diamagnetism_from_B_pa_B_tv_R0_delta_phi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (B_pa, B_tv, R0, delta_phi, V_p)
  summary: Diamagnetic parameter from the vacuum toroidal field and flux change.
