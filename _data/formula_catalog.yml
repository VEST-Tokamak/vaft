- id: equilibrium.shear_from_r_q
  name: shear_from_r_q
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (r, q)
  summary: Magnetic shear $s$ of the safety-factor profile.
  description: $$s = \frac{r}{q}\,\frac{dq}{dr}$$
  parameters:
  - name: r
    type: np.ndarray
    unit: m or -
    description: Flux-surface radius label, monotonic; minor radius or $\rho_N$.
  - name: q
    type: np.ndarray
    unit: '-'
    description: Safety factor on the same surfaces.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Local magnetic shear.
  sections:
  - title: Convention
    text: 'The logarithmic derivative $d\ln q/d\ln r$, the definition used in the

      $s$-$\alpha$ ballooning diagram; any monotonic radius label gives the same

      number up to the choice of $r$ (minor radius versus $\rho_N$ differ in the

      Shafranov-shifted region).  Sign is that of $dq/dr$, which is independent of

      COCOS.'
  - title: Physical interpretation
    text: 'Rate at which field-line pitch changes across surfaces; positive shear

      stabilises ballooning modes at low $\alpha$ and localises resonant

      perturbations.'
  - title: Numerical notes
    text: '``numpy.gradient`` (second-order interior, first-order ends), then division by

      ``q`` and multiplication by ``r``: the axis value is exactly 0 when ``r``

      starts at 0 and undefined where $q$ crosses zero.'
  references:
  - label: '1'
    text: J. W. Connor, R. J. Hastie and J. B. Taylor, Phys. Rev. Lett. 40 (1978) 396, definition of $s$.
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 6.13.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases:
  - magnetic_shear
  shadowed_by: null
- id: equilibrium.spitzer_resistivity_from_T_e_Z_eff_ln_Lambda
  name: spitzer_resistivity_from_T_e_Z_eff_ln_Lambda
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (T_e, Z_eff=2.0, ln_Lambda=17.0)
  summary: Spitzer parallel resistivity $\eta_\parallel$.
  description: "$$\\eta = 5.2\\times10^{-5}\\,\\frac{Z_{\\mathrm{eff}}\\,\\ln\\Lambda}{T_e^{3/2}}\n  \\\
    quad[\\Omega\\,\\mathrm{m}],\\ T_e\\ \\text{in eV}$$"
  parameters:
  - name: T_e
    type: float
    unit: eV
    description: Electron temperature.
  - name: Z_eff
    type: float, optional
    unit: '-'
    description: Effective ion charge; default 2.
  - name: ln_Lambda
    type: float, optional
    unit: '-'
    description: Coulomb logarithm; default 17.
  returns:
  - name: null
    type: float
    unit: Ohm m
    description: Parallel resistivity.
  sections:
  - title: Convention
    text: 'The NRL Formulary value $\eta_\parallel = 1.65\times10^{-9}\,Z\ln\Lambda\,

      T_{\mathrm{keV}}^{-3/2}\ \Omega$ m rewritten for $T_e$ in eV; the

      $Z_{\mathrm{eff}}$ factor is applied linearly (the Spitzer-Harm

      $Z$-dependence is weaker than linear for $Z>1$).'
  - title: Assumptions
    text: Classical collisional plasma, no neoclassical trapped-particle correction.
  - title: Validity
    text: 'Core tokamak plasmas well above the ionisation stage; the defaults

      $Z_{\mathrm{eff}}=2$ and $\ln\Lambda=17$ are typical rather than derived,

      use ``coulomb_logarithm_from_n_T`` for a self-consistent value.'
  - title: Limitations
    text: 'Neoclassical resistivity in a spherical tokamak exceeds this by the

      trapped-fraction factor (up to ~2 at VEST aspect ratio).'
  references:
  - label: '1'
    text: NRL Plasma Formulary (2019), p. 29 (Spitzer resistivity).
  - label: '2'
    text: L. Spitzer and R. Harm, Phys. Rev. 89 (1953) 977.
  - label: '3'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 2.16 (resistivity).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.stored_energy_from_beta_V
  name: stored_energy_from_beta_V
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (beta, B0, V)
  summary: Stored energy from toroidal beta, $W = \beta B_0^2 V/(2\mu_0)$.
  description: $$W = \beta\,\frac{B_0^2}{2\mu_0}\,V$$
  parameters:
  - name: beta
    type: float
    unit: '-'
    description: Toroidal beta as a fraction (not percent), $\langle p\rangle/(B_0^2/2\mu_0)$.
  - name: B0
    type: float
    unit: T
    description: Toroidal field on axis.
  - name: V
    type: float
    unit: m^3
    description: Plasma volume.
  returns:
  - name: null
    type: float
    unit: J
    description: Energy $\langle p\rangle V$.
  sections:
  - title: Convention
    text: 'Uses the fraction form of $\beta_t$; a percentage input is 100 times too

      large.  As for ``stored_energy_from_p_V``, the result is $\langle p\rangle

      V$, so the thermal energy is 1.5 times it.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.5 (definition of beta).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.stored_energy_from_p_V
  name: stored_energy_from_p_V
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (p, V)
  summary: Stored energy as pressure times volume, $W = pV$.
  description: $$W = \int p\,dV \approx p\,V$$
  parameters:
  - name: p
    type: float or np.ndarray
    unit: Pa
    description: Pressure; a volume-averaged value gives the total energy.
  - name: V
    type: float
    unit: m^3
    description: Plasma volume.
  returns:
  - name: null
    type: float or np.ndarray
    unit: J
    description: Energy $pV$.
  sections:
  - title: Convention
    text: '$pV$ is the *magnetic-like* energy normalisation; the thermal energy of an

      ideal gas is $W_{th} = \tfrac{3}{2}\int p\,dV$, so multiply by 1.5 for the

      IMAS ``energy_thermal`` convention.'
  - title: Assumptions
    text: '``p`` is the volume average (or the profile is flat) when ``V`` is the total

      volume.'
  references: []
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.surface_poloidal_flux_from_psi_boundary
  name: surface_poloidal_flux_from_psi_boundary
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psi_boundary)
  summary: Total poloidal flux at the plasma surface, $\Phi_{surface} = 2\pi\psi_b$.
  description: $$\Phi_{\mathrm{surface}} = 2\pi\,\psi_b$$
  parameters:
  - name: psi_boundary
    type: np.ndarray or float
    unit: Wb/rad
    description: Poloidal flux at the plasma boundary.
  returns:
  - name: null
    type: np.ndarray or float
    unit: Wb
    description: Surface flux in full weber.
  sections:
  - title: Convention
    text: 'Converts a per-radian boundary flux (COCOS 1-8, EFIT g-file, VFIT) to the full

      flux that flux-consumption bookkeeping uses.  An IMAS full-weber

      ``global_quantities.psi_boundary`` (COCOS 11-18) must not be passed: the

      result would be $2\pi$ too large.  Tracked in #354.'
  - title: Physical interpretation
    text: 'The poloidal flux linked by the plasma boundary, whose time derivative is the

      surface loop voltage in the Ejima flux-consumption balance.'
  references:
  - label: '1'
    text: S. Ejima et al., Nucl. Fusion 22 (1982) 1313, Sec. 2.
  - label: '2'
