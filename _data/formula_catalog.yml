  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (B_t, R0, dphi, B_pa, Omega)
  summary: Diamagnetic parameter $\hat\mu_i$ from the measured diamagnetic flux.
  description: $$\hat\mu_i \approx \frac{4\pi\,B_t\,R_0\,\Delta\phi}{B_{pa}^2\,\Omega}$$
  parameters:
  - name: B_t
    type: float
    unit: T
    description: Vacuum toroidal field at ``R0``.
  - name: R0
    type: float
    unit: m
    description: Major radius at which ``B_t`` is quoted.
  - name: dphi
    type: float
    unit: Wb
    description: Diamagnetic flux $\Delta\phi$ (plasma-induced change of toroidal flux).
  - name: B_pa
    type: float
    unit: T
    description: Boundary-averaged poloidal field.
  - name: Omega
    type: float
    unit: m^3
    description: Plasma volume.
