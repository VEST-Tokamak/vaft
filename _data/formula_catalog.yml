  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (n_e_m3, T_e_eV, Z_eff=2.0)
  summary: Maxwellian free-free (bremsstrahlung) power density from first principles.
  description: "$$S_B = \\frac{2^{1/2}}{3\\pi^{5/2}}\\,\\frac{e^6}{\\varepsilon_0^3c^3h\\,m_e^{3/2}}\\\
    ;\n  Z_{\\mathrm{eff}}\\,n_e^2\\,\\sqrt{k_BT_e}$$"
  parameters:
  - name: n_e_m3
    type: float
    unit: m^-3
    description: Electron density.
  - name: T_e_eV
    type: float
    unit: eV
    description: Electron temperature, converted to joules internally.
  - name: Z_eff
    type: float, optional
    unit: '-'
    description: Effective charge; default 2.
  returns:
  - name: null
    type: float
    unit: W/m^3
    description: Radiated power density.
