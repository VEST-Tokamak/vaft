- id: stability.power_limit_from_beta
  name: power_limit_from_beta
  category: stability
  module: vaft.formula.stability
  signature: (beta_N, B0, V)
  summary: Energy-like figure $\beta_N B_0^2 V/(2\mu_0)$ labelled a power limit.
