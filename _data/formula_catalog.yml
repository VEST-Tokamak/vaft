- id: equilibrium.confinement_time_from_engineering_parameters
  name: confinement_time_from_engineering_parameters
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (I_p, B_t, P_loss, n_e, M, R, epsilon, kappa, scaling='ITER89P', input_density_definition='line_avg',
    line_to_volume_factor=None)
  summary: Thermal energy confinement time from an engineering-parameter scaling law.
  description: '$$\tau_{E,th} = C\prod_i x_i^{\alpha_i}$$


    with the product running only over the variables the selected scaling

    declares, in the engineering units MA, T, MW, $10^{19}$ m^-3, amu and m.'
  parameters:
  - name: I_p
    type: float
    unit: A
    description: Plasma current, converted to MA internally.
  - name: B_t
    type: float
    unit: T
    description: Toroidal field.
  - name: P_loss
    type: float
    unit: W
    description: Loss power, converted to MW internally.
  - name: n_e
    type: float
    unit: m^-3
    description: Electron density, converted to $10^{19}$ m^-3 internally.
  - name: M
    type: float
    unit: amu
    description: Average ion mass.
  - name: R
    type: float
    unit: m
    description: Major radius.
  - name: epsilon
    type: float
    unit: '-'
    description: Inverse aspect ratio.
  - name: kappa
    type: float
    unit: '-'
    description: Elongation.
  - name: scaling
    type: str, optional
    unit: str
    description: Scaling-law name; default ``"ITER89P"``. One of ``"ITER89P"``, ``"H98y2"``, ``"NSTX2006H"``,
      ``"NSTX2006L"``, ``"Kurskiev2022"``.
  - name: input_density_definition
    type: str, optional
    unit: str
    description: 'What ``n_e`` is: ``"line_avg"`` (default) or ``"volume_avg"``.'
  - name: line_to_volume_factor
    type: float or None, optional
    unit: '-'
    description: Volume-to-line density ratio, default ``None``. Used only when the input and the scaling's
      density definitions differ, and required then.
  returns:
  - name: null
    type: float
    unit: s
    description: Thermal energy confinement time.
  sections:
  - title: Raises
    text: "ValueError\n    Unknown scaling, non-positive input, or a density-definition mismatch\n   \
      \ without ``line_to_volume_factor``."
  - title: Convention
    text: 'Strict SI in; the SI-to-engineering conversions ($\times10^{-6}$ for

      current and power, $\times10^{-19}$ for density) happen inside, so

      pre-scaled inputs are wrong by orders of magnitude.  Every prefactor $C$ is

      tied to that unit convention: the NSTX fits were converted from the papers''

      SI-like form, and the density definition each scaling expects is declared

      in ``_SCALING_COEFS``.  Variables a scaling does not use are neither

      range-checked nor raised to any power.'
  - title: Validity
    text: 'Empirical fit.  Multi-machine regressions of the ITER L-mode (ITER89P [1])

      and ELMy H-mode (IPB98(y,2) [2]) databases, the NSTX H- and L-mode fits of

      Kaye [3], and the spherical-tokamak multi-machine H-mode fit of Kurskiev

      [4]; each is valid over its database''s parameter range and the ST fits are

      the only ones that include low-aspect-ratio data.'
  - title: Limitations
    text: 'Extrapolation to VEST (small size, low field) lies outside every database

      range except in part the ST fit; the Kurskiev regression''s absorbed-power

      dependence is mapped onto ``P_loss`` as supplied.'
  references:
  - label: '1'
    text: P. N. Yushmanov et al., Nucl. Fusion 30 (1990) 1999 (ITER89P).
  - label: '2'
    text: ITER Physics Expert Groups, Nucl. Fusion 39 (1999) 2175, Ch. 2, Eq. (20) (IPB98(y,2)).
  - label: '3'
    text: S. M. Kaye et al., Nucl. Fusion 46 (2006) 848, Table 2.
  - label: '4'
    text: G. S. Kurskiev et al., Nucl. Fusion 62 (2022) 016011.
  empirical: true
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
