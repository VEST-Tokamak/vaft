- id: green.mutual_inductance
  name: mutual_inductance
  category: green
  module: vaft.formula.green
  signature: (r1, z1, dr1, dz1, r2, z2, dr2, dz2, *, tilt1=0.0, tilt2=0.0, turns1=1.0, turns2=1.0, mu_r=1.0,
    n_div=5)
  summary: Mutual inductance between two rectangular-cross-section ring coils.
  description: '$$M = N_1N_2\,\mu_r\mu_0\,\big\langle G(r_i, z_i; r_j, z_j)\big\rangle_{i \in 1,\ j \in
    2}$$


    the Neumann formula evaluated as the mean flux linkage between midpoint

    filaments laid over each cross-section.'
  parameters:
  - name: r1
    type: float
    unit: m
    description: Centre radius of coil 1.
  - name: z1
    type: float
    unit: m
    description: Centre height of coil 1.
  - name: dr1
    type: float
    unit: m
    description: Radial width of coil 1; 0 degenerates to a filament.
  - name: dz1
    type: float
    unit: m
    description: Height of coil 1; 0 degenerates to a filament.
  - name: r2
    type: float
    unit: m
    description: Centre radius of coil 2.
  - name: z2
    type: float
    unit: m
    description: Centre height of coil 2.
  - name: dr2
    type: float
    unit: m
    description: Radial width of coil 2.
  - name: dz2
    type: float
    unit: m
    description: Height of coil 2.
  - name: tilt1
    type: float, optional
    unit: rad
    description: Tilt of cross-section 1 about its centre; default 0.
  - name: tilt2
    type: float, optional
    unit: rad
    description: Tilt of cross-section 2; default 0.
  - name: turns1
    type: float, optional
    unit: '-'
    description: Turns of coil 1; default 1.
  - name: turns2
    type: float, optional
    unit: '-'
    description: Turns of coil 2; default 1.
  - name: mu_r
    type: float, optional
    unit: '-'
    description: Relative permeability of the medium, e.g. 1.04 for SUS304; default 1.
  - name: n_div
    type: int, optional
    unit: '-'
    description: Subdivision refinement; default 5. The cell size is half the pair's characteristic scale
      over ``n_div``.
  returns:
  - name: null
    type: float
    unit: H
    description: Mutual inductance.
  sections:
  - title: Assumptions
    text: 'Axisymmetric coils with uniform current density over the cross-section;

      the toroidal curvature correction $r \to r\,(1 + (\cos\theta\,\Delta r/r)^2/24)$

      is applied to each cell.'
  - title: Numerical notes
    text: 'Midpoint rule over both cross-sections (reference: legacy VFIT

      ``getMutualInductanceCoil.m``).  The cell size uses the $z$-*separation*

      $\sqrt{(r_1 + r_2)^2 + (z_1 - z_2)^2}$; the legacy code used $z_1 + z_2$,

      which is not invariant under a rigid vertical translation.  Legacy

      material codes are intentionally not reproduced: pass ``mu_r`` explicitly.'
  references:
  - label: '1'
    text: W. R. Smythe, *Static and Dynamic Electricity*, 3rd ed., McGraw-Hill (1968), Sec. 8.06 (mutual
      inductance of coaxial circles).
  - label: '2'
    text: Legacy VFIT ``getMutualInductanceCoil.m``.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: green.self_inductance
  name: self_inductance
  category: green
  module: vaft.formula.green
  signature: (r, dr, dz, *, tilt=0.0, turns=1.0, mu_r=1.0, n_div=5)
  summary: Self-inductance of a rectangular-cross-section ring coil.
  description: "$$L = \\frac{N^2}{n^2}\\left[\\sum_{i \\ne j}\\mu_r\\mu_0\\,G(r_i, z_i; r_j, z_j)\n  +\
    \ \\sum_i \\mu_r\\mu_0\\,r_i\\left(\\ln\\frac{8r_i}{s} - \\frac{7}{4}\\right)\\right],\n  \\qquad\
    \ s = \\sqrt{\\Delta r\\,\\Delta z/\\pi}$$\n\nmidpoint subdivision into $n$ cells with the analytic\
    \ self-term of a\ncircular filament of equivalent radius $s$ on the diagonal."
  parameters:
  - name: r
    type: float
    unit: m
    description: Centre radius, positive.
  - name: dr
    type: float
    unit: m
    description: Radial width, positive.
  - name: dz
    type: float
    unit: m
    description: Height, positive.
  - name: tilt
    type: float, optional
    unit: rad
    description: Tilt of the cross-section; default 0.
  - name: turns
    type: float, optional
    unit: '-'
    description: Number of turns; default 1.
  - name: mu_r
    type: float, optional
    unit: '-'
    description: Relative permeability; default 1.
  - name: n_div
    type: int, optional
    unit: '-'
    description: Cells per centre radius; default 5.
  returns:
  - name: null
    type: float
    unit: H
    description: Self-inductance.
  sections:
  - title: Raises
    text: "ValueError\n    For non-positive ``r``, ``dr`` or ``dz``."
  - title: Assumptions
    text: 'Uniform current density; the self-cell term is the low-frequency

      inductance of a thin ring of wire radius $s$ (internal inductance

      included, hence $7/4$ rather than 2).'
  - title: Numerical notes
    text: 'Reference: legacy VFIT ``getSelfInductanceCoil.m``; ``nz`` is forced even.

      Convergence in ``n_div`` is first order because of the self-cell

      approximation.'
  references:
  - label: '1'
    text: W. R. Smythe, *Static and Dynamic Electricity*, 3rd ed., McGraw-Hill (1968), Sec. 8.10 (self-inductance
      of a circular ring).
  - label: '2'
    text: Legacy VFIT ``getSelfInductanceCoil.m``.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
