  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Cylindrical safety factor.
  sections:
  - title: Raises
    text: "ValueError\n    For non-finite or non-positive input."
  - title: Convention
    text: '``cylindrical_safety_factor_from_R_B_epsilon_I_f_kappa_delta`` with

      $f = 1/\kappa_a$ and $2\pi/\mu_0 = 5\times10^6$; $\kappa_a$ is the *area*

      elongation $S/(\pi a^2)$ of the confinement databases, not the boundary

      elongation.'
  references:
  - label: '1'
    text: G. Verdoolaege et al., Nucl. Fusion 61 (2021) 076006, Sec. 2.
  - label: '2'
    text: ITER Physics Expert Groups, Nucl. Fusion 39 (1999) 2175, Ch. 2, Sec. 3.
  empirical: false
