- id: equilibrium.phi_from_Bphi
  name: phi_from_Bphi
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (B_phi, dA)
  summary: Toroidal flux $\Phi$ through a poloidal cross-section.
  description: $$\Phi = \int_{S} B_\varphi\,dA \approx \sum_i B_{\varphi,i}\,\Delta A_i$$
  parameters:
  - name: B_phi
    type: np.ndarray
    unit: T
    description: Toroidal magnetic field on the area elements.
  - name: dA
    type: np.ndarray
    unit: m^2
    description: Poloidal-plane area element of each sample, same shape as ``B_phi``.
  returns:
  - name: null
    type: float
    unit: Wb
    description: Toroidal flux through the surface.
  sections:
  - title: Convention
    text: 'Full weber, never per radian: toroidal flux carries no $2\pi$ ambiguity.  The

      sign is that of $B_\varphi$, i.e. $\sigma_{B_\varphi}$ of the COCOS in use

      (COCOS 1-8 and 11-18 differ only in the poloidal flux).'
  - title: Assumptions
    text: '``dA`` are true area elements of the cross-section bounded by the flux surface

      of interest; the routine does not construct them.'
  - title: Numerical notes
    text: 'A Riemann sum, not a quadrature rule: accuracy is first order in the cell size

      of the caller''s grid.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.4 (toroidal flux and
      the safety factor).
