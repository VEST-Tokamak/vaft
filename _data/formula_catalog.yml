- id: equilibrium.cyclotron_synchrotron_power_density_scaling_from_n_e_B_t_T_e
  name: cyclotron_synchrotron_power_density_scaling_from_n_e_B_t_T_e
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (n_e_m3, B_t_T, T_e_eV)
  summary: Classical electron-cyclotron emission power density, no reabsorption.
  description: "$$p_{\\mathrm{cyc}} = \\frac{e^4}{3\\pi\\varepsilon_0 m_e^3c^3}\\,n_e\\,B_t^2\\,k_BT_e\n\
    \  \\approx 6.2\\times10^{-17}\\,B_t^2\\,n_e\\,T_{\\mathrm{keV}}\\ \\mathrm{W/m^3}$$"
  parameters:
  - name: n_e_m3
    type: float
    unit: m^-3
    description: Electron density.
  - name: B_t_T
    type: float
    unit: T
    description: Magnetic field.
  - name: T_e_eV
    type: float
    unit: eV
    description: Electron temperature, converted to joules internally.
  returns:
  - name: null
    type: float
    unit: W/m^3
    description: Emitted cyclotron power density.
  sections:
  - title: Physical interpretation
    text: 'Total single-particle cyclotron radiation of a non-relativistic Maxwellian;

      the plasma is optically thick at the low harmonics, so the net loss is a

      small fraction of this, set by wall reflectivity and $\beta$ (Trubnikov).'
  - title: Validity
    text: 'Non-relativistic electrons; an upper bound on the loss, intended as a

      start-up loss-channel estimate rather than a radiation-transport result.'
  - title: Limitations
    text: 'Ignores reabsorption and wall reflection, which reduce the net loss by one

      to two orders of magnitude in a tokamak.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Ch. 4 (cyclotron radiation).
  - label: '2'
    text: B. A. Trubnikov, in *Reviews of Plasma Physics*, Vol. 7, Consultants Bureau (1979), p. 345.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.cylindrical_safety_factor_from_R_B_epsilon_I_f_kappa_delta
  name: cylindrical_safety_factor_from_R_B_epsilon_I_f_kappa_delta
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (R, B, epsilon, I, f_kappa_delta)
  summary: Cylindrical safety factor with a shape function.
  description: "$$q_{cyl} = \\frac{2\\pi\\,\\varepsilon^2 R\\,B_T}{\\mu_0\\,I_p\\,f(\\kappa,\\delta)}\n\
    \  = \\frac{2\\pi a^2 B_T}{\\mu_0 R I_p}\\,\\frac{1}{f(\\kappa,\\delta)}$$"
  parameters:
  - name: R
    type: float
    unit: m
    description: Major radius.
  - name: B
    type: float
    unit: T
    description: Toroidal field.
  - name: epsilon
    type: float
    unit: '-'
    description: Inverse aspect ratio $a/R$.
  - name: I
    type: float
    unit: A
    description: Plasma current.
  - name: f_kappa_delta
    type: float
    unit: '-'
    description: Shape function; $1/\kappa$ reproduces the ITER $q_{cyl} = 5a^2\kappa B/(RI_{MA})$.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Cylindrical safety factor.
  sections:
  - title: Convention
    text: '$2\pi/\mu_0 = 5\times10^6$, so with SI current this is the ITER Physics

      Basis $q_{cyl}$ once $f = 1/\kappa$; the shape function is left to the

      caller because the ITER-89P and IPB98 databases used different $\kappa$

      definitions.  Unlike the flux-derivative $q$ it never changes sign.'
  references:
  - label: '1'
    text: ITER Physics Expert Groups, Nucl. Fusion 39 (1999) 2175, Ch. 2, Sec. 3 (definition of $q_{cyl}$).
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.4.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.dimensionless_scaling_coeffs_from_engineering_scaling_coeffs
  name: dimensionless_scaling_coeffs_from_engineering_scaling_coeffs
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (a_I, a_B, a_P, a_n, a_M, a_R, a_eps, a_kappa)
  summary: Dimensionless scaling indices $(\mu_\rho, \mu_\beta, \mu_\nu)$ from engineering exponents.
  description: "$$\\Omega_i\\tau_E \\propto \\rho_*^{\\mu_\\rho}\\,\\beta^{\\mu_\\beta}\\,\\nu_*^{\\mu_\\\
    nu}$$\n\nwith, for $\\alpha_L = \\alpha_R + \\alpha_I$, $\\alpha_B^* = \\alpha_B + \\alpha_I$\nand\
    \ $D = 1 + \\alpha_P$,\n\n$$\\mu_\\rho = \\frac{3\\alpha_L + \\alpha_B^* + \\alpha_n - 2\\alpha_P\
    \ - 5}{D}, \\quad\n  \\mu_\\beta = \\frac{-\\alpha_L - 2\\alpha_n - \\alpha_B^* + 3\\alpha_P + 3}{D},\
    \ \\quad\n  \\mu_\\nu = \\frac{\\alpha_L + 3\\alpha_n + \\alpha_B^* - 2\\alpha_P - 4}{2D}$$"
  parameters:
  - name: a_I
    type: float
    unit: '-'
    description: Exponent of the plasma current.
  - name: a_B
    type: float
    unit: '-'
    description: Exponent of the toroidal field.
  - name: a_P
    type: float
    unit: '-'
    description: Exponent of the heating power.
  - name: a_n
    type: float
    unit: '-'
    description: Exponent of the density.
  - name: a_M
    type: float
    unit: '-'
    description: Exponent of the ion mass, passed through.
  - name: a_R
    type: float
    unit: '-'
    description: Exponent of the major radius.
  - name: a_eps
    type: float
    unit: '-'
    description: Exponent of the inverse aspect ratio, unused.
  - name: a_kappa
    type: float
    unit: '-'
    description: Exponent of the elongation, passed through.
  returns:
  - name: mu_rho
    type: float
    unit: '-'
    description: Gyroradius index; $-3$ is gyro-Bohm, $-2$ Bohm.
  - name: mu_beta
    type: float
    unit: '-'
    description: Beta index.
  - name: mu_nu
    type: float
    unit: '-'
    description: Collisionality index.
  - name: mu_M
    type: float
    unit: '-'
    description: Mass index, equal to ``a_M``.
  - name: mu_kappa
    type: float
    unit: '-'
    description: Elongation index, equal to ``a_kappa``.
  sections:
  - title: Assumptions
    text: 'Constant safety factor, $I_p \propto a^2B/R$, so current is absorbed into

      the size and field indices; temperature eliminated through $P = W/\tau_E$.'
  - title: Limitations
    text: 'Returns ``None`` instead of a tuple when $1 + \alpha_P$ vanishes (tracked in

      #352); indices are rounded to three decimals.'
  references:
  - label: '1'
    text: T. C. Luce, C. C. Petty and J. G. Cordey, Plasma Phys. Control. Fusion 50 (2008) 043001, Sec.
      3 (engineering to dimensionless exponent transformation).
  - label: '2'
    text: B. B. Kadomtsev, Sov. J. Plasma Phys. 1 (1975) 295.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
