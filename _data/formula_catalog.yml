- id: equilibrium.kink_safety_factor
  name: kink_safety_factor
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (R, a, kappa, Ip, Bt, type_)
  summary: Kink safety factor $q_*$ with the Freidberg beta and current limits.
  description: '$$q_{\mathrm{kink}} = \frac{2\pi a^2 B_t}{\mu_0 I_p R}\;g(\kappa)$$


    with $g = 1$ (``''circular''``), $g = 1 + \tfrac{4}{\pi^2}(\kappa^2-1)$

    (``''conventional''``) or $g = \tfrac{1}{2}(1+\kappa^2)$ (``''ST''``), plus the

    matching Troyon-type $\beta$ limits and the current at $q_{\mathrm{kink}}

    = q_{\min}$.'
  parameters:
  - name: R
    type: float or np.ndarray
    unit: m
    description: Major radius.
  - name: a
    type: float or np.ndarray
    unit: m
    description: Minor radius.
  - name: kappa
    type: float or np.ndarray
    unit: '-'
    description: Elongation.
  - name: Ip
    type: float or np.ndarray
    unit: A
    description: Plasma current.
  - name: Bt
    type: float or np.ndarray
    unit: T
    description: Toroidal field.
  - name: type_
    type: str
    unit: str
    description: '``''circular''``, ``''conventional''`` or ``''ST''``; anything else raises.'
  returns:
  - name: q_kink
    type: float or np.ndarray
    unit: '-'
    description: Kink safety factor.
  - name: q_min
    type: float or np.ndarray
    unit: '-'
    description: Minimum stable kink safety factor $1 + \kappa/2$.
  - name: beta_max
    type: float or np.ndarray or None
    unit: '-'
    description: Beta limit (fraction); ``None`` for ``'circular'``.
  - name: beta_crit
    type: float or np.ndarray or None
    unit: '-'
    description: Critical beta (fraction); ``None`` for ``'circular'``.
  - name: ip_max
    type: float or np.ndarray
    unit: A
    description: Current at which $q_{\mathrm{kink}}$ reaches $q_{\min}$.
  sections:
  - title: Convention
    text: '$\beta$ limits are fractions, not percent, and are given in Freidberg''s

      $\epsilon$-scaled form ($\beta_{\max} = 0.072\,\tfrac{1+\kappa^2}{2}\,

      \epsilon$ for the ST branch, $\pi^2\kappa\epsilon/16q^2$ for the

      conventional one).  $\mu_0$ is hard-coded as $4\pi\times10^{-7}$.'
  - title: Validity
    text: 'Freidberg''s reduced-MHD estimates for external kink and pressure-driven

      limits; order-of-magnitude design numbers, not a stability code result.'
  references:
  - label: '1'
    text: J. P. Freidberg, *Plasma Physics and Fusion Energy*, Cambridge University Press (2007), Ch.
      13, Eq. (13.158) and the surrounding kink and Troyon limit discussion.
  - label: '2'
    text: F. Troyon et al., Plasma Phys. Control. Fusion 26 (1984) 209.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
