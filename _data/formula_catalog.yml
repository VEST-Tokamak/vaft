- id: equilibrium.bremsstrahlung_power_density_from_T_e_p_Z_eff
  name: bremsstrahlung_power_density_from_T_e_p_Z_eff
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (T_e, p, Z_eff=2.0)
  summary: Bremsstrahlung power density in the pressure form.
  description: "$$S_B = Z_{\\mathrm{eff}}\\,K_B\\,\\frac{p_{\\mathrm{bar}}^2}{T_{\\mathrm{keV}}^{3/2}}\n\
    \  \\ [\\mathrm{MW/m^3}], \\qquad K_B = 0.052$$\n\nwhich is the NRL $P_{br} = 1.69\\times10^{-38}\\\
    ,Z_{\\mathrm{eff}}n_e^2\\sqrt{T_e}$\nrewritten with $n_e = p/(2T)$ (equal electron and ion pressure)."
  parameters:
  - name: T_e
    type: float
    unit: eV
    description: Electron temperature.
  - name: p
    type: float
    unit: Pa
    description: Total plasma pressure.
  - name: Z_eff
    type: float, optional
    unit: '-'
    description: Effective charge; default 2.
  returns:
  - name: null
    type: float
    unit: W/m^3
    description: Radiated power density.
  sections:
  - title: Convention
    text: 'Pressure is converted to bar ($10^5$ Pa) and temperature to keV internally;

      the prefactor 0.052 MW/m^3 follows exactly from the NRL coefficient and

      $p = 2n_eT$, so a pressure that already includes fast ions or unequal

      $T_i$ overestimates $n_e$.'
  - title: Assumptions
    text: 'Maxwellian electrons, Gaunt factor 1, $n_i = n_e$ and $T_i = T_e$; no

      recombination or line radiation.'
  references:
  - label: '1'
    text: NRL Plasma Formulary (2019), p. 58 (bremsstrahlung).
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Ch. 4 (radiation losses).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
