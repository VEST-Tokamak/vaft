- id: equilibrium.exact_volume_from_RZ_contour
  name: exact_volume_from_RZ_contour
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (R, Z)
  summary: Plasma volume from a closed $(R, Z)$ contour by Green's theorem.
  description: '$$V = \pi\oint R^2\,dZ$$


    exact for the solid of revolution swept by a closed poloidal contour, with

    no mean-radius approximation.'
  parameters:
  - name: R
    type: np.ndarray
    unit: m
    description: Major radius of the contour vertices, at least 3.
  - name: Z
    type: np.ndarray
    unit: m
    description: Height of the contour vertices.
  returns:
  - name: null
    type: float
    unit: m^3
    description: Volume of the solid of revolution.
  sections:
  - title: Convention
    text: 'Orientation-agnostic: the sign of the contour integral follows the traversal

      direction and the magnitude is returned.  The contour is closed automatically

      when its first and last points differ.'
  - title: Limitations
    text: 'Unlike ``volume_from_RZ_boundary``, which factors the integral as

      $2\pi A_{\mathrm{poly}}\bar R$ with $\bar R = \mathrm{mean}(R)$, this

      evaluates the contour integral itself.  On VEST flux surfaces the two differ

      by up to ~6 % at the plasma edge, where the $\bar R$ factorisation is

      weakest.  Use this one whenever the volume is a reported quantity rather than

      an intermediate.'
  - title: Numerical notes
    text: 'Trapezoidal rule on $R^2$ between successive vertices, second-order in the

      vertex spacing.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.1.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
