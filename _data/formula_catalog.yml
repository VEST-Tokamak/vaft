      ``bremsstrahlung_radiation_power_from_z_eff_n_e_t_e``; the two agree to

      1 %.'
  - title: Assumptions
    text: 'Maxwellian, non-relativistic electrons; Gaunt factor 1; $Z_{\mathrm{eff}}$

      absorbs $\sum_Z Z^2 n_Z / n_e$.'
  - title: Validity
    text: $T_e \ll m_ec^2$; relativistic corrections exceed 10 % above ~50 keV.
  references:
  - label: '1'
