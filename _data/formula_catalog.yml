- id: equilibrium.virial_beta_p_from_S_li
  name: virial_beta_p_from_S_li
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (S1, S2, li)
  summary: Poloidal beta from $S_1$, $S_2$ and a known internal inductance.
  description: $$\beta_p^{\mathrm{vir}} = \frac{S_1}{4} + \frac{S_2}{2} - \frac{l_i}{2}$$
  parameters:
  - name: S1
    type: float
    unit: '-'
    description: First Shafranov surface integral.
  - name: S2
    type: float
    unit: '-'
    description: Second Shafranov surface integral.
  - name: li
    type: float
    unit: '-'
    description: Internal inductance.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Poloidal beta.
  sections:
  - title: Physical interpretation
    text: 'Solves the first virial relation $S_1 + S_2 = 3\beta_p + l_i - \hat l_i$ for

      $\beta_p$ after dropping $\hat l_i$ and rescaling, giving the classic

      "$\beta_p + l_i/2$ from magnetics" separation when $l_i$ is known

      independently.'
