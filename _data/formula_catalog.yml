- id: green.elliptic_integral
  name: elliptic_integral
  category: green
  module: vaft.formula.green
  signature: (r_obs, z_obs, r_src, z_src)
  summary: Polynomial approximations of $K$ and $E$ for a ring source and observer points.
  description: "$$m = \\frac{4r_{obs}r_{src}}{(r_{obs} + r_{src})^2 + (z_{obs} - z_{src})^2}, \\qquad\n\
    \  m_1 = 1 - m$$\n\nthen the Hastings polynomials\n$K \\approx \\sum a_km_1^k + \\ln(1/m_1)\\sum b_km_1^k$\
    \ and\n$E \\approx \\sum c_km_1^k + \\ln(1/m_1)\\sum d_km_1^k$ to fourth order."
  parameters:
  - name: r_obs
    type: np.ndarray
    unit: m
    description: Radius of the observation points.
  - name: z_obs
    type: np.ndarray
    unit: m
    description: Height of the observation points.
  - name: r_src
    type: float
    unit: m
    description: Radius of the ring source.
  - name: z_src
    type: float
    unit: m
    description: Height of the ring source.
  returns:
  - name: ek
    type: np.ndarray
    unit: '-'
    description: Approximate $K(m)$.
  - name: ee
    type: np.ndarray
    unit: '-'
    description: Approximate $E(m)$.
  sections:
  - title: Validity
    text: 'Abramowitz and Stegun 17.3.34 and 17.3.36, absolute error below

      $2\times10^{-8}$ for $0 \le m < 1$; the legacy path of ``green_r`` and

      ``green_br_bz``, retained so their numbers do not change.'
  - title: Limitations
    text: '$\ln(1/m_1)$ diverges at a coincident observer and source and a warning is

      emitted with a bare ``print`` rather than ``warnings.warn`` (tracked in

      #356); ``greens_function_exact`` uses scipy''s exact integrals instead.'
  references:
  - label: '1'
    text: M. Abramowitz and I. A. Stegun, *Handbook of Mathematical Functions*, Dover (1972), Eqs. 17.3.34
      and 17.3.36.
  - label: '2'
    text: C. Hastings, *Approximations for Digital Computers*, Princeton University Press (1955).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: green.green_br_bz
  name: green_br_bz
  category: green
  module: vaft.formula.green
  signature: (r_obs, z_obs, r_src, z_src)
  summary: Field of a unit-current ring, $(B_r, B_z)$ at observer points (legacy elliptic path).
  description: "$$B_r = \\frac{\\mu_0}{2\\pi r}\\,\\frac{z - z_0}{\\sqrt{(r + r_0)^2 + (z - z_0)^2}}\n\
    \  \\left[\\frac{r^2 + r_0^2 + (z - z_0)^2}{(r - r_0)^2 + (z - z_0)^2}E - K\\right], \\quad\n  B_z\
    \ = \\frac{\\mu_0}{2\\pi}\\,\\frac{1}{\\sqrt{(r + r_0)^2 + (z - z_0)^2}}\n  \\left[K - \\frac{r^2\
    \ - r_0^2 + (z - z_0)^2}{(r - r_0)^2 + (z - z_0)^2}E\\right]$$"
  parameters:
  - name: r_obs
    type: np.ndarray
    unit: m
    description: Radius of the observation points.
  - name: z_obs
    type: np.ndarray
    unit: m
    description: Height of the observation points.
  - name: r_src
    type: float
    unit: m
    description: Radius of the current ring.
  - name: z_src
    type: float
    unit: m
    description: Height of the current ring.
  returns:
  - name: br
    type: np.ndarray
    unit: T/A
    description: Radial field per ampere.
  - name: bz
    type: np.ndarray
    unit: T/A
    description: Vertical field per ampere.
  sections:
  - title: Convention
    text: 'Right-handed $(r, \varphi, z)$ with the current flowing in $+\varphi$; $B_z$

      is positive inside the ring.  SI throughout; no $2\pi$ flux ambiguity

      arises for fields.  Uses the approximate ``elliptic_integral``; the

      exact, broadcasting counterpart is ``green_br_bz_exact``.'
  - title: Limitations
    text: 'Divides by $(r - r_0)^2 + (z - z_0)^2$ and by $r_{obs}$ without guards, so

      a coincident point or an on-axis observer gives ``inf``/``nan`` (the

      callers'' shifted-evaluation scheme avoids exact coincidence).  Tracked in

      #356.'
  references:
  - label: '1'
    text: W. R. Smythe, *Static and Dynamic Electricity*, 3rd ed., McGraw-Hill (1968), Sec. 7.10 (field
      of a circular loop).
  - label: '2'
    text: J. D. Jackson, *Classical Electrodynamics*, 3rd ed., Wiley (1999), Sec. 5.5.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: green.green_br_bz_exact
  name: green_br_bz_exact
  category: green
  module: vaft.formula.green
  signature: (r_obs, z_obs, r_src, z_src)
  summary: $(B_r, B_z)$ per unit ring current, exact elliptic integrals, broadcasting.
  description: "$$B_r = -\\frac{\\mu_0}{2\\pi r}\\,\\frac{\\partial G}{\\partial z}, \\qquad\n  B_z =\
    \ +\\frac{\\mu_0}{2\\pi r}\\,\\frac{\\partial G}{\\partial r}$$"
  parameters:
  - name: r_obs
    type: array-like
    unit: m
    description: Observation major radius.
  - name: z_obs
    type: array-like
    unit: m
    description: Observation height.
  - name: r_src
    type: array-like
    unit: m
    description: Source major radius.
  - name: z_src
    type: array-like
    unit: m
    description: Source height.
  returns:
  - name: br
    type: np.ndarray
    unit: T/A
    description: Radial field per ampere.
  - name: bz
    type: np.ndarray
    unit: T/A
    description: Vertical field per ampere.
  sections:
  - title: Convention
    text: 'Right-handed $(r, \varphi, z)$, current in $+\varphi$; consistent with

      ``green_psi_exact`` through $B_z = (1/r)\,\partial\psi/\partial r

      \times 1/2\pi$ for a full-weber $\psi$.'
  - title: Limitations
    text: 'Observation points on the geometric axis ($r_{obs} = 0$) return the analytic

      limits $B_r = 0$, $B_z = \mu_0 r_0^2/(2(r_0^2 + (z - z_0)^2)^{3/2})$; the

      coincident-point caveat of ``greens_function_exact`` applies.'
  references:
  - label: '1'
    text: W. R. Smythe, *Static and Dynamic Electricity*, 3rd ed., McGraw-Hill (1968), Sec. 7.10.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
