- id: equilibrium.virial_bp_li_lihat_from_S123
  name: virial_bp_li_lihat_from_S123
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (S1, S2, S3, a_param, RT_over_R0)
  summary: Solve the three virial relations for $\beta_p$, $l_i$ and $\hat l_i$.
  description: "$$3\\beta_p + l_i - \\hat l_i = S_1 + S_2, \\qquad\n  \\beta_p + l_i + \\hat l_i = \\\
    frac{R_T}{R_0}S_2, \\qquad\n  \\beta_p - (\\alpha-1)\\,l_i - \\hat l_i = S_3$$"
  parameters:
  - name: S1
    type: float
    unit: '-'
    description: First Shafranov surface integral.
  - name: S2
    type: float
    unit: '-'
    description: Second Shafranov surface integral.
  - name: S3
    type: float
    unit: '-'
    description: Third Shafranov surface integral.
  - name: a_param
    type: float
    unit: '-'
    description: Closure coefficient $\alpha$ of the third relation.
  - name: RT_over_R0
    type: float
    unit: '-'
    description: Current-centroid radius over reference radius.
  returns:
  - name: beta_p
    type: float
    unit: '-'
    description: Poloidal beta.
  - name: li_int
    type: float
    unit: '-'
    description: Internal inductance.
  - name: li_hat
    type: float
    unit: '-'
    description: Toroidal-field contribution $\hat l_i$.
  sections:
  - title: Numerical notes
    text: 'Direct solve of the 3x3 linear system with ``numpy.linalg.solve``; singular

      when $\alpha = 1/3$ (rows become dependent).'
  references:
  - label: '1'
    text: A. A. Martynov and V. D. Pustovitov, Phys. Plasmas 31 (2024), "Virial relations for elongated
      plasmas in tokamaks", Eqs. (1)-(3).
  - label: '2'
    text: V. D. Shafranov, Plasma Phys. 13 (1971) 757.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
