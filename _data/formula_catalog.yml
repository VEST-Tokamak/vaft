    type: float
    unit: 1e19 m^-3
    description: Line-averaged electron density.
  - name: n_G
    type: float
    unit: 1e19 m^-3
    description: Greenwald density limit in the same unit.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Greenwald fraction.
  sections:
  - title: Convention
    text: 'Both inputs in one unit and with the line-averaged density, the definition

      used in the Greenwald database; a volume average gives a systematically

      lower fraction.'
  references:
  - label: '1'
    text: M. Greenwald, Plasma Phys. Control. Fusion 44 (2002) R27, Sec. 2.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.kink_stability_criterion
  name: kink_stability_criterion
  category: stability
  module: vaft.formula.stability
  signature: (q_95, beta_N)
  summary: Heuristic kink margin against $\beta_{N,crit} = 2.8\,q_{95}$.
  description: $$\Delta = \beta_N - \beta_{N,crit}, \qquad \beta_{N,crit} = 2.8\,q_{95}$$
  parameters:
  - name: q_95
    type: float
    unit: '-'
    description: Safety factor at the 95% flux surface.
  - name: beta_N
    type: float
    unit: '-'
    description: Normalised beta in %·m·T/MA.
  returns:
  - name: margin
    type: float
    unit: '-'
    description: $\beta_N - \beta_{N,crit}$; positive means the limit is exceeded.
  - name: beta_N_crit
    type: float
    unit: '-'
    description: The threshold $2.8\,q_{95}$.
  sections:
  - title: Validity
    text: 'Empirical fit.  The coefficient 2.8 is the Troyon limit $\beta_N \le 2.8$

      [1]; the multiplication by $q_{95}$ has no source in the literature or the

      VAFT history and makes the limit rise with $q_{95}$, opposite to the

      observed trend.  ``beta_stability_boundary`` uses the same form with

      0.028, i.e. the fraction rather than percent convention of $\beta_N$.

      Tracked in #350.'
  - title: Limitations
    text: 'Not a stability calculation; use DCON or a Troyon-type $\beta_N \le C\,l_i$

      estimate for a physical limit.'
  references:
  - label: '1'
    text: F. Troyon et al., Plasma Phys. Control. Fusion 26 (1984) 209.
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.li_from_qa_empirical
  name: li_from_qa_empirical
  category: stability
  module: vaft.formula.stability
  signature: (qa)
  summary: Internal inductance at a given $q_a$ by interpolating the JET survey points.
  description: $$l_i(q_a) = \mathrm{interp}\big(q_a;\ q_a^{(k)}, l_i^{(k)}\big)$$
  parameters:
  - name: qa
    type: np.ndarray
    unit: '-'
    description: Edge safety factor values.
  returns:
  - name: null
    type: np.ndarray
    unit: '-'
    description: Interpolated internal inductance.
  sections:
  - title: Validity
    text: 'Empirical fit.  Piecewise-linear interpolation through the eighteen

      ``empirical_li_qa`` points from Wesson et al. [1]; a sanity check for

      when only $q_a$ is known.'
  - title: Limitations
    text: 'The survey lists two $l_i$ per integer $q_a$ (upper and lower band edge),

      so ``numpy.interp`` over the duplicated abscissae returns a value that

      depends on the point ordering; outside $2 \le q_a \le 10$ the end values are

      held constant (no extrapolation).'
  references:
  - label: '1'
    text: J. A. Wesson et al., Nucl. Fusion 29 (1989) 641, Fig. 5.
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.plasma_stability_margins
  name: plasma_stability_margins
  category: stability
  module: vaft.formula.stability
  signature: (beta_N, q_95, n_e, n_G)
  summary: Beta, $q_{95}$ and density margins in one call.
  description: "$$\\Delta_\\beta = \\beta_N - 0.028\\,q_{95}, \\qquad\n  \\Delta_q = q_{95} - 2, \\qquad\n\
    \  f_G = \\frac{n_e}{n_G}$$"
  parameters:
  - name: beta_N
    type: float
    unit: '-'
    description: Normalised beta as a fraction.
  - name: q_95
    type: float
    unit: '-'
    description: Safety factor at the 95% flux surface.
  - name: n_e
    type: float
    unit: 1e19 m^-3
    description: Line-averaged electron density.
  - name: n_G
    type: float
    unit: 1e19 m^-3
    description: Greenwald density limit.
  returns:
  - name: beta_margin
    type: float
    unit: '-'
    description: From ``beta_stability_boundary``; positive exceeds the limit.
  - name: q_margin
    type: float
    unit: '-'
    description: $q_{95} - 2$; negative is below the $q_{95} = 2$ disruption boundary.
  - name: density_margin
    type: float
    unit: '-'
    description: Greenwald fraction, from ``greenwald_fraction``; 1 is the limit.
  sections:
  - title: Convention
    text: 'The three margins use three different sign conventions: beta and $q$ are

      differences (sign tells the side of the boundary) while density is a ratio.

      $q_{95} = 2$ is the empirical operational boundary [1].'
  references:
  - label: '1'
    text: J. A. Wesson et al., Nucl. Fusion 29 (1989) 641.
  - label: '2'
    text: M. Greenwald, Plasma Phys. Control. Fusion 44 (2002) R27.
  empirical: false
