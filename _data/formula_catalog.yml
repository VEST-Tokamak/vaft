- id: equilibrium.kadomtsev_constraint_from_engineering_exponents
  name: kadomtsev_constraint_from_engineering_exponents
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (alpha_I, alpha_B, alpha_P, alpha_n, alpha_R)
  summary: Residual of the Kadomtsev high-beta constraint on engineering exponents.
  description: '$$\alpha_K = 4\alpha_R - 8\alpha_n - \alpha_I - 3\alpha_P - 5\alpha_B - 5$$


    for $\tau_E \propto I^{\alpha_I}B^{\alpha_B}P^{\alpha_P}n^{\alpha_n}R^{\alpha_R}$;

    $\alpha_K = 0$ when the scaling is expressible in the three dimensionless

    parameters $\rho_*$, $\beta$, $\nu_*$ alone.'
  parameters:
  - name: alpha_I
    type: float or np.ndarray
    unit: '-'
    description: Exponent of the plasma current.
  - name: alpha_B
    type: float or np.ndarray
    unit: '-'
    description: Exponent of the toroidal field.
  - name: alpha_P
    type: float or np.ndarray
    unit: '-'
    description: Exponent of the heating power.
  - name: alpha_n
    type: float or np.ndarray
    unit: '-'
    description: Exponent of the density.
  - name: alpha_R
    type: float or np.ndarray
    unit: '-'
    description: Exponent of the major radius.
  returns:
  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Constraint residual, 0 for exact satisfaction.
  sections:
  - title: Raises
    text: "ValueError\n    For non-finite input."
  - title: Physical interpretation
    text: 'Dimensional analysis of the Vlasov-Maxwell system: only three of the

      engineering variables are independent once $\rho_*$, $\beta$ and $\nu_*$ are

      fixed at constant geometry.  ITER89P gives $\alpha_K = -0.15$ and IPB98(y,2)

      gives $-0.01$.'
