- id: equilibrium.virial_stability_criterion
  name: virial_stability_criterion
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (W_mag, W_kin, W_th)
  summary: Virial-ratio margin against the heuristic threshold $r_v = 0.5$.
  description: "$$\\Delta = r_v - 0.5, \\qquad\n  r_v = \\frac{W_{\\mathrm{kin}} + W_{\\mathrm{th}}}{W_{\\\
    mathrm{mag}}}$$"
  parameters:
  - name: W_mag
    type: float
    unit: J
    description: Magnetic energy.
  - name: W_kin
    type: float
    unit: J
    description: Bulk kinetic energy.
  - name: W_th
    type: float
    unit: J
    description: Thermal energy.
  returns:
  - name: margin
    type: float
    unit: '-'
    description: $r_v - 0.5$.
  - name: critical_ratio
    type: float
    unit: '-'
    description: The threshold 0.5.
  sections:
  - title: Limitations
    text: 'The threshold 0.5 is labelled "theoretical value for stability" in the

      original VAFT source but no derivation or reference for it was recorded;

      the scalar virial theorem constrains equilibrium, not stability.  Treat the

      margin as a bookkeeping diagnostic.  Tracked in #366.'
  references:
  - label: '1'
    text: V. D. Shafranov, in *Reviews of Plasma Physics*, Vol. 2, Consultants Bureau (1966), p. 103.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.virial_theorem
  name: virial_theorem
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (W_mag, W_kin, W_th)
  summary: Total energy and virial ratio of magnetic, kinetic and thermal contributions.
  description: "$$W_{\\mathrm{total}} = W_{\\mathrm{mag}} + W_{\\mathrm{kin}} + W_{\\mathrm{th}},\n  \\\
    qquad r_v = \\frac{W_{\\mathrm{kin}} + W_{\\mathrm{th}}}{W_{\\mathrm{mag}}}$$"
  parameters:
  - name: W_mag
    type: float
    unit: J
    description: Magnetic energy.
  - name: W_kin
    type: float
    unit: J
    description: Bulk kinetic energy.
  - name: W_th
    type: float
    unit: J
    description: Thermal energy.
  returns:
  - name: W_total
    type: float
    unit: J
    description: Sum of the three energies.
  - name: virial_ratio
    type: float
    unit: '-'
    description: Ratio of material to magnetic energy.
  sections:
  - title: Physical interpretation
    text: 'The scalar virial theorem forbids a plasma confined by its own fields alone:

      a positive-definite $W_{\mathrm{mag}}$ must be balanced by external

      (coil) fields, and the ratio measures how far the material energy is from

      that balance.'
  references:
  - label: '1'
    text: V. D. Shafranov, in *Reviews of Plasma Physics*, Vol. 2, Consultants Bureau (1966), p. 103.
  - label: '2'
    text: J. P. Freidberg, *Ideal MHD*, Cambridge University Press (2014), Sec. 3.6 (virial theorem).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
