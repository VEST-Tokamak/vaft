- id: equilibrium.kinetic_energy_from_beta_p_B_pa_V_p
  name: kinetic_energy_from_beta_p_B_pa_V_p
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (beta_p, B_pa, V_p)
  summary: Thermal energy from poloidal beta, $W_K = \tfrac{3}{2}\,\beta_p B_{pa}^2 V_p/(2\mu_0)$.
  description: $$W_K = \frac{3}{2}\left(\frac{\beta_p\,B_{pa}^2}{2\mu_0}\,V_p\right)$$
  parameters:
  - name: beta_p
    type: float
    unit: '-'
    description: Poloidal beta, $2\mu_0\langle p\rangle/B_{pa}^2$.
  - name: B_pa
    type: float
    unit: T
    description: Boundary-averaged poloidal field, $\mu_0 I_p/L_p$.
  - name: V_p
    type: float
    unit: m^3
    description: Plasma volume.
  returns:
  - name: null
    type: float
    unit: J
    description: Thermal (kinetic) energy.
  sections:
  - title: Convention
    text: '$B_{pa}$ is the poloidal field averaged over the boundary contour of length

      $L_p$, the EFIT/Lao normalisation of $\beta_p$; the $3/2$ converts $pV$ to

      the ideal-gas thermal energy.'
  references:
  - label: '1'
    text: L. L. Lao, H. St. John, R. D. Stambaugh and W. Pfeiffer, Nucl. Fusion 25 (1985) 1421, Sec. 2
      (definitions of $\beta_p$ and $B_{pa}$).
