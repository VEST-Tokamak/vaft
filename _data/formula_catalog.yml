  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.poloidal_field_factor
  name: poloidal_field_factor
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (cocos, *, psi_per_radian=None)
  summary: Sauter Eq. 20 prefactor $k = \sigma_{R\varphi Z}\,\sigma_{B_p}/(2\pi)^{e_{B_p}}$.
  description: "$$B_R = \\frac{k}{R}\\,\\frac{\\partial\\psi}{\\partial Z}, \\qquad\n  B_Z = -\\frac{k}{R}\\\
    ,\\frac{\\partial\\psi}{\\partial R}$$\n\nThe factor carries both the $2\\pi$ normalisation *and*\
    \ the orientation sign,\nso applying only the former leaves the field inverted for half the\nconventions."
  parameters:
  - name: cocos
    type: int or None
    unit: '-'
    description: COCOS index (1-8, 11-18); ``None`` selects the historical behaviour.
  - name: psi_per_radian
    type: bool or None, optional
    unit: bool
    description: Storage family of the flux when ``cocos`` is ``None``. ``False`` removes the $2\pi$ of
      a full-weber flux while keeping the $-1$ orientation; ``True`` and ``None`` keep the per-radian
      assumption.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Prefactor $k$ multiplying $\nabla\psi/R$.
  sections:
  - title: Convention
    text: '``cocos=None`` keeps the weber-per-radian, $k=-1$ behaviour that the rest of

      this module assumed before conventions were explicit: the COCOS 2/3/6/7 form.

      Pass an index to get any other; it is resolved through

      ``vaft.data.cocos.cocos_spec``, the single source of truth for the COCOS

      model in VAFT.  The two halves are established by different evidence, so they

      can be known separately: ``psi_per_radian`` supplies the $2\pi$ half on its

      own for a caller that settled the storage family without pinning the index

      (an ODS whose flux scale is unambiguous while ``clockwise_phi`` leaves the

      index open).  It is consulted only when ``cocos`` is ``None``, where the

      orientation still falls back to $-1$; an index carries both halves and wins

      outright.'
  - title: See Also
    text: vaft.data.eqdsk.ods_psi_to_wb_per_radian_factor
  references:
  - label: '1'
    text: O. Sauter and S. Yu. Medvedev, Comput. Phys. Commun. 184 (2013) 293, Eq. (20) and Table I.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.psi_from_RBtheta
  name: psi_from_RBtheta
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (R, B_theta, l, psi_axis=0.0)
  summary: Poloidal flux $\psi$ from a line integral of $R B_\theta$ across flux surfaces.
  description: '$$\psi(l) = \int_0^{l} R\,B_\theta\,dl'' + \psi_a$$


    along a path $l$ that crosses the flux surfaces (the outboard midplane, say),

    where $B_\theta$ is the poloidal field component normal to the path.  This is

    the inverse of $B_p = |\nabla\psi|/R$, so the result is the flux per radian.'
  parameters:
  - name: R
    type: np.ndarray
    unit: m
    description: Major radius along the integration path.
  - name: B_theta
    type: np.ndarray
    unit: T
    description: Poloidal magnetic field normal to the path, same shape as ``R``.
  - name: l
    type: np.ndarray
    unit: m
    description: Path coordinate, monotonic, same shape as ``R``.
  - name: psi_axis
    type: float, optional
    unit: Wb/rad
    description: Flux at the start of the path, added as an offset; default 0.
  returns:
  - name: null
    type: np.ndarray
    unit: Wb/rad
    description: Poloidal flux at every point of the path.
  sections:
  - title: Convention
    text: 'Returns flux per radian, $\psi = \int R B_\theta\,dl$, the COCOS 1-8 storage

      of an EFIT g-file or of VFIT.  Multiply by $2\pi$ for the IMAS Data

      Dictionary''s full-weber ``equilibrium.*.psi`` (COCOS 11-18).  The sign follows

      the sign of ``B_theta`` and the direction of ``l``; nothing is re-oriented.'
  - title: Assumptions
    text: 'Axisymmetry, and that ``B_theta`` is the component perpendicular to the path

      so that $R B_\theta\,dl$ is exactly $d\psi$.'
  - title: Numerical notes
    text: 'Trapezoidal rule (``numpy.trapezoid``) on the supplied samples; the result is

      returned only at the sample points and is second-order accurate in the

      spacing of ``l``.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.2 (flux functions).
  - label: '2'
    text: O. Sauter and S. Yu. Medvedev, Comput. Phys. Commun. 184 (2013) 293, Sec. 2 and Table I (per-radian
      versus full-weber flux).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.psi_normalised
  name: psi_normalised
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (psi, psi_axis, psi_boundary)
  summary: Normalised poloidal flux $\psi_N$.
  description: $$\psi_N = \frac{\psi - \psi_a}{\psi_b - \psi_a}$$
  parameters:
  - name: psi
    type: float or np.ndarray
    unit: Wb/rad or Wb
    description: Poloidal flux.
  - name: psi_axis
    type: float
    unit: Wb/rad or Wb
    description: Flux at the magnetic axis, same unit as ``psi``.
  - name: psi_boundary
    type: float
    unit: Wb/rad or Wb
    description: Flux at the plasma boundary, same unit as ``psi``.
  returns:
  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Normalised flux, 0 on axis and 1 at the boundary.
  sections:
  - title: Convention
    text: 'Independent of the $2\pi$ storage convention and of the COCOS sign, because

      both cancel in the ratio, provided all three inputs share one convention.

      Equals the IMAS ``profiles_1d.psi_norm`` label.'
  - title: Limitations
    text: 'Divides by ``psi_boundary - psi_axis`` without a guard; a degenerate

      equilibrium with equal axis and boundary flux returns ``inf``/``nan``.

      Tracked in #357.'
  - title: See Also
    text: vaft.formula.utils.normalize_profile
  references: []
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: equilibrium.q_cyl_from_B_R_epsilon_kappa_I
  name: q_cyl_from_B_R_epsilon_kappa_I
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (B_t_T, R_geo_m, epsilon, kappa_a, I_p_A)
  summary: Cylindrical safety factor in the Verdoolaege convention.
  description: $$q_{cyl} = 5\times10^{6}\,\frac{B_t\,R_{geo}\,\varepsilon^2\,\kappa_a}{I_p\,[\mathrm{A}]}$$
  parameters:
  - name: B_t_T
    type: float or np.ndarray
    unit: T
    description: Toroidal field, strictly positive.
  - name: R_geo_m
    type: float or np.ndarray
    unit: m
    description: Geometric major radius, strictly positive.
  - name: epsilon
    type: float or np.ndarray
    unit: '-'
    description: Inverse aspect ratio, strictly positive.
  - name: kappa_a
    type: float or np.ndarray
    unit: '-'
    description: Area elongation, strictly positive.
  - name: I_p_A
    type: float or np.ndarray
    unit: A
