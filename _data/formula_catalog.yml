    text: 'Sign follows ``dphi``: a paramagnetic (low-$\beta_p$) plasma increases the

      toroidal flux and gives $\hat\mu_i > 0$ in the sign convention of the

      diamagnetic loop; check the loop''s polarity before comparing with a virial

      closure.  $\Delta\phi$ is a full-weber toroidal flux.'
  - title: Assumptions
    text: 'Large-aspect-ratio expansion of the toroidal-field energy term, $B_t R_0$

      constant over the cross-section.'
  references:
  - label: '1'
    text: L. L. Lao, H. St. John, R. D. Stambaugh and W. Pfeiffer, Nucl. Fusion 25 (1985) 1421, Sec. 2
