  signature: (Te_eV, a_minor, B_t, m_e=9.10938356e-31)
  summary: Electron gyroradius figure $\sqrt{T_e}\,a/B_t$ (as implemented).
  description: $$\rho_*^{\mathrm{(impl)}} = \frac{\sqrt{T_e}}{B_t}\,a$$
  parameters:
  - name: Te_eV
    type: float
    unit: eV
    description: Electron temperature.
  - name: a_minor
    type: float
    unit: m
    description: Minor radius.
  - name: B_t
    type: float
    unit: T
    description: Toroidal field.
