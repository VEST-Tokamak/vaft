  summary: Exact free-space axisymmetric Green's function and its derivatives.
  description: "$$G(r, z; r_0, z_0) = \\frac{\\sqrt{rr_0}}{k}\\left[(2 - k^2)K(k^2) - 2E(k^2)\\right],\
    \ \\qquad\n  k^2 = m = \\frac{4rr_0}{(r + r_0)^2 + (z - z_0)^2}$$\n\nso that $\\psi = \\mu_0 I\\,G$\
    \ is the poloidal flux of a ring current $I$;\n``mode`` selects $G$, $\\partial G/\\partial r$, $\\\
    partial G/\\partial z$,\n$\\partial^2G/\\partial r\\partial z$, $\\partial^2G/\\partial r^2$, or the\
    \ raw\n$K$ and $E$."
  parameters:
  - name: r
    type: array-like
    unit: m
    description: Observation major radius.
  - name: z
    type: array-like
    unit: m
    description: Observation height.
  - name: r0
    type: array-like
    unit: m
    description: Source major radius.
  - name: z0
    type: array-like
    unit: m
    description: Source height.
  - name: mode
    type: str, optional
    unit: str
    description: One of ``GREEN_EXACT_MODES``; default ``"psi"``.
  returns:
  - name: null
    type: np.ndarray
    unit: any
    description: Requested quantity, broadcast over all four coordinates. $G$ is in m, its derivatives
      in m per m, $K$ and $E$ dimensionless.
  sections:
  - title: Raises
    text: "ValueError\n    Unknown ``mode`` or coordinates giving $m$ outside $[0, 1]$."
  - title: Convention
    text: 'Full weber: $\psi = \mu_0 G$ per ampere (same as ``green_r``), and

      $B_z = +\mu_0/(2\pi r)\,\partial G/\partial r$, $B_r = -\mu_0/(2\pi r)\,

      \partial G/\partial z$.  The equilibrium helpers assume flux per radian by

      default, so divide by $2\pi$ (or pass ``cocos``) before feeding this flux to

      ``vaft.formula.equilibrium.vertical_magnetic_field_from_psi``.'
  - title: Limitations
    text: 'Points with $rr_0 = 0$ return their analytic limits (0 for every mode except

      ``d2psi_dr2``, whose on-axis limit is $\pi r_0^2/(r_0^2 + (z - z_0)^2)^{3/2}$).

      The elliptic parameter is clamped just below 1, so a coincident observer and

      source return finite numbers, but those are artifacts of the clamp, not

      physical limits (the ideal-filament self term diverges): handle genuinely

      coincident pairs yourself, e.g. with ``self_inductance`` or a

      shifted-evaluation scheme such as ``compute_br_bz_phi``.'
  - title: Numerical notes
    text: '``scipy.special.ellipk``/``ellipe`` on the parameter $m$; every $1/k$,

      $1/m$ and $1/r$ is guarded and overwritten on axis.  The ``d2psi_dr2``

      branch corrects a sign error in the legacy VFIT ``getGreenFunction.m``

      case 7 ($-2(r + r_0)A$, from $d(1/D)/dr = -D''/D^2$) and is validated

      against finite differences of ``dpsi_dr``.'
  references:
  - label: '1'
    text: J. D. Jackson, *Classical Electrodynamics*, 3rd ed., Wiley (1999), Sec. 5.5, Eq. (5.37).
  - label: '2'
    text: Legacy VFIT ``getGreenFunction.m`` (modes 1-7), the reference algorithm.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
