- id: green.greens_function_2d
  name: greens_function_2d
  category: green
  module: vaft.formula.green
  signature: (R, Z, R0, Z0)
  summary: Axisymmetric kernel $\sqrt{RR_0}\,K(m)$ between a field point and a ring source.
  description: "$$G_{2D} = \\sqrt{R R_0}\\;K(m), \\qquad\n  m = \\frac{4RR_0}{(R + R_0)^2 + (Z - Z_0)^2}$$"
  parameters:
