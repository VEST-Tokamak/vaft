- id: equilibrium.loop_voltage_from_total_flux
  name: loop_voltage_from_total_flux
  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (time_slice, psi_boundary)
  summary: Surface loop voltage from the time series of boundary flux.
  description: $$V_{\mathrm{loop}} = \frac{d\Phi_{\mathrm{surface}}}{dt} = 2\pi\,\frac{d\psi_b}{dt}$$
  parameters:
  - name: time_slice
    type: np.ndarray
    unit: s
    description: Time of each sample, monotonic.
  - name: psi_boundary
    type: np.ndarray
    unit: Wb/rad
    description: Boundary poloidal flux at each time.
  returns:
  - name: null
    type: np.ndarray
    unit: V
    description: Loop voltage at the plasma surface at each time.
  sections:
  - title: Convention
    text: 'Assumes ``psi_boundary`` per radian, as ``surface_poloidal_flux_from_psi_boundary``

      does; a full-weber IMAS flux gives a voltage $2\pi$ too large.  The sign is

      that of $d\psi_b/dt$ in the supplied COCOS, so a discharge with positive

      current and the usual $\sigma_{B_p}$ shows negative $V_{loop}$ during ramp-up.

      Tracked in #354.'
  - title: Physical interpretation
    text: 'Sum of resistive and inductive voltage at the last closed flux surface, the

      quantity a flux loop on the boundary would read.'
  - title: Numerical notes
    text: '``numpy.gradient`` in time (second-order interior, first-order ends); noisy

      $\psi_b$ reconstructions need smoothing first.'
  references:
  - label: '1'
    text: S. Ejima et al., Nucl. Fusion 22 (1982) 1313, Sec. 2.
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
