  category: equilibrium
  module: vaft.formula.equilibrium
  signature: (R, Z)
  summary: Plasma volume from a boundary polygon, mean-radius approximation.
  description: $$V = 2\pi\oint R\,Z\,dR \approx 2\pi\,A_{\mathrm{poly}}\,\bar R$$
  parameters:
  - name: R
    type: np.ndarray
    unit: m
    description: Major radius of the boundary vertices, closed or open polygon.
  - name: Z
    type: np.ndarray
    unit: m
    description: Height of the boundary vertices.
  returns:
  - name: null
    type: float
    unit: m^3
    description: Volume of the solid of revolution.
  sections:
  - title: Assumptions
    text: '$\bar R$ is the *arithmetic* mean of the vertex radii, not the area centroid

      demanded by Pappus'' theorem; exact only for a boundary symmetric about

      $\bar R$.'
  - title: Limitations
    text: 'On VEST flux surfaces the mean-radius factorisation differs from the exact

      contour integral by up to ~6 % at the edge; use

      ``exact_volume_from_RZ_contour`` for a reported volume.'
  - title: Numerical notes
    text: 'Shoelace formula for the polygon area (exact for straight edges); the polygon

      is implicitly closed by ``numpy.roll``.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.1 (plasma volume of a
      toroidal cross-section).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.ballooning_alpha_from_p_B_R
  name: ballooning_alpha_from_p_B_R
  category: stability
  module: vaft.formula.stability
  signature: (p, B, R)
  summary: Normalised pressure gradient of the $s$-$\alpha$ ballooning model, without $q^2$.
  description: $$\alpha = -\frac{2\mu_0 R}{B^2}\,\frac{dp}{dR}$$
  parameters:
  - name: p
    type: float or np.ndarray
    unit: Pa
    description: Pressure along a radial cut.
  - name: B
    type: float or np.ndarray
    unit: T
    description: Magnetic field strength.
  - name: R
    type: float or np.ndarray
    unit: m
    description: Major radius of the samples, monotonic.
  returns:
  - name: null
    type: float or np.ndarray
    unit: '-'
    description: Ballooning parameter as defined above.
  sections:
  - title: Convention
    text: 'Connor, Hastie and Taylor define $\alpha = -2\mu_0 R q^2\,(dp/dr)/B^2$ with

      $r$ the minor radius.  This routine omits the $q^2$ factor and

      differentiates against the major radius $R$, so it returns the standard

      $\alpha$ divided by $q^2$; multiply by $q^2$ before reading it against the

      $s$-$\alpha$ diagram.  Tracked in #364.'
  - title: Numerical notes
    text: '``numpy.gradient`` along the supplied axis (second-order interior, first-order

      ends), sign-sensitive to the direction of ``R``.'
  references:
  - label: '1'
    text: J. W. Connor, R. J. Hastie and J. B. Taylor, Phys. Rev. Lett. 40 (1978) 396, Eq. (2).
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 6.13 (ballooning modes).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.ballooning_stability_criterion
  name: ballooning_stability_criterion
  category: stability
  module: vaft.formula.stability
  signature: (alpha, s)
  summary: Distance from the first ballooning stability boundary $\alpha_{crit} \approx 0.6\,s$.
  description: $$\Delta = \alpha - \alpha_{crit}, \qquad \alpha_{crit} = 0.6\,s$$
  parameters:
  - name: alpha
    type: float or np.ndarray
    unit: '-'
    description: Ballooning parameter in the Connor-Hastie-Taylor normalisation.
  - name: s
    type: float or np.ndarray
    unit: '-'
    description: Magnetic shear.
  returns:
  - name: margin
    type: float or np.ndarray
    unit: '-'
    description: $\alpha - \alpha_{crit}$; positive means unstable.
  - name: alpha_crit
    type: float or np.ndarray
    unit: '-'
    description: The threshold $0.6\,s$.
  sections:
  - title: Validity
    text: 'Empirical fit.  A straight-line approximation of the first-stability

      boundary of the circular $s$-$\alpha$ diagram [1] for moderate shear

      ($0.3 \lesssim s \lesssim 1.5$); the true boundary bends over and closes at

      $\alpha \approx 1$, with second stability beyond.'
  - title: Limitations
    text: 'Ignores shaping, which raises the boundary, and the second-stable region;

      uncited coefficient (read from the diagram).'
  references:
  - label: '1'
    text: J. W. Connor, R. J. Hastie and J. B. Taylor, Phys. Rev. Lett. 40 (1978) 396, Fig. 1.
  - label: '2'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 6.13.
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.beta_N_from_beta_a_B0_Ip
  name: beta_N_from_beta_a_B0_Ip
  category: stability
  module: vaft.formula.stability
  signature: (beta, a, B0, I_p)
  summary: Normalised beta evaluated literally as $\beta\,a\,B_0/I_p$.
  description: $$\beta_N = \frac{\beta\,a\,B_0}{I_p}$$
  parameters:
  - name: beta
    type: float
    unit: '-'
    description: Toroidal beta as a fraction.
  - name: a
    type: float
    unit: m
    description: Minor radius.
  - name: B0
    type: float
    unit: T
    description: Toroidal field on axis.
  - name: I_p
    type: float
    unit: A
    description: Plasma current.
  returns:
  - name: null
    type: float
    unit: m T/A
    description: The ratio in fraction-metre-tesla per ampere.
  sections:
  - title: Convention
    text: 'The community $\beta_N$ (Troyon) is quoted in %·m·T/MA, i.e. $\beta$ in

      percent and $I_p$ in MA, and the Troyon limit is $\beta_N \lesssim 2.8$ in

      those units.  This function does not rescale: with the SI inputs above the

      result is $10^{-8}$ times the conventional number.  Feed $\beta$ in percent

      and $I_p$ in MA to obtain it directly.  Tracked in #349.'
  references:
  - label: '1'
    text: F. Troyon et al., Plasma Phys. Control. Fusion 26 (1984) 209.
  - label: '2'
    text: ITER Physics Expert Groups, Nucl. Fusion 39 (1999) 2175, Ch. 3, Sec. 2.1 (definition of $\beta_N$).
  empirical: false
  convention_sensitive: true
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.beta_pol_from_beta_tor
  name: beta_pol_from_beta_tor
  category: stability
  module: vaft.formula.stability
  signature: (beta_tor, q_95)
  summary: Poloidal beta from toroidal beta, $\beta_p = \beta_t\,q_{95}^2$.
  description: $$\beta_p = \beta_t\,q_{95}^2$$
  parameters:
  - name: beta_tor
    type: float
    unit: '-'
    description: Toroidal beta.
  - name: q_95
    type: float
    unit: '-'
    description: Safety factor at the 95% flux surface.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Poloidal beta.
  sections:
  - title: Assumptions
    text: Circular, large-aspect-ratio cylinder in which $B_p/B_t = \varepsilon/q$.
  - title: Limitations
    text: 'The cylindrical relation is $\beta_p = \beta_t\,(q/\varepsilon)^2$; the

      $1/\varepsilon^2$ is missing here, so the result equals the standard value

      only at $\varepsilon = 1$ and underestimates $\beta_p$ by $\varepsilon^2$

      otherwise.  Tracked in #363.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.5 (relation between $\beta$,
      $\beta_p$ and $q$).
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.beta_stability_boundary
  name: beta_stability_boundary
  category: stability
  module: vaft.formula.stability
  signature: (beta_N, q_95)
  summary: Heuristic beta margin against $\beta_{N,crit} = 0.028\,q_{95}$.
  description: $$\Delta = \beta_N - \beta_{N,crit}, \qquad \beta_{N,crit} = 0.028\,q_{95}$$
  parameters:
  - name: beta_N
    type: float
    unit: '-'
    description: Normalised beta as a fraction (Troyon's 2.8 % is 0.028).
  - name: q_95
    type: float
    unit: '-'
    description: Safety factor at the 95% flux surface.
  returns:
  - name: margin
    type: float
    unit: '-'
    description: $\beta_N - \beta_{N,crit}$; positive means the limit is exceeded.
  - name: beta_N_crit
    type: float
    unit: '-'
    description: The threshold $0.028\,q_{95}$.
  sections:
  - title: Validity
    text: 'Empirical fit.  The fraction-convention twin of

      ``kink_stability_criterion`` (2.8 versus 0.028); the Troyon coefficient

      [1] is the only sourced part, the $q_{95}$ factor is not.

      ``plasma_stability_margins`` builds on this function, so it lives in

      the fraction convention.  Tracked in #350.'
  references:
  - label: '1'
    text: F. Troyon et al., Plasma Phys. Control. Fusion 26 (1984) 209.
  empirical: true
  convention_sensitive: false
  deprecated: false
  aliases: []
  shadowed_by: null
- id: stability.beta_tor_from_beta_pol
  name: beta_tor_from_beta_pol
  category: stability
  module: vaft.formula.stability
  signature: (beta_pol, q_95)
  summary: Toroidal beta from poloidal beta, $\beta_t = \beta_p/q_{95}^2$.
  description: $$\beta_t = \frac{\beta_p}{q_{95}^2}$$
  parameters:
  - name: beta_pol
    type: float
    unit: '-'
    description: Poloidal beta.
  - name: q_95
    type: float
    unit: '-'
    description: Safety factor at the 95% flux surface.
  returns:
  - name: null
    type: float
    unit: '-'
    description: Toroidal beta.
  sections:
  - title: Assumptions
    text: Circular, large-aspect-ratio cylinder; inverse of ``beta_pol_from_beta_tor``.
  - title: Limitations
    text: 'Missing $\varepsilon^2$ factor of the cylindrical relation $\beta_t =

      \beta_p\,\varepsilon^2/q^2$, as for ``beta_pol_from_beta_tor``.

      Tracked in #363.'
  references:
  - label: '1'
    text: J. Wesson, *Tokamaks*, 4th ed., Oxford University Press (2011), Sec. 3.5.
  empirical: false
  convention_sensitive: false
  deprecated: false
  aliases: []
