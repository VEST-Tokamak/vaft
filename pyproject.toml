[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaft"
authors = [
  { name = "VEST team", email = "peppertonic18@snu.ac.kr" },
]
description = "Versatile Analysis Framework for Tokamak"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dynamic = ["version"]
keywords = ["tokamak", "imas", "omas", "fusion", "vest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "astropy==6.1.7",
  "cryptography>=42.0.0",
  "fortranformat",
  "f90nml>=1.4.4",
  "h5py==3.16.0",
  "h5pyd==0.20.0",
  "imageio>=2.34.0",
  "ipykernel>=6.29.4",
  "ipython",
  "ipywidgets",
  "matplotlib>=3.7.3,<4",
  "mysql-connector-python>=8.4.0",
  "numba",
  "numpy>=2.0.0,<3",
  "omas==0.94.2",
  "openpyxl",
  "opencv-python>=4.9.0.80",
  "pandas>=2.2.2",
  "pyjwt",
  "PyYAML==6.0.2",
  "requests-unixsocket==0.4.1",
  "scikit-image",
  "scikit-learn",
  "scipy>=1.13.0,<2",
  "seaborn",
  "setuptools>=64.0.0,<81.0.0",
  "snakemake",
  "statsmodels==0.14.6",
  "tqdm>=4.67.3",
  "uncertainties==3.2.2",
  "urllib3==1.26.13",
  "wexpect; sys_platform == 'win32'",
  "xarray>=2024.4.0",
  "imas_core>=5.6.0,<6",
  "imas_python>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pre-commit",
  "black",
  "flake8",
  "ipykernel>=7.2.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.urls]
homepage = "https://vest-tokamak.github.io/vaft/"
source = "https://github.com/VEST-Tokamak/vaft"

[tool.setuptools.dynamic]
version = { attr = "vaft.version.__version__" }

[tool.setuptools.packages.find]
include = ["vaft*"]

[tool.setuptools]
# Ship only the package data explicitly listed below.  Repository samples stay
# available to GitHub users but are not pulled into PyPI distributions.
include-package-data = false

[tool.setuptools.package-data]
vaft = [
  ".hscfg.example",
  "machine_mapping/vest.yaml",
  "data/geometry/Coil_info.mat",
  "data/geometry/VEST_DiscretizedCoilGeometry_Full_ver_1906.mat",
  "data/geometry/VEST_DiscretizedCoilGeometry_Full_ver_2507.mat",
  "data/geometry/VEST_em_coupling_pf_versions.npz",
  "data/geometry/VEST_static_geometry.json.gz",
  "data/geometry/*.yaml",
  "data/geometry/*.csv",
  "data/geometry/camera_visible/*.json",
  "data/gpec/*.in",
  "data/gpec/*.dat",
  "data/legacy/*.txt",
  "data/legacy/*.yaml",
  "data/legacy/sxr_te_ratio_be_al.csv",
  "data/omas/39915.json",
]

[tool.uv.sources]
imas_core = [
  { git = "https://github.com/iterorganization/IMAS-Core", tag = "5.6.0" }
]

[tool.pytest.ini_options]
markers = [
  "integration: explicit read-only HSDS or IMAS integration test",
]
