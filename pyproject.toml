[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaft"
authors = [
  { name = "VEST team", email = "peppertonic18@snu.ac.kr" },
]
description = "Versatile Analysis Framework for Tokamak"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
dynamic = ["version"]
keywords = ["tokamak", "imas", "omas", "fusion", "vest"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
  "cryptography>=42.0.0",
  "fortranformat",
  "f90nml>=1.4.4",
  "h5py==3.16.0",
  "h5pyd==0.20.0",
  "imageio>=2.34.0",
  "ipykernel>=6.29.4",
  "ipython",
  "ipywidgets",
  "matplotlib>=3.7.3,<4",
  "plotly>=5.24,<7",
  "mysql-connector-python>=8.4.0",
  "numpy>=2.0.0,<3",
  "omas==0.94.2",
  "openpyxl",
  "opencv-python>=4.9.0.80",
  "pandas>=2.2.2",
  "pyjwt",
  "PyYAML==6.0.2",
  "requests-unixsocket==0.4.1",
  "scikit-image",
  "scipy>=1.13.0,<2",
  "seaborn",
  "setuptools>=64.0.0,<81.0.0",
  "snakemake",
  "statsmodels==0.14.6",
  "tqdm>=4.67.3",
  "uncertainties==3.2.2",
  "urllib3==1.26.13",
  "wexpect; sys_platform == 'win32'",
  "xarray>=2024.4.0",
  # omas needs it to serialize equilibrium.code.parameters (the EFIT
  # namelists a g-file/k-file carries) and only declares it behind an extra.
  "xmltodict>=0.13.0",
  "imas_core>=5.6.0,<6",
  "imas_python>=2.1.0,<3",
]

[project.scripts]
vaft = "vaft.cli._main:main"

[project.optional-dependencies]
# scikit-learn is needed only by `fit_profile(fitting_function='gp_sklearn')`.
# The default 'gp' mode is implemented against scipy, so the package no longer
# pays a heavy import for one optional fitting backend (#426).
sklearn = ["scikit-learn"]
# onnxruntime is needed only by `vaft.code.gacode.tglf.surrogate` when it actually
# runs a network. Resolving a model and auditing an input against its training
# distribution need neither the runtime nor a prediction, so the decision "does this
# model apply to this plasma" stays answerable without a heavy ML dependency (#553).
surrogate = ["onnxruntime"]
# TokaMaker is the one external code VAFT drives in-process rather than as a
# subprocess, so "installed" means "importable in this interpreter" and pip can
# express it -- unlike CHEASE, GPEC, GACODE or NUBEAM, which are Fortran builds
# with no packaging and live behind install/. It stays optional all the same:
# the wheel carries compiled libraries, and every other workflow works without
# it. vaft.code.tokamaker raises an actionable ImportError when it is absent.
tokamaker = ["openfusiontoolkit"]
# The neural-network backend of vaft.process.ml (#669). Importing vaft.process.ml
# needs none of it: the dataset, split, artifact and registry contract run on
# NumPy, and torch is imported only when a ModelSpec names backend="torch". onnx
# is what torch's exporter writes with; onnxruntime checks the exported graph.
# Kept out of [dev]: the default Linux torch wheel pulls CUDA, so CI installs
# the CPU wheel explicitly instead (package-ci.yml).
ml = ["torch", "onnx", "onnxruntime"]
# Numba is reserved for measured acceleration work (#1013) and is not a runtime
# dependency: no VAFT module imports it yet. It used to be required, but
# electromagnetics.py only checked whether it imported and printed a warning when
# it did not. Keeping it required would cost every install a compiled
# dependency, and on Python 3.15 its missing wheels would block installation
# entirely. A kernel that later adopts it must keep a NumPy fallback that
# produces the same result, and must import numba lazily inside that kernel.
accel = ["numba"]
dev = [
  "pytest",
  # so the surrogate's arithmetic check actually runs on the gate. CI installs
  # [dev], and without the runtime every inference test skips -- an inverted
  # denormalisation would then pass CI green.
  "onnxruntime",
  # for test_fit_profile_gp_backends.py, which compares the two GP backends
  "scikit-learn",
  # The suite is 4800+ largely independent tests; running them on one core is
  # what made the required CI check a 20-minute gate (issue #413).
  "pytest-xdist",
  "pre-commit",
  "black",
  "flake8",
  # F821 (undefined name) is a required check on vaft/formula/. flake8 carries
  # the same pyflakes code, but ruff runs it over the tree in well under a
  # second, which is what makes it affordable as a gate rather than a nightly
  # (issue #753).
  "ruff",
  "ipykernel>=7.2.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.urls]
homepage = "https://vest-tokamak.github.io/vaft/"
source = "https://github.com/VEST-Tokamak/vaft"

[tool.setuptools.dynamic]
version = { attr = "vaft.version.__version__" }

[tool.setuptools.packages.find]
include = ["vaft*"]
# The documentation site under docs/ is repository-only.  `include` already
# keeps it out, since it is not a `vaft*` package, but the exclusion belongs in
# the file a packaging change is reviewed in rather than resting on an omission
# -- MANIFEST.in prunes it from the sdist for the same reason.
exclude = ["docs*"]

[tool.setuptools]
# Ship only the package data explicitly listed below.  Repository samples stay
# available to GitHub users but are not pulled into PyPI distributions.
include-package-data = false

[tool.setuptools.package-data]
vaft = [
  ".hscfg.example",
  "machine_mapping/vest.yaml",
  "data/geometry/Coil_info.mat",
  "data/geometry/VEST_DiscretizedCoilGeometry_Full_ver_1906.mat",
  "data/geometry/VEST_DiscretizedCoilGeometry_Full_ver_2507.mat",
  "data/geometry/VEST_em_coupling_pf_versions.npz",
  "data/geometry/VEST_passive_wall_2409.npz",
  "data/geometry/VEST_static_geometry.json.gz",
  "data/geometry/*.yaml",
  "data/geometry/*.csv",
  "data/geometry/camera_visible/*.json",
  "data/gpec/*.in",
  "data/gpec/*.dat",
  "data/legacy/*.txt",
  "data/legacy/*.yaml",
  "data/legacy/sxr_te_ratio_be_al.csv",
  # Read by machine_mapping.langmuir_probes() on every call; without it a wheel
  # install leaves position.r unset where a source checkout fills it.
  "data/legacy/langmuir_probe_positions.csv",
  "data/samples/*/manifest.yaml",
  "data/samples/39915/omas.json.gz",
  "data/samples/39915/imas.nc",
  # The authored TikZ template vaft.diagram renders every scene into.
  "diagram/templates/*.tex",
]

[tool.uv.sources]
imas_core = [
  { git = "https://github.com/iterorganization/IMAS-Core", tag = "5.6.0" }
]

[tool.pytest.ini_options]
markers = [
  # Applied centrally by test/conftest.py from the declared list in
  # test/core_selection.py, never written into a test module by hand.
  "core: fast development-confidence selection; the required gate on develop",
  "integration: explicit read-only HSDS or IMAS integration test",
  "perf: performance budget benchmarks",
  "slow: release-confidence check; runs on the main gate, not on develop",
]
