corrections:
- issue: 288
  field: magnetics.b_field_pol_probe.:.poloidal_angle
  from: pi/2
  to: 3*pi/2
  reason: 'The IMAS DD defines poloidal_angle as a clockwise angle from +R, so a probe
    measuring +Bz is 3*pi/2. This wheel variant carried pi/2, which declares -Bz to
    a DD-conformant reader and, since setup.py substitutes these files into every
    build, would have shipped an inverted probe response while the consumer
    projection moved to (cos, -sin). Applied in place to match
    vaft/data/samples/39915: the mapper writes this leaf as a constant, no stage
    output depends on it, and the reference generators were corrected in the same
    change to read POLOIDAL_ANGLE so a regeneration now reproduces this value. The
    pipeline stage hashes are therefore unchanged and still describe the run that
    produced the rest of the artifact.'
