# http-level settings for the vaft gui TEST instance (#1862), for
# /etc/nginx/conf.d/vaft-gui-test.conf (Ubuntu's nginx.conf includes conf.d/*.conf
# inside http {}). Its own login rate-limit zone: test sign-ins never use up the
# production /gui/login budget of a shared address.
limit_req_zone $binary_remote_addr zone=vaft_gui_test_login:10m rate=10r/m;
