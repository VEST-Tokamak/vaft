# Locations for the isolated vaft gui TEST instance (#1862), at /gui-test/.
#
# Additive: include this file INSIDE the existing `listen 443 ssl` server of the
# production vaft-gui site that is live on the host (on vestserver:
# /etc/nginx/sites-available/vaft-gui, which ends in `location / { return 404; }`),
# next to its /gui/ locations:
#     include /etc/nginx/snippets/vaft-gui-test-locations.conf;
# It reuses that server's TLS and its websocket `map`, and needs the test
# instance's own rate-limit zone from nginx-vaft-gui-test-http.conf (conf.d).
# Nothing else in the site changes. Rollback: remove the include line and the
# conf.d file, `nginx -t && systemctl reload nginx`.
#
# Not public: only the internal networks listed below may reach it. Fill in
# the approved ranges before installing; keep `deny all` last.

location = /gui-test {
    return 301 /gui-test/;
}

location /gui-test/ {
    allow 127.0.0.1;
    # allow <approved internal CIDR>;   e.g. the lab subnet -- to be approved
    deny all;

    location = /gui-test/login {
        limit_req zone=vaft_gui_test_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:5016;
        include /etc/nginx/snippets/vaft-gui-test-proxy-headers.conf;
    }

    proxy_pass http://127.0.0.1:5016;
    include /etc/nginx/snippets/vaft-gui-test-proxy-headers.conf;
}
