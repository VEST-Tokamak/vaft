# /etc/nginx/snippets/vaft-gui-test-proxy-headers.conf, included by
# nginx-vaft-gui-test-locations.conf next to its proxy_pass (port 5016).
# Same websocket and timeout settings as the production vaft-gui-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $vaft_gui_connection;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
client_max_body_size 20m;
