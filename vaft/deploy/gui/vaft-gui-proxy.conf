# /etc/nginx/snippets/vaft-gui-proxy.conf, included by nginx-vaft-gui.conf.
# `vaft gui --prefix /gui` expects the /gui path as is: no trailing slash on
# proxy_pass, so nginx passes the URI through unchanged.
proxy_pass http://127.0.0.1:5006;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $vaft_gui_connection;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# The page is one long-lived websocket; plots stream back over it.
proxy_buffering off;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
client_max_body_size 20m;
