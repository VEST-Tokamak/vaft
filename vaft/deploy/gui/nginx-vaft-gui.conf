# nginx for a hosted `vaft gui` at https://vest.hsds.snu.ac.kr/gui/, next to HSDS.
#
# Replaces /etc/nginx/sites-available/vest.hsds.snu.ac.kr. Port 80 keeps
# serving HSDS exactly as before (h5pyd clients are configured with http://),
# and sends /gui to HTTPS; port 443 serves both.
#
# Certificate (as root, port 80 reachable from the internet):
#   apt install certbot python3-certbot-nginx
#   certbot certonly --webroot -w /var/www/html -d vest.hsds.snu.ac.kr
# then: nginx -t && systemctl reload nginx

# At http level (sites-enabled files are included inside http {}).
# Throttles password guessing on the GUI's login form.
limit_req_zone $binary_remote_addr zone=vaft_gui_login:10m rate=10r/m;
limit_req_status 429;

map $http_upgrade $vaft_gui_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name vest.hsds.snu.ac.kr;

    # certbot --webroot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /gui {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    # nginx 1.18 (Ubuntu 22.04) spells http2 on the listen line.
    listen 443 ssl http2;
    server_name vest.hsds.snu.ac.kr;

    ssl_certificate     /etc/letsencrypt/live/vest.hsds.snu.ac.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vest.hsds.snu.ac.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    location = /gui {
        return 301 /gui/;
    }

    location = /gui/login {
        limit_req zone=vaft_gui_login burst=5 nodelay;
        include /etc/nginx/snippets/vaft-gui-proxy.conf;
    }

    location /gui/ {
        include /etc/nginx/snippets/vaft-gui-proxy.conf;
    }

    # HSDS over HTTPS too, for clients that switch to https://.
    location / {
        proxy_pass http://localhost:5101;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
