description: >
  VEST outboard Mirnov fluctuation-array metadata (issue #155). 30 raw-voltage
  channels at three toroidal locations (45/135/225 deg), two vertical
  sub-arrays each (L1, L2) of five probes. These probes became physically
  operational starting shot 44156; entries are only mapped for shots at or
  after that boundary (see FLUCTUATION_MIRNOV_FIRST_SHOT in magnetics.py).
  Field 301 carries a DB label typo (OutMirno_225_L2-01, missing the "v");
  raw_label preserves that typo for provenance while identifier is
  normalized. Field 289's gain is estimated, not directly transcribed from a
  calibration sheet (see calibration_provenance below). Order here is the
  canonical physical order (toroidal group, then L1/L2, then z descending)
  and intentionally does not follow raw DB field numbering.
