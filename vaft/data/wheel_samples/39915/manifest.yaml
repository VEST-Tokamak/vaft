corrections:
- issue: 288
  field: magnetics.b_field_pol_probe.:.poloidal_angle
  from: pi/2
  to: 3*pi/2
  reason: 'The IMAS DD defines poloidal_angle as a clockwise angle from +R, so a probe
    measuring +Bz is 3*pi/2. The pipeline wrote pi/2, which declares -Bz to a DD-conformant
    reader. Applied in place rather than by rerunning the pipeline: the mapper writes
    this leaf as a constant and no stage output depends on it. The reference generators
    under workflow/reference_validation were hardcoding pi/2 on both their generate
    and verify paths; they were corrected in the same change to read POLOIDAL_ANGLE,
    so a regeneration now reproduces this value rather than reverting it. The stage
    hashes above are therefore unchanged and still describe the run that produced
    the rest of the artifact.'
- change: semantic emission selector (emission=)
  field: spectrometer_uv.channel.2.processed_line.3.{label,wavelength_central}
  from: CII_3726 / 372.6e-9
  to: CII_4267 / 426.7e-9
  reason: '3726 Angstrom is the well-known [O II] line, which processed_line.5 of
    the same channel already and correctly claims; the representative visible C II
    line the filterscope observes is near 4267 Angstrom. The old pair therefore named
    two different species at one wavelength, which a species-aware selector would
    have resolved to the wrong ion. Applied in place rather than by rerunning the
    pipeline, for the same reason as the #288 correction: the mapper writes both leaves
    as constants from vaft.machine_mapping.spectrometer_uv.SIGNALS, and no stage output
    depends on either, so the intensity series recorded from DAQ field 142 is untouched.
    SIGNALS was corrected in the same change, so a regeneration reproduces these values
    rather than reverting them, and the stage hashes still describe the run that produced
    the rest of the artifact.'
- issue: 1196
  field: magnetics.diamagnetic_flux.0.{data,method_name}, equilibrium.time_slice.:.constraints.diamagnetic_flux.measured
  from: negative for a paramagnetic plasma
  to: positive for a paramagnetic plasma (EFIT's cdflux sign)
  previous_reference_id: vest-39915-until-efit-v4
  previous_canonical_sha256: 5a5f7a6403d76f256b8b78208f601adc709f2b802fc5d8df3cf0686bbe84175d
  reason: 'The mapper port negated the donor''s diamagnetic flux (-1000 where VEST_DiamagneticFlux.m
    has none), so the stored measurement had the opposite sign to EFIT''s cdflux. Applied
    in place, in the canonical source and in both packaged representations, rather than
    by rerunning the pipeline or the generators: data and constraints.measured are exactly
    negated and method_name gains the mapper''s new sign-convention token (11 leaves in
    the canonical source), and a leaf-by-leaf comparison of each rewritten file against
    its previous version shows no other leaf changed -- in particular the signal-quality
    verdicts are the previous ones. constraints.diamagnetic_flux.{reconstructed,chi_squared}
    and the archived k-files stay as EFIT produced them. The mapper was corrected in the
    same change, so a regeneration reproduces these values rather than reverting them,
    and the stage hashes still describe the run that produced the rest of the artifact.'
