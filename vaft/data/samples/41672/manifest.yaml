corrections:
- issue: 288
  field: magnetics.b_field_pol_probe.:.poloidal_angle
  from: pi/2
  to: 3*pi/2
  reason: 'The IMAS DD defines poloidal_angle as a clockwise angle from +R, so a probe
    measuring +Bz is 3*pi/2. The pipeline wrote pi/2, which declares -Bz to a DD-conformant
    reader. Applied in place rather than by rerunning the pipeline: the mapper writes
    this leaf as a constant and no stage output depends on it. The reference generators
    under workflow/reference_validation were hardcoding pi/2 on both their generate
    and verify paths; they were corrected in the same change to read POLOIDAL_ANGLE,
    so a regeneration now reproduces this value rather than reverting it. The stage
    hashes above are therefore unchanged and still describe the run that produced
    the rest of the artifact.'
known_divergences:
- issue: 425
  field: spectrometer_uv.channel.2.processed_line.:.intensity.data
  reason: 'The versatile filterscope is on the fast DAQ at 250 kHz while this grid is
    25 kHz. The values stored here were produced before the mapper anti-aliased that
    10x decimation, so they carry content folded down from above 12.5 kHz. Recorded
    rather than corrected: the generators under workflow/reference_validation select
    from a frozen pipeline product and never call the mapper, so no regeneration this
    artifact supports would change these values, and no test compares them against a
    recomputed mapper output. The next full pipeline re-run from the raw dump will
    change them. The slow-DAQ lines on channels 0 and 1 -- the ones the compact
    reference fixture and the shot summary read -- are unaffected and remain
    bit-for-bit identical.'
