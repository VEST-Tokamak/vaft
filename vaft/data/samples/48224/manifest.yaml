  pressure_weight_note: 'Checked 2026-09-18 (#952), not shipped: rerunning efit_kinetic
    with every FWTPRE multiplied by 0.1 and by 10 gave the same equilibrium to 1e-8
    in psi, p and q (beta_p 0.02898, chi-square pressure 0.398, total 686.93 in all
    three). With the magnetic channels weighted out, the six pressure points are the
    only information on the two p'' coefficients (KPPCUR = 2), so a uniform rescaling
    of their weights multiplies every row that determines those coefficients and cannot
    move the least-squares solution; EFIT''s per-point chi-square ((cpress - pressr)/sigpre)^2
    does not include FWTPRE either. A pressure weight only matters relative to constraints
    that compete with it.'
