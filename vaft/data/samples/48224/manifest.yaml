  notes:
  - 'The magnetic probes are weighted out: BITMPI gives each probe sigma = 1000 T
    (fwtmp2 = 0.001 in the m-file), so they do not shape the fit.'
  - 'The probe measurements carry the sign convention from before #288: expmpi is
    negative (-0.097 to 0 T) where the reconstruction cmpr2 is positive (+0.05 to
    +0.16 T). The fit is unaffected only because the probes are weighted out.'
  - Only 4 of 11 flux loops are enabled (array indices 4, 5, 6 and 10; fwtsi 0.01,
    sigma 100 Wb/rad).
  - EFIT's total chi-square (686.53) is the plasma-current term alone (chipasma),
    which includes the prescribed vessel current EFIT adds after the fit (#918); reconstructed
    Ip equals measured.
  - The measured diamagnetic flux is -7.34 mWb; the reconstruction gives +4.93 mWb
    (SIGDLC 1e7, weighted out).
  - The server g-file's q on axis (6.88) is an axis artifact of that EFIT build; q
    at psi_N = 0.05 is 1.83.
  - efit_status.txt on the server reads 'fail' but describes the last case of that
    batch (00311), not 00300.
