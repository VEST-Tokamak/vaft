conventions:
  psi: psi_N normalised poloidal flux, 0 on axis, 1 at the CHEASE boundary
  cocos: CHEASE g-files keep the source signs (output_cocos='input'; see <case>.cocos_export.json
    in a fresh build); ODS psi in Wb per IMAS DD
  dcon_energy: W_t, W_p, W_v are DCON's normalised least-stable eigenvalues (not joules);
    the sign of W_t is the ideal verdict (#142)
  dcon_eigenfunction: xi.grad(psi) per poloidal harmonic m in Hamada coordinates,
    arbitrary eigenvector normalisation, from MATCH's solutions.bin
  delta_prime: classical (diagonal) RDCON Delta' in ntms.mode[].deltaw[name=classical];
    full complex matrix in mhd_linear.code.parameters
  coil_excitation: I_k = A cos(n phi_k + phase) per sector, A per turn, 20 turns per
    sector (vaft.machine_mapping.coils_non_axisymmetric_geometry.CoilExcitation.from_mode)
  gpec_field: J b.grad(psi) on (psi_N, m), GPEC Hamada coordinates; total resonant
    flux derived by vaft.omas.compute_gpec_resonant_table, vacuum pair copied from
    GPEC
  n_tor: 1
