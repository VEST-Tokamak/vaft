corrections:
- issue: 288
  field: magnetics.b_field_pol_probe.:.poloidal_angle
  from: pi/2
  to: 3*pi/2
  reason: 'The IMAS DD defines poloidal_angle as a clockwise angle from +R, so a probe
    measuring +Bz is 3*pi/2. The pipeline wrote pi/2, which declares -Bz to a DD-conformant
    reader. Applied in place rather than by rerunning the pipeline: the mapper writes
    this leaf as a constant and no stage output depends on it. The reference
    generators under workflow/reference_validation were hardcoding pi/2 on both
    their generate and verify paths; they were corrected in the same change to
    read POLOIDAL_ANGLE, so a regeneration now reproduces this value rather than
    reverting it. The stage hashes above are therefore unchanged
    and still describe the run that produced the rest of the artifact.'
