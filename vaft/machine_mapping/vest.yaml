  # Triple Langmuir probes (issue #152). No unconditional default for
  # vd3/tip_length_mm/tip_radius_mm outside shot_era_overrides -- a shot that
  # matches no era has no valid bias voltage / tip geometry, and the mapper
  # must fail clearly rather than reuse a neighboring era. The documented
  # gaps (mid: 42138-42144, 42641) are intentionally left unlisted so they
  # fall through to that failure.
  langmuir_probes:
    mid:
      source:
        voltage_field: 99
        current_field: 100
        raw_unit: V
        daq_type: fast
      calibration:
        voltage_gain: 22.0
        current_divisor: 100.0
      processing:
        baseline_samples: 500
        # See the note on langmuir_probes.upper.processing.median_kernel.
        median_kernel: null
      ion:
        gas_species: H
      shot_era_overrides:
        - max_shot: 42137
          vd3: 38.0
          tip_length_mm: 1.5
          tip_radius_mm: 0.05
        - min_shot: 42145
          max_shot: 42640
          vd3: 48.0
          tip_length_mm: 2.0
          tip_radius_mm: 0.15
        - min_shot: 42642
          max_shot: 43828
          vd3: 48.0
          tip_length_mm: 2.0
          tip_radius_mm: 0.15
        - min_shot: 43829
          vd3: 57.5
          tip_length_mm: 2.0
          tip_radius_mm: 0.15

    # Upper assembly (raw fields 259/260). Installed starting shot 42675
    # (user-confirmed against the VEST shot log) -- machine_mapping treats it
    # as structurally absent before that shot regardless of what this era
    # table says; the table is still transcribed in full from the issue for
    # provenance.
    upper:
      first_shot: 42675
      source:
        voltage_field: 259
        current_field: 260
        raw_unit: V
        daq_type: fast
      calibration:
        voltage_gain: 22.0
        current_divisor: 100.0
      processing:
        baseline_samples: 500
        # The MATLAB reference applies "a one-dimensional median filter" but
        # issue #152 does not record its kernel size, and no MATLAB source or
        # reference .mat file was available in-repo to recover it (see issue
        # discussion). Left unset (no filtering) rather than guessing a value
        # that could distort the physics; set once the true kernel size is
        # confirmed.
        median_kernel: null
      ion:
        gas_species: H
      shot_era_overrides:
        - max_shot: 42137
          vd3: 43.5
          tip_length_mm: 2.0
          tip_radius_mm: 0.05
        - min_shot: 42145
          max_shot: 43665
          vd3: 64.0
          tip_length_mm: 2.0
          tip_radius_mm: 0.15
        # issue #152 notes the underlying MATLAB conditions overlap at the
        # 43666-44065 boundary; the value below is the issue's own cleaned,
        # single-valued reading of that range, trusted in the absence of the
