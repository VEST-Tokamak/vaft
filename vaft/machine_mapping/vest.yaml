    rogowski_coil:
      label: "Measured Rogowski Coil Current"
      raw:
        gain: 1
        field: 102
        daq_type: 0
        fl_field: 25
        effective_res: 2.8e-4
        baseline_onset: 0.29
      geometry:
        coils:
          - r: 0.45
            z: 0.0
            phi: 0.0
            turns: 1
            area: 0.01

    # Internal Magnetic Probe Array: eight midplane Hall probes.
    # Canonical VAFT sign convention: I_TF = raw_field_1 * -3e4 (see `tf` below)
    # together with an IMPA gain of +2/15 T/V.  The legacy
    # VEST_IMPAProcessing.m pairing (-2/15 with +3e4) is algebraically
    # identical apart from the overall polarity of the reported Bz;
    # vest_impa_position.m already used the convention adopted here.
    impa:
      label: "Internal Magnetic Probe Array"
      channels:
        0:
          label: "IMPA 01"
          field: 114
          daq_type: 0
        1:
          label: "IMPA 02"
          field: 115
          daq_type: 0
        2:
          label: "IMPA 03"
          field: 116
          daq_type: 0
        3:
          label: "IMPA 04"
          field: 117
          daq_type: 0
        4:
          label: "IMPA 05"
          field: 118
          daq_type: 0
        5:
          label: "IMPA 06"
          field: 119
          daq_type: 0
        6:
          label: "IMPA 07"
          field: 120
          daq_type: 0
        7:
          label: "IMPA 08"
          field: 121
          daq_type: 0
      geometry:
        z: 0.0
        radial_pitch: 0.05
        r0_initial: 0.4
        r_bounds: [0.1, 0.8]
        # Explicit shot-era radii take precedence over self-calibration.
        # Left unset because no measured survey exists yet: on shot 39204 the
        # uniform 5 cm model leaves a ~30% residual, so the fitted positions
        # are reported with their quality rather than trusted silently.
        r: null
      calibration:
        type: linear
        gain: 0.13333333333333333   # +2/15 T/V
      processing:
        sample_rate: 25000
        signal_lowpass_hz: 250      # physics waveform (VEST_IMPAProcessing.m)
        position_lowpass_hz: 2500   # legacy position fit (vest_impa_position.m)
        baseline: first_sample
        baseline_samples: 2500
      tf_compensation:
        tf_field: 1
        tf_turns: 24
        tilt_bounds_deg: [-10, 10]
      calibration_window:
        # Tuned against shots 39204 and 44740; a TF-only interval must carry a
        # strong TF drive while the plasma and PF circuits are quiet.
        # A TF-only interval needs a strong TF drive *for that shot*: VEST runs
        # legitimate low-TF shots (39923 peaks at 1.3 kA, 39204 at 12.7 kA), so
        # the threshold is a fraction of the shot's own peak above an absolute
        # floor rather than a fixed ampere count tuned on one shot.
        tf_current_min: 500.0
        tf_current_min_fraction: 0.5
        ip_max: 3000.0
        pf_current_max: 500.0
        min_duration: 0.005
        tf_dynamic_range_min: 0.02
        max_relative_noise: 0.5
        smoothing_samples: 25       # 1 ms: Ip/PF quiet must be sustained
      quality:
        max_normalized_rmse: 0.1
        pitch_tolerance: 0.01

