    # The legacy `rogowski_coil` block was removed in issue #214.
    #
    # It was read by nothing -- its only consumers were the
    # `process_static_geometry` / `process_static_channels` Rogowski branches,
    # which issue #215 made raise because they wrote the non-canonical
    # `rogowski_coil.coil.*` path. What it left behind was actively harmful:
    #
    #   * a second, unrevised copy of the FL10 coefficient (`effective_res:
    #     2.8e-4`), wrong for every shot >= 17455, under a third name. Reading
    #     that stale label as authoritative is what prompted #214;
    #   * duplicates of `field: 109` / `fl_field: 25`, which the live
    #     `plasma_current` block already owns;
    #   * an invented winding geometry (r 0.45, turns 1, area 0.01) that
    #     #215 explicitly declines to map, VEST having no authoritative
    #     contour on record.
    #
    # The canonical sources are `plasma_current` below (channels, calibration,
    # shot eras) and `magnetics.rogowski_coil` in the ODS (the sensors).

    # Internal Magnetic Probe Array: eight midplane Hall probes, plus a
    # co-located Bz sensor per position.  Sign convention: I_TF = raw_field_1
    # * -3e4 (see `tf` below) together with a Hall gain of -2/15 T/V -- the
    # "Data gain" on the array's own DAQ wiring datasheet, the authoritative
    # hardware configuration.  daq_channel is that datasheet's DAQ device/line
    # (Dev8 for Hall, Dev15 for Bz), recorded for provenance only.
    impa:
      label: "Internal Magnetic Probe Array"
      channels:
        0:
          label: "IMPA 01"
          field: 114
          daq_type: 0
          daq_channel: "Dev8/0"
        1:
          label: "IMPA 02"
          field: 115
          daq_type: 0
          daq_channel: "Dev8/1"
        2:
          label: "IMPA 03"
          field: 116
          daq_type: 0
          daq_channel: "Dev8/2"
        3:
          label: "IMPA 04"
          field: 117
          daq_type: 0
          daq_channel: "Dev8/3"
        4:
          label: "IMPA 05"
          field: 118
          daq_type: 0
          daq_channel: "Dev8/4"
        5:
          label: "IMPA 06"
          field: 119
          daq_type: 0
          daq_channel: "Dev8/5"
        6:
          label: "IMPA 07"
          field: 120
          daq_type: 0
          daq_channel: "Dev8/6"
        7:
          label: "IMPA 08"
          field: 121
          daq_type: 0
          daq_channel: "Dev8/7"
      # Vertical-field sensors, one per position (Yang et al., Rev. Sci.
      # Instrum. 85, 11D809 (2014)).  These carry the physics measurement; the
      # Hall channels above establish where they are and how they are aligned.
      # Per the wiring datasheet they are NOT co-located with their same-index
      # Hall sensor -- see geometry.bz_radial_offset below.
      bz_channels:
        0: {label: "IMPA Bz 01", field: 122, daq_type: 0, daq_channel: "Dev15/0"}
        1: {label: "IMPA Bz 02", field: 123, daq_type: 0, daq_channel: "Dev15/1"}
        2: {label: "IMPA Bz 03", field: 124, daq_type: 0, daq_channel: "Dev15/2"}
        3: {label: "IMPA Bz 04", field: 125, daq_type: 0, daq_channel: "Dev15/3"}
        4: {label: "IMPA Bz 05", field: 126, daq_type: 0, daq_channel: "Dev15/4"}
        5: {label: "IMPA Bz 06", field: 127, daq_type: 0, daq_channel: "Dev15/5"}
        6: {label: "IMPA Bz 07", field: 128, daq_type: 0, daq_channel: "Dev15/6"}
        7: {label: "IMPA Bz 08", field: 129, daq_type: 0, daq_channel: "Dev15/7"}

      # Radial-field sensors 130-137 are retired -- the wiring datasheet
      # assigns them no DAQ channel at all, confirming they were never
      # connected, not merely quiet.  The 2014 design used B_R only to confirm
      # the probe sat at the midplane, where B_R ~ 0.  Deliberately not mapped.
      br_channels_retired: [130, 131, 132, 133, 134, 135, 136, 137]

      crosstalk:
        # A slight probe misalignment lets the toroidal field bleed into the
        # vertical-field sensor.  During a TF-only interval the true Bz is
        # negligible, so whatever the Bz sensor reads there is crosstalk, and
        # its ratio to the measured toroidal field gives the incident angle.
        max_angle_deg: 30.0
        min_r_squared: 0.8

      geometry:
        z: 0.0
        radial_pitch: 0.05
        # Fit the effective radial pitch as well as R0: a probe inserted at an
        # angle to the midplane projects its rigid 5 cm spacing onto a shorter
        # radial step, so the ratio recovers the incident angle.
        fit_pitch: true
        # Per the wiring datasheet, the Bz and (retired) Br sensors are not
        # co-located with their same-index Hall sensor: within one probe
        # housing, Hall_i sits at R0+0.05*i, Bz_i at R0+0.01+0.05*i, and
        # Br_i at R0+0.02+0.05*i.  These offsets are fixed hardware, not
        # fitted.
        bz_radial_offset: 0.01
        br_radial_offset: 0.02
        r0_initial: 0.4
        # Upper bound covers the outboard vessel: the verified 2022-04-23
        # alignment shots put the outermost wired channel at ~0.80 m, just
        # outside the outboard magnetic probes at 0.796 m.
        r_bounds: [0.1, 0.9]
        # The array is insertable and its radial position is set per shot, so
        # geometry is normally self-calibrated from the shot's own clean-TF
        # window.  Set explicit radii only for a shot era where the array was
        # surveyed or left fixed; they then take precedence.
        r: null
      calibration:
        type: linear
        # -2/15 T/V, from the DAQ wiring datasheet ("Data gain" column,
        # -0.13333) -- the authoritative hardware configuration, not inferred
        # from either legacy MATLAB script.  Channel-to-DAQ mapping: Hall1-8 =
        # fields 114-121 on Dev8/0-7; Bz1-8 = fields 122-129 on Dev15/0-7;
        # Br1-8 = fields 130-137, no DAQ channel assigned (retired).  Every
        # Hall-type sensor (Hall and Bz) runs off the same 12 V supply.
        gain: -0.13333333333333333
        # The datasheet leaves the Bz "Data gain" column blank -- Bz sensors
        # are wired to a separate DAQ card (Dev15) and their raw-voltage-to-
        # tesla factor is not established.  Do not assume it equals the Hall
        # gain; leave unset until confirmed, so field values stay in their
        # native volts rather than fabricating a Tesla scale from an unverified
        # assumption.
        bz_gain: null
        shot_era_overrides:
          # 2022-04-23 IMPA alignment block (35376-35385).  Verified on
          # 35376-35379 and 35385: with this sign the rigid 5 cm array fits
          # the TF 1/R profile to ~1% with R0 ~ 0.48-0.50 m.
          - min_shot: 35370
            max_shot: 35390
            gain: -0.13333333333333333
            # Field 121 is not wired in this campaign; the array runs seven
            # channels at the same rigid 5 cm pitch.
            channels: [114, 115, 116, 117, 118, 119, 120]
            bz_channels: [122, 123, 124, 125, 126, 127, 128]
      processing:
        sample_rate: 25000
        signal_lowpass_hz: 250      # physics waveform (VEST_IMPAProcessing.m)
        position_lowpass_hz: 2500   # legacy position fit (vest_impa_position.m)
        baseline: first_sample
        baseline_samples: 2500
      tf_compensation:
        tf_field: 1
        tf_turns: 24
        # The 2022-04-23 alignment shots show alpha ~ 1: the probes face the
        # toroidal field and measure it directly.  The legacy +/-10 deg model
        # assumed a near-vertical probe with a small TF pickup, which the data
        # does not support; the bounds are kept for the legacy comparison.
        orientation: toroidal
        alpha_tolerance: 0.15
        tilt_bounds_deg: [-10, 10]
      calibration_window:
        # Tuned against shots 39204 and 44740; a TF-only interval must carry a
        # strong TF drive while the plasma and PF circuits are quiet.
        # A TF-only interval needs a strong TF drive *for that shot*: VEST runs
        # legitimate low-TF shots (39923 peaks at 1.3 kA, 39204 at 12.7 kA), so
        # the threshold is a fraction of the shot's own peak above an absolute
        # floor rather than a fixed ampere count tuned on one shot.
        tf_current_min: 500.0
        tf_current_min_fraction: 0.5
        ip_max: 3000.0
        pf_current_max: 500.0
        min_duration: 0.005
        tf_dynamic_range_min: 0.02
        max_relative_noise: 0.5
        smoothing_samples: 25       # 1 ms: Ip/PF quiet must be sustained
      quality:
        # Set from the verified 2022-04-23 alignment shots, whose rigid-array
        # fits land at 0.07-0.14; shots with a disturbed or absent array sit
        # far above this.
        max_normalized_rmse: 0.15
        pitch_tolerance: 0.015

  # Canonical raw-field-first diagnostic definitions.  Existing keys above
  # remain for compatibility with legacy mapping readers.
  diagnostics:
    plasma_current:
      source:
        field: 109
        raw_unit: V
        daq_type: slow
      calibration:
        type: linear
        operation: divide
        factor: 2.0e-5
        output_unit: A
      processing:
        # `reference.mode` selects how the FL10-derived reference waveform is
        # applied to the raw-calibrated plasma current (`ip_shot`):
        #   subtract                 - legacy full-trace baseline-matched
        #                               subtraction (default; unchanged since #135).
        #   subtract_fl10_windowed   - later-era FL10 acquisition/decimation
        #                               path (issue #195), subtracted only
        #                               inside `fl10.subtract_window`.
        #   disabled                 - no FL10 compensation at all; `ip` is
        #                               `ip_shot` unmodified (from #195).
        # FL10 vessel-current compensation (issue #214).
        #
        # `field: 25` is Flux Loop #10 (R = 0.091 m, Z = 0.04 m, inboard /
        # centre column). In THIS path its raw signal is used as a LOOP
        # VOLTAGE and is deliberately NOT integrated -- unlike the generic
        # equilibrium-magnetics path, where flux-loop voltage is integrated
        # into poloidal flux. The two uses of field 25 are different
        # quantities and must not be conflated.
        #
        # Units of `effective_resistance_ohm`, and why it is not called a
        # mutual inductance:
        #
        #   ip_ref = V_FL10 * flux_gain / X   is subtracted from a current,
        #   so X must be in V/A = ohm. An inductance would give V/H = A/s,
        #   which cannot be subtracted from amperes.
        #
        # The donor `vest_ip.m` names this constant `indMutual_FL10_inLimiter`
        # and labels its plots "FL10 Voltage/Mutual Inductance with Inboard
        # Limiter" -- i.e. the donor calls it a mutual inductance between FL10
        # and the inboard limiter. That name is dimensionally inconsistent
        # with the operation the donor itself performs. The dimensional
        # requirement is the harder evidence, so the key is named for the
        # units the formula requires. (An early VAFT config also labelled this
        # value `effective_res`, but that came from the same author porting
        # the same algorithm, so it corroborates nothing on its own and has
        # since been removed.) The conflict with the donor's name is recorded
        # here rather than erased: it is not settled
        # provenance, and resolving it needs VEST calibration documentation.
        #
        # What the compensation term physically represents
        # (corrected 2026-09-01 from VEST operations; supersedes the earlier
        # "dominant passive-current mode" reading):
        #
        #   * The plasma-current channel is the INNER Rogowski coil. In
        #     principle an inner coil links no vessel eddy current at all, so
        #     the compensation is NOT a general vessel-eddy subtraction.
        #   * What it does link is the induced current in the TUNGSTEN LIMITER
        #     surrounding the CS wall. The FL10-derived term has effectively
        #     been used as a proxy measurement of that specific induced
        #     current -- one structure, not a distributed wall mode.
        #   * FL10 still sees TOTAL loop voltage, including PF and plasma
        #     contributions; it is not an "eddy-only" pickup.
        #
        # The scalar `V / R_eff` transfer below is therefore a stand-in for
        # that limiter induced current, and VEST's understanding of how the
        # effective current should be computed HAS CHANGED as of 2026-09-01.
        # The replacement model is not yet specified here, so the donor
        # arithmetic is retained unchanged and this note records that the
        # scalar form is superseded pending that specification. Do not treat
        # `effective_resistance_ohm` as a settled physical constant.
        #
        # Numerical values are unchanged from the donor:
        #   shot <  17455 -> 2.8e-4 ; shot >= 17455 -> 5.0e-4.
        reference:
          mode: subtract
          field: 25
          flux_gain: 11.0
          effective_resistance_ohm: 2.8e-4
          revisions:
            - from_shot: 17455
              to_shot: 46402
              effective_resistance_ohm: 5.0e-4
            - from_shot: 46403
              to_shot: 47116
              mode: subtract_fl10_windowed
              effective_resistance_ohm: 5.0e-4
              fl10:
                # `field` intentionally left equal to the pre-existing
                # `reference.field` (25) pending confirmation against the
                # donor field-mapping table; revisit if evidence indicates
                # a distinct FL10 channel for this era.
                field: 25
                # The donor (`vest_ip.m`) does `time2 = time2 + 0.26` because
                # MATLAB's vest_load returns the fast-DAQ record on a raw
                # 0-based axis. VAFT's loader already applies that same DAQ
                # trigger correction (`_daq_trigger_time_correction`, +0.26 s
                # for shots >= 41660) to every fast record, so re-applying it
                # here would put FL10 at 0.52--0.62 s -- entirely outside the
                # compensation window, silently disabling the correction.
                time_offset_s: 0.0
                decimate_factor: 10
                gain_numerator: 11.0
                smooth_span: 10
                subtract_window: [0.26, 0.36]
                # 1-based MATLAB index from the legacy `ipRef(175)` term;
                # converted to 0-based (174) in Python. See magnetics.py for
                # the documented VAFT interpretation of the degenerate
                # single-point polyfit this offset replaces.
                reference_offset_index: 175
            # Shot >= 47117: the donor drops FL10 compensation entirely
            # (`if shot < 47117 ... else ip = ipShot`) with no comment.
            #
            # The cause is now known (VEST operations, 2026-09-01): the
            # inboard side was changed to CARBON. The induced current in the
            # modified inboard structure is no longer measured by the inner
            # Rogowski coil, so there is nothing left for the FL10 term to
            # compensate and the subtraction is correctly disabled.
            #
            # Boundary resolved empirically against the VEST SQL database
            # (2026-09-01; 361 shots, 46900-47260). There is ONE transition,
            # not two, and #191's `shot >= 47018` is not supported:
            #
            #   * 47113 -> 47114 is a 6.5-day machine access window
            #     (2025-11-06 23:04 -> 2025-11-13 10:52). 47114-47117 are four
            #     vacuum/commissioning shots in a 22-minute block (7-10 kA,
            #     FL10 collapsed to 0.003-0.007 V); plasma resumes at 47118
            #     after a further 4-day gap, at roughly half the previous
            #     current (210-230 kA -> 60-110 kA).
            #   * Reproducing IP from raw signals both with and without the
            #     FL10 term, and scoring the post-discharge residual (where
            #     true Ip must be ~0): compensation improves 23/23 plasma
            #     shots over 47050-47113 and only 5/49 over 47114-47200. The
            #     term stops removing anything real exactly at the break.
            #   * 47018 is 12 minutes after 47017 inside a continuous run day
            #     (2025-11-05, ~12 min cadence). No machine access, and no
            #     step in FL10 amplitude or compensation behaviour there.
            #
            # The physically correct boundary is therefore 47114, the first
            # shot after the intervention. `from_shot` is kept at the donor's
            # 47117 (the last commissioning shot) because 47114-47116 carry no
            # plasma, so the three-shot difference cannot change any result;
            # changing it would alter processed output for no physical gain.
            # See #191 (which needs its 47018 corrected) and #216.
            #
            # `effective_resistance_ohm` is retained for provenance only --
            # `mode: disabled` means it is not read.
            - from_shot: 47117
              mode: disabled
              effective_resistance_ohm: 5.0e-4
        # `baseline.analysis_start/analysis_end` is the shot-era *analysis
        # window* (`xTime` in the legacy `vest_ip.m`). It is NOT the fitted
        # baseline interval. The actual linear-baseline-fit window (`xBase`)
        # is derived in code as the `lookback` samples immediately preceding
        # `analysis_start`, plus `analysis_start` itself.
        baseline:
          analysis_start: 6000
          analysis_end: 8500
          lookback: 500
          revisions:
            - from_shot: 41446
              to_shot: 41451
              analysis_start: 7250
              analysis_end: 8750
            - from_shot: 41660
              to_shot: 43760
              analysis_start: 7250
              analysis_end: 8750
            - from_shot: 43761
              analysis_start: 6000
              analysis_end: 7251
        sign:
          multiply: 1.0
          revisions:
            - from_shot: 20259
              multiply: -1.0
        reference_comparison:
          sample_rate: 25000.0
          cutoff_frequency: 2500.0
          taps: 26
          baseline_index: 7499
      revisions:
        - from_shot: 42851
          calibration:
